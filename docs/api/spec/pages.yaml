  "schemas": {
    "OverviewTask": {
      "type": "object",
      "required": [
        "id",
        "title",
        "status",
        "assigneeUserId",
        "agentId",
        "revision",
        "assigneeName"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "title": {
          "type": "string"
        },
        "status": {
          "type": "string"
        },
        "assigneeUserId": {
          "type": "string",
          "format": "uuid"
        },
        "agentId": {
          "type": [
            "string",
            "null"
          ],
          "format": "uuid"
        },
        "revision": {
          "type": "integer",
          "format": "int64"
        },
        "assigneeName": {
          "type": "string"
        },
        "agentName": {
          "type": "string"
        }
      }
    },
    "PageChange": {
      "type": "object",
      "required": [
        "id",
        "runId",
        "summary",
        "status",
        "createdAt",
        "pageTitle",
        "pageId"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "runId": {
          "type": [
            "string",
            "null"
          ],
          "format": "uuid"
        },
        "summary": {
          "type": "string"
        },
        "status": {
          "type": "string",
          "enum": [
            "applied",
            "proposed",
            "rejected",
            "undone",
            "partially_applied",
            "needs_update",
            "superseded",
            "resolved"
          ]
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "pageTitle": {
          "type": "string"
        },
        "pageId": {
          "type": "string",
          "format": "uuid"
        },
        "feedback": {
          "type": "string",
          "description": "Latest nonempty review feedback for preparing a revised proposal."
        },
        "agentId": {
          "type": "string",
          "format": "uuid",
          "description": "Proposing Agent attribution, retained independently of the originating Run."
        },
        "agentName": {
          "type": "string"
        }
      }
    },
    "ProjectOverview": {
      "type": "object",
      "required": [
        "pageId",
        "title",
        "canEdit",
        "changes"
      ],
      "properties": {
        "pageId": {
          "type": [
            "string",
            "null"
          ],
          "format": "uuid"
        },
        "title": {
          "type": "string"
        },
        "canEdit": {
          "type": "boolean"
        },
        "changes": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/PageChange"
          }
        }
      }
    },
    "OverviewInput": {
      "type": "object",
      "required": [
        "requestKey",
        "action"
      ],
      "properties": {
        "requestKey": {
          "type": "string",
          "format": "uuid"
        },
        "action": {
          "type": "string",
          "enum": [
            "create",
            "designate"
          ]
        },
        "pageId": {
          "type": "string",
          "format": "uuid"
        }
      },
      "additionalProperties": false
    },
    "PageOperation": {
      "type": "object",
      "required": [
        "type"
      ],
      "properties": {
        "type": {
          "type": "string",
          "enum": [
            "insert",
            "update",
            "remove",
            "move"
          ]
        },
        "blockId": {
          "type": "string"
        },
        "parentId": {
          "type": "string"
        },
        "afterId": {
          "type": "string"
        },
        "expectedHash": {
          "type": "string"
        },
        "content": {
          "$ref": "./canvas.yaml#/schemas/CanvasBlock"
        },
        "beforeId": {
          "type": "string",
          "description": "Optional sibling insertion/move anchor, mutually exclusive with afterId."
        },
        "source": {
          "type": "string",
          "maxLength": 262144,
          "description": "Versioned Zenith Markdown/component source, mutually exclusive with content and markdown. Updates preserve descendant identities using Native nodes."
        },
        "languageVersion": {
          "type": "integer",
          "enum": [
            1
          ],
          "description": "Required with source; omit otherwise."
        }
      }
    },
    "PageEditInput": {
      "type": "object",
      "required": [
        "requestKey",
        "sequence",
        "summary"
      ],
      "properties": {
        "requestKey": {
          "type": "string",
          "format": "uuid"
        },
        "sequence": {
          "type": "integer",
          "format": "int64",
          "description": "Base revision returned by page_read. Operation hashes must match this revision. Concurrent content edits are compared during per-block review; theme changes require the current revision."
        },
        "summary": {
          "type": "string",
          "minLength": 1,
          "maxLength": 500
        },
        "operations": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/PageOperation"
          },
          "minItems": 1,
          "maxItems": 32
        },
        "theme": {
          "type": "string",
          "enum": [
            "default",
            "editorial",
            "compact"
          ],
          "description": "Change the theme in its own contribution; omit operations."
        },
        "supersedesId": {
          "type": "string",
          "format": "uuid"
        }
      },
      "additionalProperties": false,
      "allOf": [
        {
          "oneOf": [
            {
              "required": [
                "operations"
              ]
            },
            {
              "required": [
                "theme"
              ]
            }
          ]
        }
      ]
    },
    "PageEditResult": {
      "type": "object",
      "required": [
        "id",
        "status",
        "sequence"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "status": {
          "type": "string",
          "enum": [
            "applied",
            "proposed",
            "rejected",
            "undone",
            "partially_applied",
            "needs_update",
            "superseded",
            "resolved"
          ]
        },
        "sequence": {
          "type": "integer",
          "format": "int64"
        }
      }
    },
    "ProjectPresentationEntry": {
      "type": "object",
      "required": [
        "id",
        "title",
        "sequence",
        "createdAt",
        "runId",
        "deliveryIds",
        "pageId",
        "theme"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "title": {
          "type": "string"
        },
        "sequence": {
          "type": "integer",
          "format": "int64"
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "runId": {
          "type": [
            "string",
            "null"
          ],
          "format": "uuid"
        },
        "pageId": {
          "type": "string",
          "format": "uuid"
        },
        "theme": {
          "type": "string",
          "enum": [
            "default",
            "editorial",
            "compact"
          ]
        },
        "changeId": {
          "type": "string",
          "format": "uuid",
          "description": "The exact proposal captured or awaiting acceptance; absent for shared content."
        },
        "deliveryIds": {
          "type": "array",
          "items": {
            "type": "string",
            "format": "uuid"
          }
        }
