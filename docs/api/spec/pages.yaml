        "history",
        "nextCursor"
      ],
      "properties": {
        "pending": {
          "type": "array",
          "description": "All contributions awaiting review, independent of the history cursor.",
          "items": {
            "$ref": "#/schemas/PageChange"
          }
        },
        "history": {
          "type": "array",
          "description": "Up to 50 completed contributions, newest first.",
          "items": {
            "$ref": "#/schemas/PageChange"
          }
        },
        "nextCursor": {
          "type": [
            "string",
            "null"
          ],
          "description": "Opaque cursor for the next history page; null when complete."
        }
      }
    },
    "PageChangeReviewInput": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "requestKey",
        "fingerprint",
        "action"
      ],
      "properties": {
        "requestKey": {
          "type": "string",
          "format": "uuid"
        },
        "fingerprint": {
          "type": "string",
          "minLength": 64,
          "maxLength": 64
        },
        "action": {
          "type": "string",
          "enum": [
            "apply",
            "reject",
            "undo",
            "request_changes",
            "resolve"
          ]
        },
        "indexes": {
          "type": "array",
          "maxItems": 10000,
          "uniqueItems": true,
          "items": {
            "type": "integer",
            "minimum": 0
          }
        },
        "feedback": {
          "type": "string",
          "maxLength": 4000
        }
      }
    },
    "PageSuggestion": {
      "type": "object",
      "required": [
        "index",
        "type",
        "blockId",
        "status",
        "group",
        "competingChangeIds"
      ],
      "properties": {
        "index": {
          "type": "integer"
        },
        "type": {
          "type": "string"
        },
        "blockId": {
          "type": "string"
        },
        "status": {
          "type": "string",
          "enum": [
            "pending",
            "needs_update",
            "already_reflected",
            "applied",
            "rejected",
            "undone",
            "superseded"
          ]
        },
        "before": {
          "$ref": "./canvas.yaml#/schemas/CanvasBlock"
        },
        "after": {
          "$ref": "./canvas.yaml#/schemas/CanvasBlock"
        },
        "group": {
          "type": "array",
          "items": {
            "type": "integer"
          }
        },
        "competingChangeIds": {
          "type": "array",
          "items": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    },
    "PageChangeReview": {
      "type": "object",
      "required": [
        "id",
        "actorUserId",
        "action",
        "indexes",
        "feedback",
        "createdAt"
      ],
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "actorUserId": {
          "type": "string",
          "format": "uuid"
        },
        "action": {
          "type": "string",
          "enum": [
            "apply",
            "reject",
            "undo",
            "resolve",
            "request_changes"
          ]
        },
        "indexes": {
          "type": "array",
          "items": {
            "type": "integer"
          }
        },
        "feedback": {
          "type": "string"
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        }
      }
    }
  }
}
