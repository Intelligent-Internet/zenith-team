# Shared Project artifact canvas; no execution endpoints.
paths:
  search:
    get:
      tags: [projects]
      operationId: searchCanvasDocuments
      summary: Search authorized native documents and return block locations
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: query, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 120}}
      responses:
        '200':
          description: Matching documents
          content:
            application/json:
              schema: {$ref: '#/schemas/CanvasSearch'}
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  library:
    get:
      tags: [projects]
      operationId: getCanvasLibrary
      summary: Read shared templates, personal views and recoverable placements
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - {name: projectId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized canvas library
          content:
            application/json:
              schema: {$ref: '#/schemas/CanvasLibrary'}
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  canvas:
    get:
      tags:
        - "projects"
      operationId: "getProjectCanvas"
      summary: "get Project Canvas"
      description: "Human collaboration only. Project access and current source permissions are checked. Writes use revision and idempotency fences; no Agent execution is admitted."
      parameters:
        - $ref: "./_common.yaml#/parameters/companyId"
        - name: "projectId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "after_seq"
          in: "query"
          description: "Last applied canvas sequence. Zero requests a snapshot; a missing, expired, or future cursor returns full=true. Notifications are hints and must not advance this cursor."
          schema:
            type: "integer"
            minimum: 0
      responses:
        "200":
          description: "Authorized canvas state."
          content:
            application/json:
              schema:
                $ref: "#/schemas/CanvasSnapshot"
        "400":
          description: "Request could not be completed."
          content:
            application/json:
              schema:
                $ref: "./_common.yaml#/schemas/Error"
        "401":
