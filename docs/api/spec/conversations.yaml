  ChannelAgentStatus:
    type: object
    additionalProperties: false
    required: [agentId, name, managerUserId, managerName, canInvoke, canViewDetail, runtimeStatus]
    properties:
      agentId: { type: string, format: uuid }
      name: { type: string }
      managerUserId: { type: [string, 'null'], format: uuid }
      managerName: { type: string }
      canInvoke:
        type: boolean
        description: |
          The viewer may tag this Agent here. A tag runs on the tagger's own
          computer (ADR 0014), so this is false until the viewer has set the
          Agent up on one of their runtimes, as well as when the channel is
          archived or their role cannot discuss.
      canViewDetail:
        type: boolean
        description: |
          The viewer may open this Agent's activity here. Always `true`: the
          activity read lists only the viewer's own Runs, so every member who
          sees the chat may open it (empty when they never tagged the Agent).
      runtimeStatus:
        type: string
        description: |
          The status of the viewer's own runtime for this Agent, never another
          member's; `offline` when the viewer has not set the Agent up.
  ChannelInvocation:
    type: object
    additionalProperties: false
    required: [id, agentId, callerUserId, triggerMessageId, threadRootId, inputRequestIds, status, publicationStatus, failureReason, runStatus, runtimeStatus, canRetry, createdAt]
    properties:
      id: { type: string, format: uuid }
      agentId: { type: string, format: uuid }
      callerUserId:
        type: string
        format: uuid
        description: |
          The member who tagged the Agent, the author of the trigger message.
          Their Runs answer this request with their access, and only they
          read its activity.
      triggerMessageId: { type: string, format: uuid }
      threadRootId: { type: string, format: uuid }
      inputRequestIds:
        type: array
        items: { type: string, format: uuid }
      status: { type: string }
      publicationStatus: { type: string }
      failureReason: { type: [string, 'null'] }
      runStatus: { type: [string, 'null'] }
      runtimeStatus:
        type: [string, 'null']
        description: |
          The status of the machine the tag's latest Run is placed on, for
          the member who registered that machine — the tagger, since a tag
          runs on their own computer (ADR 0014). `null` for every other
          viewer, and before the tag has a Run.
      canRetry: { type: boolean }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
  ChannelInvocationPage:
    type: object
    additionalProperties: false
    required: [agents, items]
    properties:
      agents:
        type: array
        items: { $ref: '#/schemas/ChannelAgentStatus' }
      items:
        type: array
        items: { $ref: '#/schemas/ChannelInvocation' }
  ChannelInvocationRetryRequest:
    type: object
    additionalProperties: false
    required: [requestKey]
    properties:
      requestKey: { type: string, format: uuid }
  ChannelAgentActivityItem:
    type: object
    additionalProperties: false
    required: [id, runId, invocationId, type, content, parts, createdAt]
    properties:
      id: { type: string, format: uuid }
      runId: { type: string, format: uuid }
      invocationId: { type: string, format: uuid }
      type: { type: string }
      content: { type: string }
      parts:
        type: array
        items: { $ref: './runs.yaml#/schemas/RunItemPart' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
  ChannelAgentActivity:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items: { $ref: '#/schemas/ChannelAgentActivityItem' }

  HuddleInvitation:
    type: object
    description: Recipient REST lists add the current inviter name and the source discussion only while the recipient can read it. Realtime hints omit those presentation fields; an invitation alone grants no source access.
    required: [id, huddleId, inviterUserId, inviteeUserId, status, revision, expiresAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      huddleId: { type: string, format: uuid }
      inviterUserId: { type: string, format: uuid }
      inviteeUserId: { type: string, format: uuid }
      inviterName: { type: string }
      sourceConversation:
        type: object
        required: [id, type, title]
        properties:
          id: { type: string, format: uuid }
          type: { type: string, enum: [channel, human_direct] }
          title: { type: string }
      status: { type: string, enum: [pending, accepted, declined, expired, revoked] }
      revision: { type: integer, format: int64, minimum: 1 }
      expiresAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }

  HuddleJoinReservation:
    type: object
    required: [huddle, connection]
    properties:
      huddle: { $ref: '#/schemas/Huddle' }
      connection: { $ref: '#/schemas/HuddleConnection' }
      media: { $ref: '#/schemas/HuddleMediaToken' }

  HuddleMediaToken:
    type: object
    required: [url, token]
    properties:
      url: { type: string, format: uri }
      token: { type: string }

  HuddleConnection:
    type: object
    required: [id, huddleId, userId, status, revision, createdAt, displayName]
    properties:
      id: { type: string, format: uuid }
      huddleId: { type: string, format: uuid }
      userId: { type: string, format: uuid }
      status: { type: string, enum: [reserved, connected, ended, revoked] }
      revision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      createdAt: { type: string, format: date-time }
      displayName: { type: string }
      expiresAt: { type: string, format: date-time }

  Huddle:
    type: object
    required: [id, companyId, sourceConversationId, chatConversationId, startedByUserId, state, revision, deadlineAt, createdAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      companyId: { type: string, format: uuid }
      sourceConversationId: { type: string, format: uuid }
      chatConversationId: { type: string, format: uuid }
      startedByUserId: { type: string, format: uuid }
      state: { type: string, enum: [starting, open, ending, ended] }
      revision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      deadlineAt: { type: string, format: date-time }
      roomName: { type: string }
      endedAt: { type: string, format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
