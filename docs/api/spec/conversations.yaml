        minimum: 1
      readThroughSeq:
        type: integer
        minimum: 0
      manualUnreadSeq:
        type: integer
        minimum: 0
        description: Zero clears; positive sequence marks unread. Requires expectedRevision.
      expectedRevision:
        type: integer
        minimum: 0

