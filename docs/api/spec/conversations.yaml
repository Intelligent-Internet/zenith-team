      threadSummary:
        $ref: '#/schemas/DiscussionThreadSummary'
      reactionSummary:
        type: array
        items:
          $ref: '#/schemas/DiscussionReactionSummary'
        maxItems: 20
    description: >-
      At most 128 KiB per item. Tombstones retain identity, sequence, author and thread context; body
      is null, reactions and shared pins are cleared. Item revision guards body edits/deletes;
      conversationRevision orders thread/reaction/pin projections. Attachment metadata is included for authorized readers.
