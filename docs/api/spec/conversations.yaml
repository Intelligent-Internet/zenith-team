# Authored domain section of the Zenith Team API contract.
# docs/api/spec/openapi.yaml is the index
# that references it, and docs/api/conversations.md is its prose counterpart.

paths:
  conversationModelSettings:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [conversations]
      operationId: getConversationModelSettings
      summary: Read the model and thinking level for the next Run in this chat
      description: Creator-private for direct chats; Project readers may read Task chat settings.
      responses:
        '200':
          description: Chat settings and the caller's edit capability.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationModelSettings' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
    put:
      tags: [conversations]
      operationId: updateConversationModelSettings
      summary: Replace this chat's model and thinking level
      description: |
        Applies to future Runs only. Existing queued/running Runs and retries keep
        their frozen settings. Direct chats copy Agent defaults when created.
        Only the Task assignee with project.tasks.execute may edit a Task chat.
        Explicit null omits the provider override, never falling back to Agent defaults.
        A resumed provider session may retain its previous choice without an override.
        agentId and expectedRevision fence Agent handoffs and concurrent edits.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ConversationModelSettingsUpdate' }
      responses:
        '200':
          description: Saved settings.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationModelSettings' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409': { $ref: './_common.yaml#/responses/Conflict' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  humanConversationMembers:
    post:
      tags: [conversations]
      operationId: inviteHumanConversationMembers
      summary: Invite members to a group direct conversation
      parameters:
        - { $ref: './_common.yaml#/parameters/companyId' }
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/InviteHumanConversationRequest' }
      responses:
        '200':
          description: Current authorized result.
          content:
            application/json:
              schema: { $ref: '#/schemas/HumanDirectDetail' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409': { $ref: './_common.yaml#/responses/Conflict' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  channelInvocations:
    get:
      tags: [conversations]
      operationId: listChannelInvocations
      summary: List channel Agent status and invocations
      parameters:
        - { $ref: './_common.yaml#/parameters/companyId' }
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current authorized result.
          content:
            application/json:
              schema: { $ref: '#/schemas/ChannelInvocationPage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  channelAgentActivity:
    get:
      tags: [conversations]
      operationId: getChannelAgentActivity
      summary: Read the activity of your own channel Agent Runs
      description: |
        Any member who can see the chat reads, for this Agent, the items of
        the Runs they started by tagging it there, and only those: a tagged
        Run works for the person who tagged the Agent, with their access, so
        nobody else reads its requests or tool output, the Agent's creator
        included. A member who never tagged the Agent here reads an empty
        list. An Agent that is not in the Company is `404`.
      parameters:
        - { $ref: './_common.yaml#/parameters/companyId' }
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current authorized result.
          content:
            application/json:
              schema: { $ref: '#/schemas/ChannelAgentActivity' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  channelInvocationRetry:
    post:
      tags: [conversations]
      operationId: retryChannelInvocation
      summary: Retry a channel Agent invocation
      parameters:
        - { $ref: './_common.yaml#/parameters/companyId' }
        - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invocationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ChannelInvocationRetryRequest' }
      responses:
        '200':
          description: Current authorized result.
          content:
            application/json:
              schema: { $ref: '#/schemas/ChannelInvocationPage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409': { $ref: './_common.yaml#/responses/Conflict' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  studioOperations:
    parameters:
      - { $ref: './_common.yaml#/parameters/companyId' }
      - { $ref: './_common.yaml#/parameters/conversationId' }
    post:
      tags: [conversations]
      operationId: operateConversationStudio
      summary: Admit a human Studio canvas session
      description: >-
        Requires a human session online, visible direct/task Conversation and
        registrant-owned Runtime. Binding changes require conversations.discuss;
        The operation admits only resolveContext and ensureBinding. The response
        carries a short-lived Studio access token; the browser then talks to
        Studio REST and Socket.IO directly. No caller-selected origin, account,
        project, command or receipt is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/StudioEditorHumanRequest' }
      responses:
        '200':
          description: Correlated context or binding admission
          content:
            application/json:
              schema: { $ref: '#/schemas/StudioEditorHumanResponse' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: Studio binding, identity, recovery or compatibility conflict
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '502':
          description: Invalid Studio upstream response
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '503':
          description: Runtime or online authority unavailable
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '504':
          description: Unknown outcome; reconcile the same receipt
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
  companies_companyId_member_presence:
    post:
      tags: [conversations]
      operationId: updateMemberPresence
      summary: Report activity and read Company member presence
      description: Human Company members only. Active heartbeats expire after 90 seconds. Manual Away is shared across devices. Returns the caller and requested active Company members; no last-seen timestamps are exposed.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/schemas/MemberPresenceRequest'
      responses:
        '200':
          description: Current member presence
          content:
            application/json:
              schema:
                $ref: '#/schemas/MemberPresenceResponse'
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '404':
          description: Company membership unavailable
  companies_companyId_conversations_pins:
    get:
      tags: [conversations]
      operationId: listConversationPins
      summary: List the caller's pinned task and direct chats
      description: Active members receive only their own pins in this Company, newest first. Archived chats and Schedule conversations are excluded.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: Personal pin states. Conversation and Task identities resolve the corresponding existing chat rows.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/ConversationUserState' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  companies_companyId_conversations_states:
    get:
      tags: [conversations]
      operationId: listConversationStates
      summary: List the caller's saved task and direct chat filing states
      description: |
        Active members receive only their own pinned or archived states in this
        Company. Missing conversations have neither flag set. Task state is
        private to each member; direct state belongs to its creator. Schedule
        conversations and human discussions are excluded.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: Saved personal filing states, newest change first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/ConversationUserState' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  # ============================================================ conversations

  # /api/v1/companies/{companyId}/conversations
  companies_companyId_conversations:
    get:
      tags: [conversations]
      operationId: listDirectConversations
      summary: List the caller's conversations
      description: |
        Member gate, but visibility is per-creator: only chats the caller
        created. Newest activity first. Archived chats are excluded by default;
        `include_archived=true` includes them for browsing and restoring history.
        Archived chats remain readable by id.

        Each row carries the conversation's own fields with its activity
        `summary` beside them — the **same** summary object the
        `conversation.created` and `conversation.updated` events carry, so an
        event frame writes into a row without reshaping. Run detail inside the
        summary is counted rather than embedded; a client that needs the runs
        themselves asks the runs endpoint for that conversation.

        The caller's complete direct-conversation collection is returned in one
        response. This endpoint accepts no pagination parameters, and mutable
        `updatedAt` activity order is not a cursor boundary.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
          description: Include archived direct chats.
      responses:
        '200':
          description: All the caller's direct chats with summaries and per-user state.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/ConversationListItem' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    post:
      tags: [conversations]
      operationId: createDirectConversation
      summary: Open a direct chat with an agent
      description: |
        Supply a new `requestKey` to create an independent session with this
        Agent, preserving all existing chats. Reusing that key for the same
        creator and Company returns the same Conversation with `200`, including
        after it was archived. Reusing it for another Agent is `409`.
        PostgreSQL generates the Conversation identity. When requestKey is
        omitted, the existing default chat is reused for older clients.
        A new session gets its title from the first user message unless an
        explicit title was supplied.

        > A bad `agentId` is `409`, not `404`. The insert resolves the agent as a
        > join requiring an unarchived agent, and a no-row insert maps to
        > `conversation_conflict` — so an unknown, foreign, or archived agent
        > is not disclosed.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string, format: uuid }
                requestKey: { type: string, format: uuid }
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: |
                    Optional; omit the key for an untitled chat. Trimmed, then
                    1..120 runes. An explicit `null` is `400 invalid_request`.
      responses:
        '200':
          description: An unarchived chat with this agent already existed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Conversation' }
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Conversation' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 conversation_conflict` — an unknown, foreign, or archived
            `agentId`, or another database integrity conflict.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/conversations/{conversationId}
  companies_companyId_conversations_conversationId:
    patch:
      tags: [conversations]
      operationId: renameDirectConversation
      summary: Rename a direct chat
      description: |
        Only the direct chat's creator may rename it. Archived direct chats
        remain renameable. Task, Schedule, and other conversation kinds are
        not renamed through this endpoint.

        Send the conversation's current `revision` as `expectedRevision`.
        A stale revision returns `409 conversation_conflict`. A successful
        change returns the flat Conversation with its updated revision and
        publishes `conversation.updated` for the creator's other clients.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, expectedRevision]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: |
                    1..120 Unicode characters. Leading and trailing Unicode
                    whitespace and byte-order marks are removed; a blank title
                    is rejected.
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9007199254740991
      responses:
        '200':
          description: The renamed direct conversation.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Conversation' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 conversation_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 conversation_conflict` — the conversation revision has changed.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    get:
      tags: [conversations]
      operationId: getDirectConversation
      summary: Read one direct chat, with its messages
      description: |
        Returns the direct chat, its recent messages and their attachments in
        one request, replacing the chat read plus a separate initial page from
        `GET /api/v1/conversations/{conversationId}/messages`. That endpoint
        remains the way to page further back through history.

        Readable by the chat's creator only. Unlike the list, this read has no
        archived filter, so an archived chat is still readable by id. Task
        conversations are not read here — they are read through the task
        workspace, which carries the task beside the conversation.

        The message window is bounded rather than complete: a conversation
        grows without limit, so "every message" is not a size a client can
        hold. With no cursor the window is the newest `limit` messages; page
        further back with `through_seq` alone (the newest `limit` messages at
        or below the bound), forward with `after_seq`. A cursor past the
        conversation's head is clamped, not refused: `after_seq` at or past
        it answers an empty window carrying the real `throughSeq`.

        A Run reads its own chat here with its proof (`zen conversation
        get`). With `X-Boardly-Run-Token` the path must name the token's own
        chat, and a Run tagged in a channel or group DM reads none
        (`403 task_outside_run_scope`).
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/conversationId'
        - name: limit
          in: query
          required: false
          description: Newest N messages, 1..100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - $ref: './_common.yaml#/parameters/afterSeq'
        - $ref: './_common.yaml#/parameters/throughSeq'
        - $ref: './_common.yaml#/parameters/runTokenOwnRead'
      responses:
        '200':
          description: The conversation with a bounded window of its messages.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationDetail' }
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/RunOwnReadOutsideScope' }
        '404':
          description: '`404 conversation_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/conversations/{conversationId}/transcript
  companies_companyId_conversations_conversationId_transcript:
    get:
      tags: [conversations]
      operationId: getConversationTranscript
      summary: Read a conversation's persisted provider transcript
      description: |
        Every durable provider item produced across all Runs in this
        Conversation, ordered by the Conversation-wide `seq`. The Run is an
        attribute of each row (`runId`), not a filter in the route.

        `seq` is allocated by PostgreSQL while holding the Conversation row
        lock, so it is the stable ordering and reconnect cursor. `runId` and
        `createdAt` remain useful display and grouping fields, but sorting or
        paging by that pair could reorder interleaved commits. Continue with
        the last returned item's `seq`; never increment it or derive a cursor
        from a Run id.

        The Run's triggering `user_message` is not a provider transcript item.
        It remains available through the Conversation message surface. A task
        Conversation is visible to active company members; a direct
        Conversation only to its creator.

        A Run reads its own chat's transcript with its proof (`zen
        conversation transcript`). With `X-Boardly-Run-Token` the path must
        name the token's own chat, and a Run tagged in a channel or group DM
        reads none (`403 task_outside_run_scope`).
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/conversationId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
        - name: after_seq
          in: query
          required: false
          description: Return provider items with `seq > after_seq`.
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: './_common.yaml#/parameters/runTokenOwnRead'
      responses:
        '200':
          description: A bounded window of provider items, ascending by `seq`.
          content:
            application/json:
              schema:
                type: object
                required: [items, throughSeq, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: './runs.yaml#/schemas/RunTranscriptEntry' }
                  throughSeq:
                    type: integer
                    format: int64
                    minimum: 0
                    description: |
                      The newest provider item's Conversation `seq` when this
                      page began. It covers every returned row and excludes
                      `user_message` rows, which have no provider parts.
                  hasMore:
                    type: boolean
                    description: |
                      More provider items exist above the final item returned
                      in this bounded page.
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/RunOwnReadOutsideScope' }
        '404':
          description: '`404 conversation_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/conversations/{conversationId}/state
  conversations_conversationId_state:
    get:
      tags: [conversations]
      operationId: getConversationState
      summary: Read the caller's per-conversation state
      description: |
        Not company-scoped in the path — visibility is resolved in SQL: a task
        conversation is readable by the readers of its Project (ADR 0017), a
        direct chat by its creator only. A **non-creator** reading a direct chat gets `404`.

        For a task conversation with no stored row the server synthesizes a
        default (null pin/archive, `revision: 0`) whose
        `updatedAt` is the conversation's `createdAt`.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      responses:
        '200':
          description: The caller's state, real or synthesized.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationUserState' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
    patch:
      tags: [conversations]
      operationId: updateConversationState
      summary: Pin or archive a task or direct chat
      description: >-
        Pin and archive state is private to the acting user. Task state uses a
        separate revision starting at zero and never alters the Task, shared
        Conversation or existing Runs. Archived chats are excluded from active
        pins; restoring preserves the prior pin. Direct state belongs to its
        creator. Exact retries return the stored state without another write or
        event. Archiving a legacy default direct chat gives it an independent
        session key, so it can be restored alongside a newer chat.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 0
                  example: 6
                  description: |
                    `0` is legitimate here — it claims the synthesized default
                    row that has never been persisted.
                pinned: { type: boolean }
                archived: { type: boolean }
      responses:
        '200':
          description: The updated state.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationUserState' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 conversation_conflict` — `expectedRevision` did not match.
            The state row is the conversation row, so it shares the
            conversation's conflict code rather than one of its own.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/conversations/{conversationId}/run-queue
  conversations_conversationId_run_queue:
    get:
      tags: [conversations]
      operationId: getConversationRunQueue
      summary: Read the pending run queue
      description: |
        `currentRun` is the **oldest non-terminal** run — its status may be
        `queued` or `deferred`, not only an executing one — and is null when
        there is none.
        `items` is ordered by position, then queuedAt, then id.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      responses:
        '200':
          description: The queue projection.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/RunQueueProjection' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


  # /api/v1/conversations/{conversationId}/run-queue/order
  conversations_conversationId_run_queue_order:
    put:
      tags: [conversations]
      operationId: reorderConversationRunQueue
      summary: Reorder the pending run queue
      description: |
        Whole-order replace: send every pending item, each with its own
        `expectedRevision`. Returns the full new projection, and the matching
        realtime event carries the identical body, so no refetch is needed.

        In a task chat, changing the queue is posting there: the caller needs
        `project.tasks.write` on its Project (`403
        project_permission_required`); someone who cannot read the Project
        gets `404 conversation_not_found` (ADR 0017).
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [id, expectedRevision]
                    properties:
                      id: { type: string, format: uuid }
                      expectedRevision:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9007199254740991
                        example: 6
                        description: The current queue-item revision.
      responses:
        '200':
          description: The reordered queue.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/RunQueueProjection' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 run_queue_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/conversations/{conversationId}/run-queue/{queueItemId}
  conversations_conversationId_run_queue_queueItemId:
    delete:
      tags: [conversations]
      operationId: deleteConversationRunQueueItem
      summary: Drop a pending run-queue item
      description: |
        Requires a JSON **request body** carrying `expectedRevision` plus
        `Content-Type: application/json`, and returns the full `200` projection
        rather than `204`.

        In a task chat the caller needs `project.tasks.write` on its Project
        (`403 project_permission_required`); someone who cannot read the
        Project gets `404 conversation_not_found` (ADR 0017).
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
        - $ref: './_common.yaml#/parameters/queueItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9007199254740991
                  example: 6
                  description: The current queue-item revision.
      responses:
        '200':
          description: The queue after removal.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/RunQueueProjection' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: |
            `404 conversation_not_found` — an unknown queue item reports the
            conversation's code, not one of its own: the item is not separately
            addressable outside its conversation.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 run_queue_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  # ================================================================= messages

  # /api/v1/conversations/{conversationId}/messages
  conversations_conversationId_messages:
    get:
      tags: [messages]
      operationId: listConversationMessages
      summary: Page a conversation's messages
      description: |
        The history-paging read. The conversation detail read
        (`GET /api/v1/companies/{companyId}/conversations/{conversationId}`)
        carries the newest window on open; this endpoint pages further back with
        `through_seq` and forward with `after_seq`, without re-sending the
        conversation envelope each time. The next page's boundary is derived
        from the window itself: the last returned row's `seq` is the
        `after_seq` to continue forward, and the first row's `seq` bounds the
        next `through_seq` going back. A cursor past the conversation's head
        is clamped, not refused: `after_seq` at or past it answers an empty
        window carrying the real `throughSeq`, and `through_seq` past it
        reads from the real head. With no cursor the window starts at the
        beginning of the stream; the detail read is what opens on the newest
        messages.

        A Run reads its own chat's messages with its proof (`zen
        conversation messages`). This route sits outside `/companies`, so the
        token alone names the Company: it must prove a running Run whose
        member is the caller, the path must name that Run's own chat, and a
        Run tagged in a channel or group DM reads none
        (`403 task_outside_run_scope`).
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
        - $ref: './_common.yaml#/parameters/runTokenOwnRead'
        - name: after_seq
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: through_seq
          in: query
          required: false
          description: |
            The upper bound of the window. Supplied **without** `after_seq`
            this is a scroll-back: the newest `limit` messages at or below the
            bound, which is the only correct way to page backwards. A caller
            cannot compute the matching `after_seq` itself — invisible run
            detail (reasoning, tool calls) shares the conversation sequence, so
            the seq range that holds `limit` messages is not knowable until
            they are read. Supplied *with* `after_seq` the window is the
            forward range between the two.
          schema: { type: integer, format: int64 }
        - $ref: './_common.yaml#/parameters/limit'
      responses:
        '200':
          description: A window of messages with their attachments.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: './_common.yaml#/schemas/MessageWithAttachments' }
                  - $ref: './_common.yaml#/schemas/MessageWindowBounds'
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/RunOwnReadOutsideScope' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
    post:
      tags: [messages]
      operationId: sendConversationMessage
      summary: Send a message into a conversation
      description: |
        Three dispositions. `message` means the message was appended immediately
        (`201` on first call, `200` on replay). `queued` means it went to the run
        queue instead — and returns **`202` on both the first call and a replay**,
        so the status code alone cannot distinguish create from replay in that
        branch. `removed` is the replay of a send whose queued item was already
        withdrawn.

        **A send needs a resolved Agent.** Every conversation item belongs to a
        run, so a conversation with nobody to answer — a Task its assignee
        does themself, or a direct chat whose Agent was deleted — refuses the
        send with `409 conversation_conflict` rather than storing words no run
        will ever read.

        **Company preparation reserves its exact conversation until the
        research starts.** New sends to the CEO conversation of a receipt whose
        research Run has not been started return
        `409 conversation_initialization_pending`. Exact request replays still
        return their original receipt. Once the research Run exists, a send
        queues behind it like behind any other Run. Other conversations remain
        available.

        **A run needs the sender's binding.** A direct chat runs on the
        caller's own computer: an Agent the caller has not set up on one of
        their runtimes is `409 agent_binding_required` (ADR 0014). In a
        Task's conversation only the assignee starts runs; a message from
        any other member is stored on the queue (`202`, disposition
        `queued`), the assignee is nudged with a `task_run_requested` Inbox
        item, and the next run the assignee starts reads it.

        Attachments are linked atomically on the immediate path. On the queued
        path they are reserved until materialization, then transferred to the
        new message in the same transaction. The caller supplies one
        actor-scoped `requestKey`; PostgreSQL owns every item, queue-item,
        and Run id returned by the operation.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey]
              properties:
                requestKey:
                  type: string
                  format: uuid
                  description: |
                    Caller-generated retry token, scoped to this company,
                    conversation, and sender. Repeating it with the same
                    normalized `content` and ordered `attachmentIds` returns
                    the canonical prior result. Reusing it with different
                    payload returns 409. It is not a Message or Run id.
                content: { type: string }
                artifactIds:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
                  description: Direct Agent chats only. Freezes accessible managed Artifact references into message and Run context. Does not change sharing grants.
                attachmentIds:
                  type: array
                  description: |
                    Must be `ready` and uploaded by the caller in the same
                    company, and not already reserved or linked.
                  items: { type: string, format: uuid }
                suppressUserMessage:
                  type: boolean
                  description: |
                    Start the Agent without writing this prompt into the
                    transcript, for an instruction the person never typed —
                    onboarding handing the CEO Agent its opening brief, say.
                    The Run still receives the words in its frozen context, and
                    the Run and everything the Agent does are recorded as
                    always; only the transcript entry is withheld. The success
                    body then carries no `message`. When the send starts its
                    Run at once, `attachmentIds` are ignored: no message
                    carries them, so they are neither linked nor delivered to
                    the Run as Task files.
      responses:
        '200':
          description: Replay of an immediately-appended message.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '201':
          description: Message appended.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '202':
          description: |
            Queued — first call **and** replay both answer 202.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 conversation_conflict` (the conversation has no Agent to
            answer, an immediate-send `requestKey` has different payload, or
            the conversation changed under the write),
            `409 conversation_initialization_pending` (this exact conversation
            is waiting for the company research to start),
            `409 agent_binding_required` (a direct chat with an Agent the
            caller has not set up on one of their computers),
            `409 run_queue_conflict` (a queued `requestKey` has different payload
            or the queue moved),
            or `409 run_queue_full` (the queue is at `limit`).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/conversations/{conversationId}/messages/{messageId}/context
  conversations_conversationId_messages_messageId_context:
    get:
      tags: [messages]
      operationId: getMessageContext
      summary: Read the window around one message
      description: |
        Used to jump to a search hit. The query parser is unusually strict: the
        query string must be either **empty** or **exactly one `limit`** —
        any additional parameter, a repeat, or an empty value is `422`.

        Registered only when the message-context service is wired.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
        - $ref: './_common.yaml#/parameters/messageId'
        - name: limit
          in: query
          required: false
          description: |
            Number of chat messages in the window, counted around the target:
            it sits at index `limit/2` when neighbours exist on both sides,
            and near either end of the chat the window fills from the other
            side. Run detail between messages shares the `seq` counter and
            never counts, so a busy Run cannot leave the target alone. Must
            be a canonical decimal integer.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Messages around the target, with the window bounds.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required: [items, targetSeq]
                    properties:
                      items:
                        type: array
                        description: |
                          Ascending by `seq`, each message flat with its own
                          attachments nested — the one wire type every read in
                          this file returns.
                        items: { $ref: './_common.yaml#/schemas/MessageWithAttachments' }
                      targetSeq:
                        type: integer
                        example: 41
                        format: int64
                        description: |
                          The `seq` of the message the window is centred on, so
                          a client can scroll to it without scanning `items`.
                  - $ref: './_common.yaml#/schemas/MessageWindowBounds'
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: |
            `404 conversation_not_found` — an unknown message reports the
            conversation's code, not one of its own: the message is not
            separately addressable, and there is no `message_not_found`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/tasks/{taskId}/messages
  tasks_taskId_messages:
    get:
      tags: [messages]
      operationId: listTaskMessages
      summary: Read a task's messages, addressed by task
      description: |
        Same window semantics and same body as the conversation-addressed read;
        the server resolves the task's conversation for you.

        > An unknown or unauthorized task reports `conversation_not_found` —
        > there is no task-specific not-found code even though the path names a
        > task.
      parameters:
        - $ref: './_common.yaml#/parameters/taskId'
        - $ref: './_common.yaml#/parameters/afterSeq'
        - $ref: './_common.yaml#/parameters/throughSeq'
        - $ref: './_common.yaml#/parameters/limit'
      responses:
        '200':
          description: A window of messages with their attachments.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: './_common.yaml#/schemas/MessageWithAttachments' }
                  - $ref: './_common.yaml#/schemas/MessageWindowBounds'
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    post:
      tags: [messages]
      operationId: sendTaskMessage
      summary: Send a message into a task's conversation
      description: |
        Identical semantics to `POST /conversations/{conversationId}/messages`,
        including the three dispositions and the 201/200/202 split. An unknown or
        unauthorized task reports `conversation_not_found`.

        A Task its assignee does **themself** has no Agent to answer, so a
        send into its conversation is `409 conversation_conflict` — chat is
        how you talk to an Agent, and there is no item that belongs to no run.

        Only the Task's assignee starts its runs, on their own computer
        (ADR 0014). The assignee's message starts a run at once (or queues
        behind a live one, as today); it needs the assignee's binding of the
        Agent, else `409 agent_binding_required`. Any other member's message
        is queued (`202`), the assignee receives a `task_run_requested`
        Inbox item, and the next run the assignee starts reads it in order.

        Every run a task chat starts is the assignee's, so a send needs the
        assignee's `project.tasks.execute` on the task's Project (ADR 0017),
        whoever sends it; otherwise `403 project_permission_required`, whose
        short `detail` names the Agent ("Eli didn't start: the assignee
        can't run tasks here.") and never names the Project.

        A task chat is read by its Project's readers: anyone else gets `404
        conversation_not_found`. Posting into it is Task work, so the sender
        needs `project.tasks.write` on the Project (`403
        project_permission_required`); reading alone does not let a person
        post.

        An Agent-executed Task in `failed` accepts a new user message from
        its assignee. When the message's fresh Run materializes, it
        explicitly resumes the Task as `in_progress` and supersedes the
        pending failure report. `done` and `cancelled` Tasks still reject
        new messages.
      parameters:
        - $ref: './_common.yaml#/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestKey]
              properties:
                requestKey:
                  type: string
                  format: uuid
                  description: |
                    Same actor-scoped retry token as the conversation-addressed
                    send. It is not a Message, queue-item, or Run id.
                content: { type: string }
                artifactIds:
                  type: array
                  maxItems: 10
                  uniqueItems: true
                  items: { type: string, format: uuid }
                  description: Direct Agent chats only. Freezes accessible managed Artifact references into message and Run context. Does not change sharing grants.
                attachmentIds:
                  type: array
                  items: { type: string, format: uuid }
                suppressUserMessage:
                  type: boolean
                  description: |
                    Start the Agent without writing this prompt into the
                    transcript, for an instruction the person never typed —
                    onboarding handing the CEO Agent its opening brief, say.
                    The Run still receives the words in its frozen context, and
                    the Run and everything the Agent does are recorded as
                    always; only the transcript entry is withheld. The success
                    body then carries no `message`. When the send starts its
                    Run at once, `attachmentIds` are ignored: no message
                    carries them, so they are neither linked nor delivered to
                    the Run as Task files.
      responses:
        '200':
          description: Replay of an immediately-appended message.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '201':
          description: Message appended.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '202':
          description: Queued — first call and replay both answer 202.
          content:
            application/json:
              schema: { $ref: '#/schemas/SendMessageResult' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 conversation_conflict` when the task has no executing Agent,
            is `done` or `cancelled`, has unresolved dependencies, or a
            `requestKey` is replayed with different payload,
            `409 agent_binding_required` when the assignee has not set the
            Agent up on one of their computers,
            `409 run_queue_conflict` for the queued form of that replay, or
            `409 run_queue_full`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  conversations_conversationId_whiteboards:
    post:
      tags: [messages]
      operationId: createConversationWhiteboard
      summary: Make a Whiteboard in an Agent or Task chat
      description: |
        Makes a Whiteboard in an Agent chat or a Task's chat, owned by the
        caller and titled as given. The chat gets no message for it: every
        turn there asks the Agent, so the Whiteboard joins the chat's Artifacts
        (`GET /companies/{companyId}/conversations/{conversationId}/artifacts`)
        and every later Run of the chat is told of it. Others open it only
        once its owner shares it, as with any Artifact. The answer is the new
        Artifact as that list shows it. A group chat makes its Whiteboards
        with a discussion message instead.

        Reaching the chat follows the message send: an unknown or unreadable
        chat is `404 conversation_not_found`, and a Task chat needs
        `project.tasks.write` on its Project (`403
        project_permission_required`). A blank title, or one over 200
        characters, is `422`.
      parameters:
        - $ref: './_common.yaml#/parameters/conversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/CreateChatWhiteboardRequest' }
      responses:
        '201':
          description: Whiteboard made.
          content:
            application/json:
              schema: { $ref: './runs.yaml#/schemas/ArtifactRunResult' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # ============================================================== attachments


  # ============================================================== attachments

  # /api/v1/attachments/initiate
  attachments_initiate:
    post:
      tags: [attachments]
      operationId: initiateAttachment
      summary: Upload an attachment
      description: |
        The one **multipart** endpoint in the API. Exactly two parts in order:
        `metadata` (which must itself be `application/json`) and then the file.
        A third part is rejected. Sending `application/json` for the whole
        request is `415`.

        The upload holds a pending lease (default one hour) until
        `POST .../complete` marks it `ready`.

        The daemon uploads the files a Run presents on the member's session.
        When it sends the Run's `X-Boardly-Run-Token`, the token is checked
        right after the metadata part, before the file is stored.

        Served `Cache-Control: no-store`.
      parameters:
        - $ref: './_common.yaml#/parameters/runTokenUpload'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  type: object
                  description: |
                    Must be sent as a part with `Content-Type: application/json`.
                    `requestKey` is the caller's UUID retry token; it is not the
                    Attachment id returned by this operation.
                  required: [requestKey, companyId, filename, contentType, sizeBytes]
                  properties:
                    requestKey: { type: string, format: uuid }
                    companyId: { type: string, format: uuid }
                    filename: { type: string }
                    contentType: { type: string }
                    sizeBytes: { type: integer, format: int64, example: 20481 }
                file:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
      responses:
        '200':
          description: |
            Exact replay — this uploader already used `requestKey` in this
            company with the same normalized filename, content type, and size.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Attachment' }
        '201':
          description: Uploaded; status is `pending` until completed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Attachment' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 attachment_conflict` — the scoped `requestKey` already exists
            with different normalized upload metadata, or the existing
            attachment no longer permits initiate replay.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415':
          description: |
            `415 unsupported_media_type` — the request is not
            `multipart/form-data`, or the metadata part is not
            `application/json`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/attachments/{attachmentId}/complete
  attachments_attachmentId_complete:
    post:
      tags: [attachments]
      operationId: completeAttachment
      summary: Mark an uploaded attachment ready
      description: |
        Moves the attachment from `pending` to `ready` and raises
        `attachment.completed`. Only then can it be referenced by a message.
        The daemon completes a Run's upload with the Run's
        `X-Boardly-Run-Token`, checked against the `companyId` in the body
        before the attachment changes.
        Served `Cache-Control: no-store`.
      parameters:
        - $ref: './_common.yaml#/parameters/attachmentId'
        - $ref: './_common.yaml#/parameters/runTokenUpload'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId: { type: string, format: uuid }
      responses:
        '200':
          description: The attachment, now `ready`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Attachment' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 attachment_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 attachment_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '410':
          description: '`410 attachment_upload_expired` — the pending lease lapsed.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/attachments/{attachmentId}/download
  attachments_attachmentId_download:
    get:
      tags: [attachments]
      operationId: downloadAttachment
      summary: Download an attachment's bytes
      description: |
        Streams the stored object. Served `Cache-Control: no-store`. The
        authorization query filters `status = 'ready'`, so a pending
        attachment surfaces as `404` — there is no incomplete-upload conflict
        on this path.
      parameters:
        - $ref: './_common.yaml#/parameters/attachmentId'
        - name: companyId
          in: query
          required: true
          description: Company that owns the attachment.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The bytes, with the stored content type.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: |
            `404 attachment_not_found` — including an attachment that is still
            `pending`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

