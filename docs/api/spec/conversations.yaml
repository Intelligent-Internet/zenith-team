  # ============================================================ conversations

  # /api/v1/companies/{companyId}/conversations

schemas:
  HuddleCapabilities:
    type: object
    additionalProperties: false
    required: [calls, voiceAgents]
    properties:
      calls:
        type: boolean
        description: |
          Calls run on this server: Huddles are on and LiveKit is configured. When false, starting
          or joining a Huddle answers `503 huddle_not_configured` and clients
          hide Huddles.
      voiceAgents:
        type: boolean
        description: Voice Agents can be invited into calls. Always false without calls.

  ConversationModelSettings:
    type: object
    additionalProperties: false
    required: [agentId, provider, model, thinkingLevel, revision, canEdit, changes]
    properties:
      agentId: { type: string, format: uuid }
      provider: { type: string, enum: [codex, claude] }
      model: { type: [string, "null"] }
      thinkingLevel: { type: [string, "null"] }
      revision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      canEdit: { type: boolean }
      changes:
        type: array
        description: Committed model changes for this Conversation, oldest first. Thinking-only edits and unchanged models do not add entries.
        items: { $ref: '#/schemas/ConversationModelChange' }
  ConversationModelChange:
    type: object
    additionalProperties: false
    required: [id, agentId, previousModel, model, afterSeq, createdAt]
    properties:
      id: { type: string, format: uuid }
      agentId: { type: string, format: uuid }
      previousModel: { type: [string, "null"] }
      model: { type: [string, "null"] }
      afterSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        description: Last committed Conversation item sequence when the change was saved; zero before any items.
      createdAt: { type: string, format: date-time }
  ConversationModelSettingsUpdate:
    type: object
    additionalProperties: false
    required: [agentId, expectedRevision, model, thinkingLevel]
    properties:
      agentId: { type: string, format: uuid }
      expectedRevision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      model: { type: [string, "null"], minLength: 1, maxLength: 256 }
      thinkingLevel: { type: [string, "null"], minLength: 1, maxLength: 64 }

  ConversationDetail:
    description: |
      One conversation, **flat**, with a bounded window of its messages and the
      panel's other co-resident state beside it. Replaces the chat read plus the
      separate message-list request.

      The conversation's own fields sit at the top level rather than under a
      `conversation` key: this is a read of one entity plus derived data, so the
      entity is the response and the derived parts are siblings. Its `runs`
      member is the same `RunsSummary` wire type the list row's `summary`
      carries, so the run state converges into one cache slot from either
      read.
    allOf:
      - $ref: './_common.yaml#/schemas/Conversation'
      - type: object
        required:
          - agent
          - messages
          - earliestAvailableSeq
          - throughSeq
          - resetRequired
          - userState
          - runs
          - runQueue
        properties:
          agent:
            description: |
              The agent that answers here, embedded so the panel header renders
              without a roster read. On a direct chat this is the conversation's
              own `agentId`; on a **task** conversation `agentId` is absent and
              this is the task's current assignee — the same agent the send path
              resolves, which is the one a client must name in the header.
              `null` only when the agent was deleted, or the task is unassigned.
            oneOf:
              - { $ref: '#/schemas/ConversationAgentRef' }
              - { type: "null" }
          messages:
            type: array
            description: |
              Ascending by `seq`, and a filtered view of the conversation's one
              sequence: run detail keeps the numbers between two messages, so
              adjacent entries here are not adjacent `seq` values.
            items: { $ref: './_common.yaml#/schemas/MessageWithAttachments' }
          earliestAvailableSeq:
            type: integer
            example: 1
            format: int64
            description: The oldest `seq` the conversation still holds.
          throughSeq:
            type: integer
            example: 41
            format: int64
            description: |
              The conversation's highest `seq` over the whole stream, run
              detail included. Whether the window missed older or newer rows
              is derived: compare the window's lowest `seq` against
              `earliestAvailableSeq` and its highest against this value.
          resetRequired:
            type: boolean
            description: |
              Currently always false: the server implements no history-retention
              reset branch and returns earliestAvailableSeq=1. Reserved for a
              future explicit window-expiry contract.
          userState:
            description: |
              The caller's read/pin/archive state — the **same** object
              `GET .../state` returns and the `conversation.read` event carries,
              so an event frame is written into this slot unchanged. Kept nested
              rather than flattened because it carries its own `revision`,
              which would collide with the conversation's.
            $ref: '#/schemas/ConversationUserState'
          runs:
            description: |
              The conversation's run state, counted. Nested rather than
              flattened because it is a separable projection every read
              surface shares.
            $ref: '#/schemas/RunsSummary'
          runQueue:
            description: |
              Messages waiting behind the run in flight — the same projection the
              run-queue endpoints mutate.
            $ref: './_common.yaml#/schemas/RunQueueProjection'


  ConversationAgentRef:
    type: object
    description: |
      The agent on the other side of a conversation, carried as a reference so
      a row or a panel header renders without resolving an id against the agent
      roster. `runtimeAvailable` is denormalized here for the same reason it is
      denormalized onto the agent itself: it is what the composer renders, and
      a user typing into a chat whose agent is offline should learn it before
      pressing send, not after the run sits queued. Both fields are the
      **viewer's** (ADR 0014): `runtimeAccess.execute` is true when the
      viewer has set the agent up on one of their own runtimes and
      `runtimeAvailable` when that runtime is online, usable and signed in.
      A composer whose agent is not set up offers the setup step before a
      send is refused with `409 agent_binding_required`.
    required: [id, name, title, runtimeAvailable, runtimeAccess]
    properties:
      runtimeAccess: { $ref: './runs.yaml#/schemas/RuntimeAccess' }
      id: { type: string, format: uuid }
      name: { type: string, maxLength: 120 }
      title: { type: string, maxLength: 120 }
      runtimeAvailable:
        type: boolean
        description: True when the viewer's binding of the agent names a runtime that is online, usable and signed in.


  ConversationListItem:
    type: object
    description: |
      One row: the conversation's own fields flat, the caller's `pinnedAt`,
      and the shared activity `summary` beside them. `summary` is the **same**
      object the `conversation.created` and `conversation.updated` events
      carry, so a frame is written into this slot unchanged — row and event
      are one shape.

      `archivedAt` is null for active chats. Archived rows are returned only
      when `include_archived=true`.
    required:
      - id
      - companyId
      - kind
      - taskId
      - agent
      - title
      - pinnedAt
      - archivedAt
      - summary
      - createdAt
      - updatedAt
      - revision
    properties:
      id: { type: string, format: uuid }
      companyId: { type: string, format: uuid }
      kind: { $ref: './_common.yaml#/schemas/ConversationKind' }
      agent:
        description: |
          The agent this conversation is with, as a reference rather than a
          bare `agentId`: a fifty-row list renders a name and an online dot per
          row, and an id forces the client to hold the whole agent roster to
          draw one. `null` only when the agent has been deleted.
        oneOf:
          - { $ref: '#/schemas/ConversationAgentRef' }
          - { type: "null" }
      taskId: { type: [string, "null"], format: uuid }
      title: { type: [string, "null"] }
      archivedAt: { type: [string, "null"], format: date-time }
      pinnedAt:
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
        description: |
          When the caller pinned this conversation, `null` when unpinned. A
          timestamp rather than a `pinned` boolean so the row carries the same
          field the state endpoint and the `conversation.read` event carry — a
          client writes that event straight into this row — and so a pinned
          section can be ordered by when it was pinned. It sits on the row
          because the row is this list's only carrier of per-user state.
      summary: { $ref: '#/schemas/ConversationSummary' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }


  ConversationSummary:
    type: object
    description: |
      A conversation's activity summary — the preview line and the counted run
      state a list row renders. One wire type on every surface that carries
      it: the list row's `summary` member and the `summary` slot of the
      `conversation.created` / `conversation.updated` event payloads are these
      identical bytes.
    required: [updatedAt, lastMessage, runs]
    properties:
      updatedAt:
        allOf: [{ $ref: './_common.yaml#/schemas/Timestamp' }]
        description: |
          When the conversation last saw activity — the instant the list
          orders by.
      lastMessage:
        type: [object, "null"]
        description: |
          The newest **chat-visible** item, reduced to the preview line —
          run detail never becomes a preview. Explicitly `null` on a
          conversation with no such item. `content` is the item's text,
          truncated server-side, and is omitted for an item that carries no
          displayable text.
        required: [seq, createdAt, type, authorKind]
        properties:
          seq: { type: integer, format: int64, example: 41 }
          content: { type: string }
          contentTruncated:
            type: boolean
            description: Present and `true` only when `content` was cut.
          type: { $ref: './_common.yaml#/schemas/ItemType' }
          authorKind: { type: string, enum: [user, agent] }
          createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      runs: { $ref: '#/schemas/RunsSummary' }


  ConversationUserState:
    type: object
    required: [conversationId, userId, pinnedAt, archivedAt, updatedAt, revision]
    properties:
      conversationId: { type: string, format: uuid }
      userId: { type: string, format: uuid }
      pinnedAt: { type: [string, "null"], format: date-time }
      archivedAt: { type: [string, "null"], format: date-time }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }


  RunsSummary:
    type: object
    description: |
      The conversation's run state, counted rather than embedded. The previous
      shape inlined up to twenty run objects per conversation, so a fifty-row
      page could carry a thousand nested objects to render a badge.

      This is the `runs` member of every conversation surface — list rows,
      detail reads, and the `conversation.created` / `conversation.updated`
      event summaries all share the one wire type, so any delivery writes into
      the same slot the list filled.

      The two counters use the API's one run-counting vocabulary: `queuedCount`
      is queued + deferred, `activeCount` is dispatched +
      waiting_local_directory + running. No other run counter is served.
    required: [queuedCount, activeCount, latest]
    properties:
      queuedCount:
        type: integer
        format: int64
        example: 0
        description: |
          Runs in this conversation not yet claimed by a machine — status
          `queued`, plus `deferred` runs waiting out their `fireAt` backoff.
      activeCount:
        type: integer
        format: int64
        description: |
          Runs in this conversation that have left the queue and not yet
          finished — `dispatched`, `waiting_local_directory`, `running`.
          Disjoint from `queuedCount`; a terminal run is in neither.
      latest:
        type: [object, "null"]
        description: |
          The conversation's most recent run, whatever its state — the one whose
          progress or failure the panel is showing. `null` when the conversation
          has never run. Kept nested because it is one run, not a set of the
          conversation's own scalars; kept **complete** because every field here
          is a column of the row the summary already reads, and each absent one
          cost a client a separate run read.
        required: [runId, agentId, status, createdAt, attempt, maxAttempts]
        properties:
          runId: {"type": "string", "format": "uuid"}
          agentId: { type: string, format: uuid }
          status: { $ref: './_common.yaml#/schemas/RunStatus' }
          createdAt:
            allOf: [{ $ref: './_common.yaml#/schemas/Timestamp' }]
            description: |
              When the run was enqueued. The anchor for the "queued for 12s"
              caption: it has to come from the server, because a client's
              optimistic row has no real enqueue time and the timer must survive
              a reload.
          failureReason:
            type: [string, "null"]
            description: |
              The coarse classifier from the run, present when `status` is
              `failed`. A run that failed before the agent said anything leaves
              no `agent_text` item at all, so without this the panel has
              nothing to render against that turn. Open set — do not switch
              exhaustively on it. The verbatim `error` text stays on the run
              read.
          attempt:
            type: integer
            format: int32
            example: 1
            description: 1 for a first try; a retry child carries its parent's + 1.
          maxAttempts:
            type: integer
            format: int32
            example: 3
            description: |
              With `attempt`, the answer to "is a retry coming, or is this the
              end?" — `attempt < maxAttempts` means the server will enqueue
              the next attempt itself and the client should not offer a retry
              button or poll for one. Derived from `failureReason` rather
              than stored: it widens for a transient provider stream cut,
              takes the generic ceiling for another retryable reason or a run
              that has not failed, and equals `attempt` for a failure the
              server will not retry, so the pair alone says a failure is
              final. It is never below `attempt`.


  CreateChatWhiteboardRequest:
    type: object
    additionalProperties: false
    required: [title]
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
        description: Surrounding space is trimmed; the rest must hold 1 to 200 characters.
  SendMessageResult:
    type: object
    description: |
      The result of a send. Branch on `disposition`: `message` means the
      message was appended now, `queued` means it went to the run queue,
      `removed` means the pending item was withdrawn.

      The branch key stays — the three branches carry genuinely different
      things, and on `queued` and `removed` no message exists yet to hoist to
      the top level — but its payload is the flat message with its attachments
      nested, so the old `message.message` double wrapper is gone.
    required: [disposition]
    properties:
      disposition: { type: string, enum: [message, queued, removed] }
      message:
        allOf: [{ $ref: './_common.yaml#/schemas/MessageWithAttachments' }]
        description: Present when `disposition` is `message`.
      runId:
        {"type": "string", "format": "uuid", "description": "Database-generated Run UUID."}
      queueItem:
        allOf: [{ $ref: './_common.yaml#/schemas/RunQueueItem' }]
        description: Present when `disposition` is `queued`.

