    type: object
    additionalProperties: false
    description: >-
      Supply peerUserId or peerUserIds, never both, and optionally agentIds.
      At least one human peer or Agent is required. The creator is implicit and
      cannot be a peer. All participants must be active in the Company.
    anyOf:
      - required: [peerUserId]
      - required: [peerUserIds]
      - required: [agentIds]
    not:
      required: [peerUserId, peerUserIds]
      properties:
        peerUserId: {}
        peerUserIds: {}
    properties:
      peerUserId: { type: string, format: uuid }
      peerUserIds:
        type: array
        minItems: 1
        maxItems: 49
        uniqueItems: true
        items: { type: string, format: uuid }
      agentIds:
        type: array
        minItems: 1
        maxItems: 20
        uniqueItems: true
        items: { type: string, format: uuid }
  InviteHumanConversationRequest:
    type: object
    additionalProperties: false
    description: >-
      Add active Company members or Agents to a group direct conversation.
      At least one list must be nonempty. The resulting group is limited to
      50 humans and 20 Agents; two-person direct conversations cannot expand.
    anyOf:
      - required: [memberUserIds]
      - required: [agentIds]
    properties:
      memberUserIds:
        type: array
        minItems: 1
        maxItems: 50
        uniqueItems: true
        items: { type: string, format: uuid }
      agentIds:
        type: array
        minItems: 1
        maxItems: 20
        uniqueItems: true
        items: { type: string, format: uuid }
  CreateChannelRequest:
    type: object
    additionalProperties: false
    required:
    - requestKey
    - name
    properties:
      requestKey:
        type: string
        format: uuid
      name:
        type: string
        minLength: 1
        maxLength: 100
      topic:
        type: string
        description: At most 2048 UTF-8 bytes.
      memberUserIds:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 49
        uniqueItems: true
      agentIds:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 20
        uniqueItems: true
    description: Creator is implicit and cannot appear in memberUserIds. Name trims
      to 1–100 code points and at most 400 UTF-8 bytes. All targets must be active
      in this Company.
  UpdateChannelRequest:
    type: object
    additionalProperties: false
    required:
    - expectedRevision
    properties:
      expectedRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      name:
        type: string
      topic:
        type: string
    description: At least one of name/topic. Same bounds as create. Revision is configurationRevision;
      matching no-op retains it. Null fields are rejected.
  ChannelRevisionRequest:
    type: object
    additionalProperties: false
    required:
    - expectedRevision
    properties:
      expectedRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
  SendDiscussionRequest:
    type: object
    additionalProperties: false
    required:
      - requestKey
      - body
    properties:
      requestKey:
        type: string
        format: uuid
      body:
        $ref: '#/schemas/DiscussionBody'
      attachmentIds:
        type: array
        items:
          type: string
        maxItems: 20
      artifactIds:
        type: array
        maxItems: 10
        uniqueItems: true
        items: { type: string, format: uuid }
      threadRootId:
        oneOf:
          - type: string
            format: uuid
          - type: 'null'
      whiteboard:
        $ref: '#/schemas/DiscussionWhiteboardInput'
    description: >-
      128 KiB request cap. Up to twenty ready file attachments and ten Artifacts may be shared. A whiteboard
      creates a new Whiteboard Artifact owned by the sender in the same transaction and shares it into the chat
      like an Artifact in artifactIds, so its people can open it; it is not allowed in a Huddle chat or a thread. threadRootId may identify a root or
      reply; reply parents resolve to their original root before fingerprinting. Exact retries return
      the current edited/deleted message, including after archive, with current read access. Zero
      Runs.
  DiscussionWhiteboardInput:
    type: object
    additionalProperties: false
    required:
      - title
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 200
  QueryDiscussionStatesRequest:
    type: object
    additionalProperties: false
    required:
    - conversationIds
    properties:
      conversationIds:
        type: array
        items:
          type: string
          format: uuid
        minItems: 1
        maxItems: 50
        uniqueItems: true
  DiscussionStatesResponse:
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiscussionState'
        maxItems: 50
    description: Input order; missing/inaccessible resources omitted without distinguishing
      them. This POST only reads. Purge local content for omitted requested IDs.
  UpdateDiscussionStateRequest:
    type: object
    additionalProperties: false
    required:
    - expectedRevision
    properties:
      expectedRevision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      notificationLevel:
        type: string
        enum: [all, mentions, muted]
      pinned:
        type: boolean
      hidden:
        type: boolean
    description: At least one of pinned/hidden/notificationLevel. Revision is userState.revision, zero
      for null state. Personal state is writable after archive. Re-grants reset state
      and advance its revision. New peer messages reveal hidden conversations.

  DiscussionThreadSummary:
    type: object
    additionalProperties: false
    required:
      - replyCount
      - lastReplyAt
      - recentAuthors
    properties:
      unreadCount: {type: integer, format: int64, minimum: 0}
      manualUnreadSeq: {type: [integer, "null"], format: int64}
      replyCount:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      lastReplyAt:
        oneOf:
          - type: string
            format: date-time
          - type: 'null'
      recentAuthors:
        type: array
        items:
          $ref: '#/schemas/DiscussionAuthor'
        maxItems: 3
  DiscussionReactionSummary:
    type: object
    additionalProperties: false
    required:
      - emoji
      - count
      - reacted
    properties:
      emoji:
        type: string
        description: Canonical Unicode Emoji 16.0 sequence; at most 64 UTF-8 bytes.
      count:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      reacted:
        type: boolean
  DiscussionThreadState:
    type: object
    additionalProperties: false
    required:
      - readThroughSeq
      - manualUnreadSeq
      - rootId
      - revision
      - grantGeneration
      - follow
      - unreadCount
    properties:
      readThroughSeq:
        type: integer
        format: int64
      manualUnreadSeq:
        type: [integer, "null"]
        format: int64
      rootId:
        type: string
        format: uuid
      revision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      grantGeneration:
        oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
      follow:
        type: string
        enum:
          - ''
          - auto
          - following
          - unfollowed
      unreadCount:
        type: [integer, "null"]
        format: int64
        minimum: 0
  DiscussionMutation:
    type: object
    additionalProperties: false
    required:
      - message
      - conversationRevision
      - headSeq
    properties:
      message:
        $ref: '#/schemas/DiscussionMessage'
      conversationRevision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      headSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
  DiscussionPin:
    type: object
    additionalProperties: false
    required:
      - message
      - root
      - pinnedAt
      - pinnedByUserId
    properties:
      message:
        $ref: '#/schemas/DiscussionMessage'
      root:
        oneOf:
          - $ref: '#/schemas/DiscussionMessage'
          - type: 'null'
      pinnedAt:
        type: string
        format: date-time
      pinnedByUserId:
        type: string
        format: uuid
  DiscussionPins:
    type: object
    additionalProperties: false
    required:
      - items
      - nextCursor
      - totalCount
      - conversationRevision
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiscussionPin'
        maxItems: 100
      nextCursor:
        oneOf:
          - type: string
          - type: 'null'
      totalCount:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      conversationRevision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
  EditDiscussionRequest:
    type: object
    additionalProperties: false
    required:
      - expectedRevision
      - body
    properties:
      expectedRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      body:
        $ref: '#/schemas/DiscussionBody'
  UpdateDiscussionThreadRequest:
    type: object
    additionalProperties: false
    required:
      - expectedRevision
    properties:
      readThroughSeq:
        type: integer
        minimum: 0
      manualUnreadSeq:
        type: integer
        minimum: 0
        description: Zero clears; positive sequence marks unread. Requires expectedRevision.
      grantGeneration:
        type: integer
        minimum: 1
        description: Required for read state changes. Cannot be combined with follow.

      expectedRevision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      follow:
        type: string
        enum:
          - following
          - unfollowed
  DiscussionReaction:
    type: object
    additionalProperties: false
    required:
      - emoji
      - count
      - reacted
      - users
    properties:
      emoji:
        type: string
        description: Canonical Unicode Emoji 16.0 sequence; at most 64 UTF-8 bytes.
      count:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      reacted:
        type: boolean
      users:
        type: array
        items:
          $ref: '#/schemas/DiscussionAuthor'
        maxItems: 100
  DiscussionReactions:
    type: object
    additionalProperties: false
    required:
      - items
      - nextCursor
      - conversationRevision
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiscussionReaction'
        maxItems: 20
      nextCursor:
        oneOf:
          - type: string
          - type: 'null'
      conversationRevision:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
  DiscussionThreadPage:
    type: object
    additionalProperties: false
    required:
      - items
      - olderCursor
      - newerCursor
      - refreshCursor
      - headSeq
      - conversationRevision
      - grantGeneration
      - companyMembershipRevision
      - streamHeadSeq
      - root
      - state
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiscussionMessage'
        maxItems: 100
      olderCursor:
        oneOf:
          - type: string
          - type: 'null'
      newerCursor:
        type: string
      refreshCursor:
        type: string
      headSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      conversationRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      grantGeneration:
        oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
      companyMembershipRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      streamHeadSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      root:
        $ref: '#/schemas/DiscussionMessage'
      state:
        $ref: '#/schemas/DiscussionThreadState'
    description: >-
      A bounded reply-only stream plus its current root (including a tombstone) and viewer follow
      state. The whole response fits 512 KiB.
  DiscussionContext:
    type: object
    additionalProperties: false
    required:
      - items
      - olderCursor
      - newerCursor
      - refreshCursor
      - headSeq
      - conversationRevision
      - grantGeneration
      - companyMembershipRevision
      - streamHeadSeq
      - root
      - targetId
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/DiscussionMessage'
        maxItems: 100
      olderCursor:
        oneOf:
          - type: string
          - type: 'null'
      newerCursor:
        type: string
      refreshCursor:
        type: string
      headSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      conversationRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      grantGeneration:
        oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
      companyMembershipRevision:
        type: integer
        format: int64
        minimum: 1
        maximum: 9007199254740991
      streamHeadSeq:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
      root:
        oneOf:
          - $ref: '#/schemas/DiscussionMessage'
          - type: 'null'
      targetId:
        type: string
        format: uuid
    description: >-
      At most 25 neighbors before and 25 after the target in its stream, reduced by the 512 KiB total
      byte limit. No full-history fallback. Root is returned separately for a reply.

  MemberPresenceRequest:
    type: object
    additionalProperties: false
    properties:
      active:
        type: boolean
      manualAway:
        type: boolean
      userIds:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          format: uuid
  MemberPresenceResponse:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          $ref: '#/schemas/MemberPresence'
  MemberPresence:
    type: object
    required: [userId, online, manualAway]
    properties:
      userId:
        type: string
        format: uuid
      online:
        type: boolean
      manualAway:
        type: boolean

  DiscussionReadRequest:
