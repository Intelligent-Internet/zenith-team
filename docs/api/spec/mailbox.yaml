# Authored Mailbox-domain section of the Zenith Team API contract.
# docs/api/spec/openapi.yaml is the index and docs/api/mailbox.md is the prose
# counterpart. Company Email and Agent Mail share this domain because drafts
# are sent from the Company's configured mailbox. All Company routes require
# mailbox.manage for the acting member, including Agent requests. The permission
# catalog currently grants it only to owners.

paths:
  companies_companyId_mailbox:
    parameters:
      - $ref: './_common.yaml#/parameters/companyId'
    get:
      tags: [mailbox]
      operationId: getMailboxState
      summary: Read Company Email state
      description: Requires `mailbox.manage` for the acting member, including Agent requests. Returns `disabled` when this deployment has no mailbox integration.
      responses:
        '200':
          description: Current Company Email state and unread count.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxState' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
    post:
      tags: [mailbox]
      operationId: createMailbox
      summary: Configure the Company's one inbound email address
      description: Requires `mailbox.manage`. PostgreSQL generates the mailbox id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/MailboxCreateRequest' }
      responses:
        '201':
          description: Company Email configured.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxState' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '409':
          description: '`409 mailbox_already_configured` or `mailbox_address_unavailable`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  companies_companyId_mailbox_messages:
    get:
      tags: [mailbox]
      operationId: listMailboxMessages
      summary: List retained inbound email
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/limit'
        - $ref: './_common.yaml#/parameters/cursor'
      responses:
        '200':
          description: Newest-first message page.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxMessagePage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  companies_companyId_mailbox_messages_messageId:
    get:
      tags: [mailbox]
      operationId: getMailboxMessage
      summary: Read one inbound email and its attachment metadata
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/messageId'
      responses:
        '200':
          description: Message detail.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxMessageDetail' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '410':
          description: '`410 mailbox_message_expired` after the retention window.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '429':
          description: '`429 mailbox_provider_rate_limited`; carries `Retry-After`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '503': { $ref: './_common.yaml#/responses/ServiceUnavailable' }

  companies_companyId_mailbox_messages_messageId_read:
    post:
      tags: [mailbox]
      operationId: markMailboxMessageRead
      summary: Mark an inbound email read
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/messageId'
      responses:
        '200':
          description: Updated message projection.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxMessage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '410':
          description: '`410 mailbox_message_expired`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

  companies_companyId_mailbox_messages_messageId_attachments_attachmentId:
    get:
      tags: [mailbox]
      operationId: getMailboxAttachment
      summary: Create a short-lived inbound attachment download
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/messageId'
        - $ref: './_common.yaml#/parameters/attachmentId'
      responses:
        '200':
          description: Provider download receipt.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxAttachmentDownload' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '410':
          description: '`410 mailbox_message_expired`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '429':
          description: '`429 mailbox_provider_rate_limited`; carries `Retry-After`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '503': { $ref: './_common.yaml#/responses/ServiceUnavailable' }

  webhooks_resend_mailbox:
    post:
      tags: [mailbox]
      operationId: receiveMailboxWebhook
      summary: Accept one signed inbound-email event
      description: |
        Provider callback. It is unauthenticated at the Zenith Team session layer;
        the `svix-*` signature headers authenticate the raw body instead.
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/MailboxWebhookRequest' }
      responses:
        '200':
          description: Event accepted, including an exact provider replay.
          content:
            application/json:
              schema: { $ref: '#/schemas/MailboxWebhookResponse' }
        '400':
          description: '`400 mailbox_webhook_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  companies_companyId_conversations_conversationId_mail_draft_groups:
    parameters:
      - $ref: './_common.yaml#/parameters/companyId'
      - $ref: './_common.yaml#/parameters/conversationId'
    get:
      tags: [agent-mail]
      operationId: listAgentMailDraftGroups
      summary: List Agent Mail drafts produced by selected Runs
      parameters:
        - name: source_run_ids
          in: query
          required: true
          description: |
            One comma-separated value of 1..100 distinct UUID Run ids. The
            parameter is not repeated.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Matching draft groups.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraftGroupsResponse' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    post:
      tags: [agent-mail]
      operationId: createAgentMailDraftGroup
      summary: Create the current Run's reviewable Agent Mail drafts
      description: |
        Requires an ordinary bearer principal with `mailbox.manage` plus the supplemental live
        `X-Boardly-Run-Token`. The resolved token exclusively supplies the Run
        and Agent identity; the path Conversation must belong to that Run.
        PostgreSQL generates group, draft, and delivery ids.

        `Idempotency-Key` is a UUID scoped to this operation and Run. First
        creation returns `201`; exact replay returns the existing group with
        `200`. Reusing the key or Run with incompatible canonical content
        returns `409 agent_mail_draft_conflict`.
      parameters:
        - name: X-Boardly-Run-Token
          in: header
          required: true
          description: Supplemental proof for the live Run creating the drafts.
          schema: { type: string, pattern: '^brt_[0-9a-f]{64}$' }
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID replay fence scoped to this draft-create operation and Run.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/CreateAgentMailDraftGroupRequest' }
      responses:
        '200':
          description: Exact idempotent replay of the existing draft group.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraftGroup' }
        '201':
          description: Draft group created.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraftGroup' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401':
          description: '`401 authentication_required` or `401 run_token_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '409':
          description: '`409 agent_mail_company_email_required` or `agent_mail_draft_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  companies_companyId_conversations_conversationId_mail_draft_groups_groupId_send:
    post:
      tags: [agent-mail]
      operationId: sendAgentMailDraftGroup
      summary: Queue all reviewed drafts in a group
      description: |
        In a task chat, changing or sending its drafts is posting there: the
        caller needs `project.tasks.write` on the chat's Project (`403
        project_permission_required`), and someone who cannot read the
        Project gets `404 agent_mail_draft_not_found` (ADR 0017).
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/conversationId'
        - $ref: '#/parameters/groupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/SendAgentMailDraftGroupRequest' }
      responses:
        '202':
          description: Drafts queued for durable delivery.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraftGroup' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: '`409 agent_mail_draft_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '429':
          description: '`429 agent_mail_send_limit_exceeded`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

  companies_companyId_conversations_conversationId_mail_drafts_draftId:
    parameters:
      - $ref: './_common.yaml#/parameters/companyId'
      - $ref: './_common.yaml#/parameters/conversationId'
      - $ref: '#/parameters/draftId'
    put:
      tags: [agent-mail]
      operationId: updateAgentMailDraft
      summary: Replace a reviewable Agent Mail draft
      description: |
        In a task chat, changing or sending its drafts is posting there: the
        caller needs `project.tasks.write` on the chat's Project (`403
        project_permission_required`), and someone who cannot read the
        Project gets `404 agent_mail_draft_not_found` (ADR 0017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/UpdateAgentMailDraftRequest' }
      responses:
        '200':
          description: Updated draft.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraft' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: '`409 agent_mail_draft_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    delete:
      tags: [agent-mail]
      operationId: deleteAgentMailDraft
      summary: Delete an unsent Agent Mail draft
      description: |
        In a task chat, changing or sending its drafts is posting there: the
        caller needs `project.tasks.write` on the chat's Project (`403
        project_permission_required`), and someone who cannot read the
        Project gets `404 agent_mail_draft_not_found` (ADR 0017).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/AgentMailDraftVersionRequest' }
      responses:
        '204': { description: Draft deleted. No body. }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: '`409 agent_mail_draft_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }

  companies_companyId_conversations_conversationId_mail_drafts_draftId_send:
    post:
      tags: [agent-mail]
      operationId: sendAgentMailDraft
      summary: Queue one reviewed Agent Mail draft
      description: |
        In a task chat, changing or sending its drafts is posting there: the
        caller needs `project.tasks.write` on the chat's Project (`403
        project_permission_required`), and someone who cannot read the
        Project gets `404 agent_mail_draft_not_found` (ADR 0017).
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/conversationId'
        - $ref: '#/parameters/draftId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/AgentMailDraftVersionRequest' }
      responses:
        '202':
          description: Draft queued for durable delivery.
          content:
            application/json:
              schema: { $ref: '#/schemas/AgentMailDraft' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: '`409 agent_mail_draft_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '429':
          description: '`429 agent_mail_send_limit_exceeded`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

parameters:
  groupId:
    name: groupId
    in: path
    required: true
    schema: { type: string, format: uuid }
  draftId:
    name: draftId
    in: path
    required: true
    schema: { type: string, format: uuid }

schemas:
  MailboxWebhookRequest:
    type: object
    description: |
      Provider-owned signed JSON. Zenith Team verifies the exact raw bytes before
      the email adapter decodes the provider envelope.
    additionalProperties: true

  MailboxWebhookResponse:
    type: object
    additionalProperties: false
    required: [received]
    properties:
      received: { type: boolean, const: true }

  MailboxStatus:
    type: string
    enum: [disabled, unconfigured, active]

  CompanyMailbox:
    type: object
    required: [id, localPart, address, createdAt, revision]
    properties:
      id: { type: string, format: uuid }
      localPart: { type: string }
      address: { type: string, format: email }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }

  MailboxState:
    type: object
    required: [status, domain, mailbox, canCreate, unreadCount]
    properties:
      status: { $ref: '#/schemas/MailboxStatus' }
      domain: { type: string }
      mailbox:
        oneOf:
          - { $ref: '#/schemas/CompanyMailbox' }
          - { type: "null" }
      canCreate: { type: boolean }
      unreadCount: { type: integer, format: int64, minimum: 0 }

  MailboxCreateRequest:
    type: object
    additionalProperties: false
    required: [localPart]
    properties:
      localPart:
        type: string
        minLength: 3
        maxLength: 64
        pattern: '^[a-z0-9]+([._-][a-z0-9]+)*$'

  MailboxMessage:
    type: object
    required:
      [id, sender, subject, recipients, receivedAt, expiresAt, readAt, hasAttachments, revision]
    properties:
      id: { type: string, format: uuid }
      sender: { type: string }
      subject: { type: string }
      recipients:
        type: array
        items: { type: string }
      receivedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      expiresAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      readAt:
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      hasAttachments: { type: boolean }
      revision: { $ref: './_common.yaml#/schemas/Revision' }

  MailboxMessagePage:
    type: object
    required: [messages, nextCursor]
    properties:
      messages:
        type: array
        items: { $ref: '#/schemas/MailboxMessage' }
      nextCursor: { type: [string, "null"] }

  MailboxAttachment:
    type: object
    required: [id, filename, mimeType, sizeBytes]
    properties:
      id: { type: string, format: uuid }
      filename: { type: string }
      mimeType: { type: string }
      sizeBytes: { type: [integer, "null"], format: int64, minimum: 0 }
      disposition: { type: string }
      contentId: { type: string }

  MailboxMessageDetail:
    allOf:
      - { $ref: '#/schemas/MailboxMessage' }
      - type: object
        required: [from, to, cc, bcc, replyTo, html, text, attachments]
        properties:
          from: { type: string }
          to:
            type: array
            items: { type: string }
          cc:
            type: array
            items: { type: string }
          bcc:
            type: array
            items: { type: string }
          replyTo:
            type: array
            items: { type: string }
          html: { type: string }
          text: { type: string }
          attachments:
            type: array
            items: { $ref: '#/schemas/MailboxAttachment' }

  MailboxAttachmentDownload:
    type: object
    required: [url, expiresAt]
    properties:
      url: { type: string, format: uri }
      expiresAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  AgentMailDraftStatus:
    type: string
    enum: [draft, sending, sent, failed]

  AgentMailDraftDeliveryInput:
    type: object
    additionalProperties: false
    required: [to, cc]
    properties:
      to:
        type: array
        minItems: 1
        maxItems: 50
        items: { type: string, format: email, maxLength: 320 }
      cc:
        type: array
        maxItems: 50
        items: { type: string, format: email, maxLength: 320 }

  AgentMailDraftInput:
    type: object
    additionalProperties: false
    required: [subject, text, deliveries]
    properties:
      subject: { type: string, minLength: 1, maxLength: 200 }
      text: { type: string, minLength: 1, maxLength: 65536 }
      deliveries:
        type: array
        minItems: 1
        maxItems: 100
        items: { $ref: '#/schemas/AgentMailDraftDeliveryInput' }

  AgentMailDraftDelivery:
    type: object
    required: [id, to, cc, acceptedAt]
    properties:
      id: { type: string, format: uuid }
      to:
        type: array
        items: { type: string, format: email }
      cc:
        type: array
        items: { type: string, format: email }
      acceptedAt:
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }

  AgentMailDraft:
    type: object
    required:
      - id
      - groupId
      - subject
      - text
      - fromName
      - fromAddress
      - status
      - sendGeneration
      - recipientCount
      - deliveries
      - sentAt
      - failedAt
      - failureReason
      - createdAt
      - updatedAt
      - revision
    properties:
      id: { type: string, format: uuid }
      groupId: { type: string, format: uuid }
      subject: { type: string }
      text: { type: string }
      fromName: { type: string }
      fromAddress: { type: string, format: email }
      status: { $ref: '#/schemas/AgentMailDraftStatus' }
      sendGeneration: { type: integer, format: int64, minimum: 0 }
      recipientCount: { type: integer, minimum: 1 }
      deliveries:
        type: array
        items: { $ref: '#/schemas/AgentMailDraftDelivery' }
      sentAt:
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      failedAt:
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      failureReason: { type: [string, "null"] }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }

  AgentMailDraftGroup:
    type: object
    required:
      [id, conversationId, sourceRunId, agentId, recipientCount, drafts, createdAt, updatedAt]
    properties:
      id: { type: string, format: uuid }
      conversationId: { type: string, format: uuid }
      sourceRunId:
        {"type": "string", "format": "uuid"}
      agentId: { type: string, format: uuid }
      recipientCount: { type: integer, minimum: 1 }
      drafts:
        type: array
        items: { $ref: '#/schemas/AgentMailDraft' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  AgentMailDraftGroupsResponse:
    type: object
    required: [groups]
    properties:
      groups:
        type: array
        items: { $ref: '#/schemas/AgentMailDraftGroup' }

  CreateAgentMailDraftGroupRequest:
    type: object
    additionalProperties: false
    required: [drafts]
    properties:
      drafts:
        type: array
        minItems: 1
        maxItems: 100
        items: { $ref: '#/schemas/AgentMailDraftInput' }

  UpdateAgentMailDraftRequest:
    type: object
    additionalProperties: false
