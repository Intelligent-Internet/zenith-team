paths:
  output_list:
    get:
      tags: [artifacts]
      operationId: outputDocumentHistoryList
      summary: List shared document history
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: outputItemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: string, format: date-time}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: before_sequence, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        '200':
          description: Saved document history
          content:
            application/json:
              schema: {$ref: '#/schemas/DocumentHistory'}
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  output_state:
    get:
      tags: [artifacts]
      operationId: outputDocumentHistoryState
      summary: State shared document history
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: outputItemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sequence, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Saved document history
          content:
            application/json:
              schema: {$ref: '#/schemas/DocumentHistoryState'}
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  output_restore:
    post:
      tags: [artifacts]
      operationId: outputDocumentHistoryRestore
      summary: Restore shared document history
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: outputItemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sequence, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/DocumentHistoryRestore'}
      responses:
        '200':
          description: Saved document history
          content:
            application/json:
              schema: {$ref: '#/schemas/DocumentHistoryState'}
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  output_name:
    put:
      tags: [artifacts]
      operationId: outputDocumentHistoryName
      summary: Name shared document history
      parameters:
        - {name: companyId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: artifactId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: outputItemId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: sequence, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/schemas/DocumentHistoryName'}
      responses:
        '204':
          description: Checkpoint name saved
        default:
          description: Request could not be completed
          content:
            application/json:
              schema: {$ref: './_common.yaml#/schemas/Error'}
  project_list:
    get:
      tags: [artifacts]
      operationId: projectDocumentHistoryList
      summary: List shared document history
