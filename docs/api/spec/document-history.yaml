schemas:
  DocumentHistory:
    type: object
    required: [items, contributors, nextBeforeSequence, currentSequence, canEdit]
    properties:
      items: {type: array, items: {$ref: '#/schemas/DocumentHistoryEntry'}}
      contributors: {type: array, items: {$ref: '#/schemas/DocumentContributor'}}
      nextBeforeSequence: {type: integer, format: int64}
      currentSequence: {type: integer, format: int64}
      canEdit: {type: boolean}
  DocumentHistoryEntry:
    type: object
    required: [sequence, savedAt, actorType, actorName, changeType, label]
    properties:
      sequence: {type: integer, format: int64}
      savedAt: {type: string, format: date-time}
      actorType: {type: string, enum: [user, agent, system]}
      actorId: {type: string, format: uuid}
      actorName: {type: string}
      changeType: {type: string, enum: [initial, edit, restore]}
      label: {type: string}
      suggestionReview: {$ref: '#/schemas/DocumentSuggestionReview'}
  DocumentSuggestionReview:
    type: object
    required: [id, changeId, pageId, agentName, action, beforeSequence, beforeTheme, resultTheme]
    properties:
      id: {type: string, format: uuid}
      changeId: {type: string, format: uuid}
      projectId: {type: string, format: uuid}
      pageId: {type: string, format: uuid}
      agentId: {type: string, format: uuid}
      agentName: {type: string}
      action: {type: string, enum: [apply, undo]}
      beforeSequence: {type: integer, format: int64}
      beforeRevisionId: {type: string, format: uuid}
      resultRevisionId: {type: string, format: uuid}
      beforeTheme: {type: string}
      resultTheme: {type: string}
  DocumentContributor:
    type: object
    required: [actorType, actorId, actorName]
    properties:
      actorType: {type: string, enum: [user, agent]}
      actorId: {type: string, format: uuid}
      actorName: {type: string}
  DocumentHistoryState:
    type: object
    required: [sequence, previousSequence, markdown, content, schemaVersion]
    properties:
      schemaVersion: {type: integer, enum: [1, 2]}
      sequence: {type: integer, format: int64}
      previousSequence: {type: integer, format: int64}
      markdown: {type: string}
      content: {$ref: './canvas.yaml#/schemas/CanvasBlock'}
      suggestionCapture: {$ref: '#/schemas/DocumentSuggestionCapture'}
  DocumentSuggestionCapture:
    type: object
    description: Exact retained before and result of an acceptance or undo, redacted against current source access.
    required: [beforeContent, resultContent, beforeMarkdown, resultMarkdown, beforeSchemaVersion, resultSchemaVersion]
    properties:
      beforeSchemaVersion: {type: integer, enum: [1, 2]}
      resultSchemaVersion: {type: integer, enum: [1, 2]}
      beforeContent: {$ref: './canvas.yaml#/schemas/CanvasBlock'}
      resultContent: {$ref: './canvas.yaml#/schemas/CanvasBlock'}
      beforeMarkdown: {type: string}
      resultMarkdown: {type: string}
  DocumentHistoryRestore:
    type: object
    required: [expectedSequence]
    properties:
      schemaVersion: {type: integer, enum: [1, 2], description: "Client document capability; omission means 1. Must support both the current draft and the historical content."}
      expectedSequence: {type: integer, format: int64, minimum: 1}
  DocumentHistoryName:
    type: object
    required: [label]
    properties:
      label: {type: string, maxLength: 200}
