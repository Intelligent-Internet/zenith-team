# Authored domain section of the Zenith Team API contract.
# docs/api/spec/openapi.yaml is the index
# that references it, and docs/api/inbox.md is its prose counterpart.

paths:

  # ==================================================================== inbox

  # /api/v1/companies/{companyId}/inbox
  companies_companyId_inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      summary: List the caller's inbox items
      description: |
        The caller's own items, newest first. The recipient is always the
        caller: no parameter reads another member's inbox.

        Pages **backward** (newest first) over `(createdAt, id)`. The next page
        seeks with `(created_at, id) < (cursor_created_at, cursor_id)` and
        over-fetches by one, so `nextCursor` is accurate even when timestamps
        tie.

        `status` selects a view, not a sort: `active` is everything unarchived,
        `unread` is the unread half of that, `archived` is only archived items,
        and `all` is the true union.

        `status` and `kind` are independent filters and combine with AND, so
        `status=unread&kind=blocker` is the unread blockers and nothing else.

        Unknown, repeated, or empty-valued query parameters are `422`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: status
          in: query
          required: false
          description: |
            `all` is the true union, archived rows included. It previously meant
            "all unarchived", so no value returned the union and a client
            wanting full history made two calls and merged them; the default
            view is now named `active` for what it is.
          schema: { type: string, enum: [active, unread, archived, all], default: active }
        - name: kind
          in: query
          required: false
          description: |
            One kind, not a list. Backs the blockers-only view, which otherwise
            paged the whole inbox and filtered client-side. Accepts every kind
            an item can carry — the filter vocabulary is the item vocabulary.
          schema:
            type: string
            enum:
              - task_assigned
              - blocker
              - run_completed
              - run_failed
              - approval_request
              - question_request
              - runtime_offline
              - invitation_renewal
              - task_run_requested
              - task_handoff
              - calendar_reminder
              - calendar_update
              - discussion_mention
              - analytics_budget
              - huddle_missed
              - project_access_granted
        - $ref: './_common.yaml#/parameters/limit'
        - $ref: './_common.yaml#/parameters/cursor'
      responses:
        '200':
          description: A page of inbox items, newest first. `items` is `[]` when empty.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/InboxItem' }
                  nextCursor: { type: [string, "null"] }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` — unknown, or no longer an active member.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422':
          description: |
            `422 validation_failed` for an unknown, repeated or empty-valued
            parameter, a `status` or `kind` outside its vocabulary, or a `limit`
            outside 1..100. `422 invalid_cursor` for a malformed cursor or an
            unsupported encoding version.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/inbox/counts
  companies_companyId_inbox_counts:
    get:
      tags: [inbox]
      operationId: getInboxCounts
      summary: Unread count and counts version
      description: |
        The counts projection alone, for the badge. `unreadCount` counts items
        that are neither read nor archived — the rows whose `unread` is `true`.
        `countsVersion` orders count frames, so a stale one is discarded.

        **Accepts no query parameters**; anything in the query string is `422`.
        The handler used to skip parsing it entirely, so unknown parameters were
        silently ignored here while the sibling list rejected them.

        Never call this after a mutation: every write below returns the same
        projection, read inside its own transaction.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/InboxCounts' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` — unknown, or no longer an active member.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/inbox/read-all
  companies_companyId_inbox_read_all:
    post:
      tags: [inbox]
      operationId: readAllInbox
      summary: Mark every unread item read
      description: |
        Marks every unread, unarchived item read in one transaction. Takes no
        request body and no query parameters; archived items are left alone.

        Returns the rows it changed, newest first, with their bumped
        `revision`s. It used to answer counts alone, which left a client
        holding a cached list to clear `readAt` on its own rows by guesswork.

        When nothing was unread the call short-circuits: `items` `[]`, current
        counts, and no event.

        Raises **no** per-item `inbox.updated` frames — an unread backlog has
        no upper bound and a frame per row can overrun the client send buffer.
        The writer already holds the rows and the refreshed counts from this
        receipt; another session converges on its next read.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: |
            The rows that moved and the new counts.
          content:
            application/json:
              schema: { $ref: '#/schemas/InboxBulkReadResult' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/inbox/{itemId}
  companies_companyId_inbox_itemId:
    get:
      tags: [inbox]
      operationId: getInboxItem
      summary: Read one inbox item
      description: |
        One item addressed to the caller. **Archived items are returned
        normally** — the archive filter belongs to the list, not to identity.

        A malformed `itemId` is `404 inbox_item_not_found`: a path id that
        cannot name a row is indistinguishable from one that names nothing, and
        that is how every other resource answers it. Any query parameter is
        `422`; the handler used to ignore the query string entirely.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/itemId'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: { $ref: '#/schemas/InboxItem' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 inbox_item_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/inbox/{itemId}/{mutation}
  companies_companyId_inbox_itemId_mutation:
    post:
      tags: [inbox]
      operationId: mutateInboxItem
      summary: Mark an item read, unread, archived, or restored
      description: |
        The mutation is the **path segment**, not a body field. `read` and
        `unread` set and clear `readAt`; `archive` and `restore` set and clear
        `archivedAt`. **The two axes are independent** — archiving does not mark
        an item read, and an archived item leaves `unreadCount` because the
        count excludes archived rows, not because its `readAt` moved.

        `expectedRevision` carries no struct-level rule but is still mandatory
        — the service rejects anything below 1 — so an empty `{}` body is `422`
        rather than an unconditional write. The requirement is invisible at the
        transport layer.

        A no-op mutation (read on an already-read item, restore on an unarchived
        one) returns `200` with an **unchanged `revision`** and raises no
        realtime event.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/itemId'
        - name: mutation
          in: path
          required: true
          schema: { type: string, enum: [read, unread, archive, restore] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      responses:
        '200':
          description: |
            The item after the mutation — flat, at the top level — with the
            refreshed counts beside it. `counts` rides along because reading it
            separately is the request this response exists to remove.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/schemas/InboxItem'
                  - $ref: '#/schemas/InboxCountsSidecar'
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 inbox_item_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 inbox_item_revision_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — an unrecognized `mutation` segment, or an
            `expectedRevision` below 1 (including an omitted one).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/inbox/read
  companies_companyId_inbox_read:
    post:
      tags: [inbox]
      operationId: readConversationInbox
      summary: Mark one conversation's inbox items read
      description: |
        Replaces paging the entire unread inbox, filtering client-side, and
        issuing one serial write per match — up to two hundred requests to
        clear one conversation.

        Marks every unread, unarchived item raised about the named conversation
        read in one transaction. Archived items are untouched. There is no
        `expectedRevision` and there cannot be a conflict: the write is a set
        operation over rows the caller owns, and marking an already-read row
        read is not a change.

        A conversation with nothing unread answers `items: []` and raises no
        event, so a repeated call is harmless; an id the caller cannot see is
        `404`, so a typo never reads as "nothing to mark".

        Every changed row also arrives as an `inbox.updated` frame on the user
        scope — each frame carrying the refreshed `counts` beside the item —
        so the caller's other sessions converge without a read. The set is
        bounded by one conversation's unread notifications.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              properties:
                conversationId:
                  type: string
                  format: uuid
                  description: The conversation whose notifications to mark read.
      responses:
        '200':
          description: |
            The rows that moved and the resulting counts.
          content:
            application/json:
              schema: { $ref: '#/schemas/InboxBulkReadResult' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `404 conversation_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — a missing or non-uuid `conversationId`, or
            any query parameter.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }



