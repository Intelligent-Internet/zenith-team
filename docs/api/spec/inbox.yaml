schemas:

  # ------------------------------------------------------------------ inbox

  InboxItem:
    type: object
    description: |
      One durable notification addressed to one member — always the caller on
      these routes, and the socket-scope recipient on the realtime frames.
      There is no create endpoint: items are inserted inside the transaction
      of the mutation that caused them, deduped per recipient on the causing
      event's identity.

      One wire type — the reads here and the `inbox.created` / `inbox.updated`
      frames carry these identical item bytes (the frames add the recipient's
      refreshed `counts` beside them).

      Note the Go field `Type` serializes as `kind`, matching every other
      discriminator in the API.
    required:
      - id
      - companyId
      - kind
      - title
      - body
      - unread
      - readAt
      - archivedAt
      - createdAt
      - updatedAt
      - revision
    properties:
      id: { type: string, format: uuid }
      companyId: { type: [string, "null"], format: uuid }
      kind:
        type: string
        enum:
          - task_assigned
          - blocker
          - run_completed
          - run_failed
          - approval_request
          - question_request
          - runtime_offline
          - invitation_renewal
          - task_run_requested
          - task_handoff
          - calendar_reminder
          - calendar_update
          - discussion_mention
          - analytics_budget
          - huddle_missed
          - project_access_granted
        description: |
          Closed vocabulary, validated on write. Branch on this for behaviour
          and for styling — urgency is a fixed projection of the kind, so it
          is not served as a second field.
      title:
        type: string
        maxLength: 160
        description: |
          Frozen at write time. It is a record of the event, not a live view of
          whatever raised it.
      body:
        type: string
        description: Up to 2048 bytes. Frozen at write time.
      deepLink:
        type: string
        description: |
          A root-relative in-app path: always one leading `/`, never absolute or
          protocol-relative, no backslash, at most 1024 characters.

          `omitempty`, so it is **absent** rather than `null` when unset. Current
          writers set it. It is a navigation hint only — the item's own `id` is
          its identity.
      unread:
        type: boolean
        description: |
          `readAt === null && archivedAt === null` — the exact predicate behind
          `unreadCount`. Two nullable timestamps are not the same question, and
          the conjunction is the one clients get wrong in the direction that
          matters: archiving an unread item lowers the badge without touching
          `readAt`, so a client deriving unread from `readAt` alone drifts from
          the server's own count and never converges.
      readAt: { type: [string, "null"], format: date-time }
      archivedAt: { type: [string, "null"], format: date-time }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }

  InboxCountsSidecar:
    type: object
    description: |
      The recipient's counters, composed onto every inbox write so a badge
      updates without a second read. They are read inside the same transaction
      that performed the write, so they are at least as fresh as anything a
      follow-up `GET .../inbox/counts` could return.

      `counts` keeps its own key rather than being spread flat beside the row's
      fields: it is not a group of the item's own scalars but the recipient's
      projection, it has its own endpoint that returns it at the top level, and
      the `inbox.created` / `inbox.updated` frames carry exactly these bytes beside
      their item — one wire type, one cache slot, written whole.
    required: [counts]
    properties:
      counts: { $ref: './_common.yaml#/schemas/InboxCounts' }

  InboxBulkReadResult:
    type: object
    description: |
      The result of a set write over the caller's own rows — `read-all`, or one
      conversation's items.

      `items` is the affected row set itself, not a page: there is no
      `nextCursor`, and no separate change counter — the set's size is the
      count. A second identical call answers `items: []` and raises no event.
    required: [items, counts]
    properties:
      items:
        type: array
        description: The changed rows, newest first. `[]` when nothing moved.
        items: { $ref: '#/schemas/InboxItem' }
      counts: { $ref: './_common.yaml#/schemas/InboxCounts' }
