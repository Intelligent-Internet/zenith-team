        "many",
        "zero_many"
      ],
      "description": "What a connector shows at one end: a filled arrow, an open arrow, a hollow triangle (inheritance), a hollow or filled diamond (aggregation, composition), or an entity relationship's crow's-foot cardinality (one, zero_one, many, zero_many)."
    },
    "BoardRouteType": {
      "type": "string",
      "enum": [
        "flow",
        "straight",
        "elbow",
        "message"
      ],
      "description": "A connector's path: flow leaves the source's right side for the target's left side (the Board's usual connector); straight joins the boxes along the line between their centers; elbow turns once between their facing sides; message runs straight across at anchorY below the source's top, and is the one route that may return to its source (a sequence diagram's self message)."
    },
    "BoardHeadType": {
      "type": "string",
      "enum": [
        "actor"
      ],
      "description": "How a lifeline's head is drawn: actor is an actor's figure over its name, a person or an outside system taking part in a sequence. Absent is a box."
    },
    "BoardShapeType": {
      "type": "string",
      "enum": [
        "rectangle",
        "ellipse",
        "diamond",
        "triangle",
        "rounded",
        "terminal",
        "actor",
        "database",
        "queue",
        "cloud",
        "component",
        "document",
        "note",
        "lifeline",
        "class",
        "entity",
        "fragment"
      ],
      "description": "A shape's kind: basic shapes, and software diagram notation. rounded is a process or service; terminal a pill for a flow's start or end; actor a stick figure with its name below; database an upright cylinder; queue a cylinder on its side; component a box with two tabs; document a box with a wavy bottom; note a box with a folded corner; lifeline a sequence diagram participant (header box over a dashed line); class and entity boxes with compartments; fragment a sequence diagram's combined fragment (alt, loop, opt…)."
    },
    "BoardComposeConnectorStyle": {
      "type": "string",
      "enum": [
        "arrow",
        "line",
        "both",
        "dashed",
        "inherits",
        "implements",
        "composes",
        "aggregates",
        "depends",
        "associates",
        "includes",
        "extends",
        "sync",
        "async",
        "reply"
      ],
      "description": "A connector preset: arrow (default), line, both, dashed; class relations inherits and implements (hollow triangle), composes and aggregates (filled or hollow diamond at the whole, the source), depends (dashed open arrow), associates; use case includes and extends (dashed, «include»/«extend»); sequence messages sync, async and reply (dashed)."
    },
    "BoardComposeFragment": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "type",
        "first",
        "last"
      ],
      "properties": {
        "type": {
          "type": "string",
          "enum": [
            "alt",
            "opt",
            "loop",
            "par",
            "break",
            "critical"
          ]
        },
        "label": {
          "type": "string",
          "maxLength": 200,
          "description": "The first operand's guard, bracketed when drawn."
        },
        "first": {
          "type": "integer",
          "minimum": 1,
          "description": "The first message it encloses, 1-based."
        },
        "last": {
          "type": "integer",
          "minimum": 1
        },
        "else": {
          "type": "array",
          "maxItems": 3,
          "items": {
            "$ref": "#/schemas/BoardComposeBranch"
          },
          "description": "Further operands of alt and par: a fragment draws at most four operands."
        }
      }
    },
    "BoardComposeBranch": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "at"
      ],
      "properties": {
        "at": {
          "type": "integer",
          "minimum": 1,
          "description": "The message the operand starts at."
        },
        "label": {
          "type": "string",
          "maxLength": 200
        }
      }
    }
  }
}
