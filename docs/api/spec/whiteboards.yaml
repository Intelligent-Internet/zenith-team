                "$ref": "#/schemas/BoardComposeInput"
              }
            }
          }
        },
        "description": "Adds content by intent: notes, a text, a shape, a left-to-right diagram, an SVG-path sketch, connectors, or arranges existing objects. The server measures and lays it out, places the whole request as one group where the person who authorized the Run is looking (the nearest free space when that area is full, beside the Board's content when nobody looks), and applies one native batch with the same receipts and fences as operations. The receipt identifies the intent, so a retry with the same request key replays the same objects. The Agent's cursor moves to the new work, which it selects and outlines as its work area."
      }
    },
