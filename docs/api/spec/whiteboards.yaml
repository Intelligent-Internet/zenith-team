    "file": {
      "get": {
        "tags": [
          "whiteboards"
        ],
        "operationId": "downloadWhiteboardFile",
        "summary": "Download a file placed on a whiteboard",
        "parameters": [
          {
            "$ref": "./_common.yaml#/parameters/companyId"
          },
          {
            "name": "boardId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "attachmentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "variant",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "original",
                "preview"
              ]
            },
            "description": "`preview` returns the bounded image preview when the file has one; otherwise the original file."
          },
          {
            "name": "If-None-Match",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "File bytes. Member downloads revalidate with an ETag, so a cached copy is reused only after the server resolves current Board access.",
            "content": {
              "*/*": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "default": {
            "description": "Request could not be completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./_common.yaml#/schemas/Error"
                }
              }
            }
          },
          "304": {
            "description": "The cached copy named by If-None-Match is still current and readable."
          }
        }
      }
    },
    "agentLibrary": {
      "get": {
        "tags": [
          "whiteboards"
        ],
        "operationId": "agentListWhiteboards",
        "summary": "Agent list whiteboards",
        "parameters": [
          {
            "$ref": "./_common.yaml#/parameters/runId"
          },
          {
            "$ref": "./_common.yaml#/parameters/companyId"
          },
          {
            "name": "offset",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 0
            },
            "description": "Skip this many invitations. Responses contain at most 100 Boards."
          },
          {
            "name": "X-Boardly-Run-Token",
            "in": "header",
            "required": true,
            "description": "Proof of the running Run the path names; its member must be the caller (`401 run_token_invalid`).",
            "schema": {
              "type": "string",
              "pattern": "^brt_[0-9a-f]{64}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Authorized committed result",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/schemas/BoardList"
                }
              }
            }
          },
          "default": {
            "description": "Request could not be completed",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "./_common.yaml#/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Requires the exact live Run proof, its authorizing member, and an invitation to this Board. Read invitations cannot edit; revocation and terminal Runs fence retries. The native Board services and wire schemas are shared with humans."
      }
    },
