  "schemas": {
    "Board": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string",
          "format": "uuid"
        },
        "companyId": {
          "type": "string",
          "format": "uuid"
        },
        "title": {
          "type": "string"
        },
        "purpose": {
          "type": "string"
        },
        "sequence": {
          "type": "integer",
          "format": "int64"
        },
        "revision": {
          "type": "integer",
          "format": "int64"
        },
        "createdBy": {
          "type": "string",
          "format": "uuid"
        },
        "createdAt": {
          "type": "string",
          "format": "date-time"
        },
        "updatedAt": {
          "type": "string",
          "format": "date-time"
        },
        "archivedAt": {
          "anyOf": [
            {
              "type": "string",
              "format": "date-time"
            },
            {
              "type": "null"
            }
          ]
        },
        "favorite": {
          "type": "boolean"
        },
        "canEdit": {
          "type": "boolean"
        },
        "canManage": {
          "type": "boolean"
        },
        "visibility": {
          "type": "string",
          "enum": [
            "private",
            "company",
            "public"
          ]
        },
        "canShare": {
          "type": "boolean"
        }
      },
      "required": [
        "id",
        "companyId",
        "title",
        "purpose",
        "sequence",
        "revision",
        "createdBy",
        "createdAt",
        "updatedAt",
        "archivedAt",
        "favorite",
        "canEdit",
        "canManage",
        "visibility",
        "canShare"
      ]
    },
    "BoardList": {
      "type": "object",
      "properties": {
        "boards": {
          "type": "array",
          "items": {
            "$ref": "#/schemas/Board"
          }
        },
        "hasMore": {
          "type": "boolean"
        }
      },
      "required": [
        "boards",
        "hasMore"
      ]
    },
    "CreateBoardInput": {
      "type": "object",
      "properties": {
        "requestKey": {
          "type": "string",
          "format": "uuid"
        },
        "title": {
          "type": "string",
          "minLength": 1,
          "maxLength": 200
        },
        "purpose": {
          "type": "string",
          "maxLength": 2000
        }
      },
      "required": [
        "requestKey",
        "title"
      ]
    },
    "UpdateBoardInput": {
      "type": "object",
      "properties": {
        "expectedRevision": {
          "type": "integer",
          "format": "int64"
        },
        "title": {
          "anyOf": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            {
              "type": "null"
            }
          ]
        },
        "purpose": {
          "anyOf": [
            {
              "type": "string",
              "maxLength": 2000
            },
            {
              "type": "null"
            }
          ]
        },
        "archived": {
          "anyOf": [
            {
              "type": "boolean"
            },
            {
              "type": "null"
            }
          ]
        }
      },
      "required": [
        "expectedRevision"
      ]
    },
    "BoardGeometry": {
      "type": "object",
      "properties": {
        "x": {
          "type": "number",
          "format": "double"
        },
        "y": {
          "type": "number",
          "format": "double"
        },
        "width": {
          "type": "number",
          "format": "double"
        },
        "height": {
          "type": "number",
          "format": "double"
        },
        "rotation": {
          "type": "number",
          "format": "double"
        },
        "stackOrder": {
          "type": "integer",
          "format": "int64"
        },
        "parentFrameId": {
          "anyOf": [
            {
              "type": "string",
              "format": "uuid"
            },
            {
              "type": "null"
            }
          ]
        },
        "readingOrder": {
          "type": "integer",
          "format": "int64"
        }
      },
      "required": [
        "x",
        "y",
        "width",
        "height",
        "rotation",
        "stackOrder",
        "parentFrameId",
        "readingOrder"
      ]
    },
    "BoardProperties": {
      "type": "object",
      "properties": {
        "title": {
          "type": "string"
        },
        "color": {
          "type": "string",
          "description": "An ink, #rrggbb or #rrggbbaa. An ink swatch's name (graphite, blue, green, yellow, rose) is stored as its value."
