parameters:
  taskReference:
    name: taskId
    in: path
    required: true
    description: |
      The task's id, or the name people give it: its `key` in any letter
      case, else the `{taskPrefix}-{number}` label the board shows, in this
      company's prefix and any letter case. A key that is exactly the name
      wins over another task's label; keys are unique only in their exact
      letter case, and when two equal the name in another case the older
      task (lower `number`) wins. A name that is no task is
      `404 task_not_found`.
    schema: { type: string, minLength: 1 }
  runTokenRead:
    name: X-Boardly-Run-Token
    in: header
    required: false
    description: |
      Sent by a Run's channel. When present it must prove a running Run in
      this Company, and the read covers only that Run's own tasks: the ones
      its agent does for the member the Run works for.
    schema: { type: string, pattern: '^brt_[0-9a-f]{64}$' }

responses:
  UnauthorizedRunRead:
    description: |
      `401` — `authentication_required`, `session_invalid` or
      `invalid_credentials`, or `run_token_invalid` when a supplied
      `X-Boardly-Run-Token` does not prove a running Run in this Company.
    content:
      application/json:
        schema: { $ref: './_common.yaml#/schemas/Error' }
  TaskOutsideRunScope:
    description: |
      `403 task_outside_run_scope` — sent with a Run's token, the task is
      not one of the Run's own. The body carries nothing of the task — no
      content, label, member or agent name — and its `detail` is always
      "Permission denied. You can only access your own Tasks."
    content:
      application/json:
        schema: { $ref: './_common.yaml#/schemas/Error' }

schemas:
  FinalizeTaskResultsInput:
    type: object
    additionalProperties: false
    required: [expectedRevision, outputIds]
    properties:
      expectedRevision: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
      outputIds:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: { type: string, format: uuid }
  TaskResultPolicy:
    type: object
    additionalProperties: false
    required: [proposalOnly, reviewRequired]
    properties:
      proposalOnly: { type: boolean, description: Assigned before execution; approval endorses the proposal without applying it. }
      reviewRequired: { type: boolean, description: Whether selection requires separate Task approval. }
  TaskResultSelectionInput:
    type: object
    additionalProperties: false
    required: [requestKey, outputIds]
    properties:
      requestKey: { type: string, format: uuid }
      outputIds:
        type: array
        minItems: 1
        maxItems: 32
        uniqueItems: true
        items: { type: string, format: uuid }
      acceptChanges:
        type: array
        maxItems: 32
        description: Exact reviewed changes to apply atomically with the selection and optional done transition.
        items:
          type: object
          additionalProperties: false
          required: [projectId, pageId, changeId, input]
          properties:
            projectId: { type: string, format: uuid }
            pageId: { type: string, format: uuid }
            changeId: { type: string, format: uuid }
            input: { $ref: './pages.yaml#/schemas/PageChangeReviewInput' }
  TaskResultSelection:
    type: object
    additionalProperties: false
    required: [proposalOnly, reviewRequired, policyEditable, hasUnavailable, taskRevision, selectionId, outputIds, approvedAt]
    properties:
      proposalOnly: { type: boolean }
      reviewRequired: { type: boolean }
      taskRevision: { $ref: './_common.yaml#/schemas/Revision' }
      hasUnavailable: { type: boolean, description: Some selected evidence is no longer readable and its identities are withheld. }
      policyEditable: { type: boolean, description: False once execution has begun. }
      selectionId: { type: [string, 'null'], format: uuid }
      outputIds:
        type: array
        items: { type: string, format: uuid }
      approvedAt: { type: [string, 'null'], format: date-time }

  TaskFailureRequest:
    type: object
    additionalProperties: false
    required: [reason]
    properties:
      reason:
        type: string
        minLength: 1
        maxLength: 2000

  TaskFailureResponse:
    type: object
    additionalProperties: false
    required: [status, task]
    properties:
      status: { type: string, const: failed }
      task: { $ref: '#/schemas/Task' }

  TaskReportEventDto:
    type: object
    required:
      - id
      - taskId
      - taskKey
      - taskTitle
      - outcome
      - completionSource
      - completedAt
      - resultSummary
    properties:
      id: { type: string, format: uuid }
      taskId: { type: string, format: uuid }
      taskKey: { type: string }
      taskTitle: { type: string }
      outcome: { type: string, enum: [done, failed] }
      completionSource:
        type: string
        enum: [manual, review_accepted, agent_business_failure]
      completedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      resultSummary: { type: string, maxLength: 600 }


  TaskReportPreviewDto:
    type: object
    required:
      [recipientAgentId, conversationId, pendingCount, agentBusy, truncated, events]
    properties:
      recipientAgentId: { type: string, format: uuid }
      conversationId: { type: string, format: uuid }
      pendingCount: { type: integer, format: int64, minimum: 0 }
      agentBusy: { type: boolean }
      truncated: { type: boolean }
      events:
        type: array
        maxItems: 100
        items: { $ref: '#/schemas/TaskReportEventDto' }


  SendTaskReportsRequest:
    type: object
    additionalProperties: false
    required: [requestKey]
    properties:
      requestKey:
        type: string
        format: uuid
        description: Caller-generated replay key; never used as an entity id.


  SendTaskReportsResponse:
    type: object
    required: [batchId, messageId, runId, eventCount]
    properties:
      batchId: { type: string, format: uuid }
      messageId: { type: string, format: uuid }
      runId:
        {"type": "string", "format": "uuid"}
      eventCount: { type: integer, format: int32, minimum: 1 }

  AssigneeRef:
    type: object
    description: |
      Which member a task is assigned to, on the **write** side. Always a
      member (ADR 0014): the assignee is the person responsible for running
      the task on their own computer.

      Deliberately not the response's `ActorRef`: that one carries a display
      name and avatar, and the request decoder rejects unknown fields, so a
      client generated from `ActorRef` would send a body the server refuses.
    required: [id, kind]
    properties:
      id: { type: string, format: uuid }
      kind: { type: string, enum: [user] }

  ExecutorRef:
    type: object
    description: |
      Who does a task's work, on the **write** side: an agent, or the
      assignee themself (`kind: user` with the assignee's id — any other
      member is `422`).
    required: [id, kind]
    properties:
      id: { type: string, format: uuid }
      kind: { type: string, enum: [user, agent] }

  TaskExecution:
    type: object
    description: |
      Whether the task can start on its assignee's computer, without naming
      that computer. `assigneeReady` is true when the assignee has set the
      executing or assisting agent up on a runtime that is online, usable
      and signed in, and holds `project.tasks.execute` on the task's
      Project. `agent` names that agent: `executedBy` for agent work,
      otherwise the creating agent, with the CEO as fallback for tasks
      created by a member. Human work keeps its human `executedBy`.
      `agent` is null when no such agent exists. `unreadyReason` says why
      not — `not_bound` (the assignee has not set the agent up),
      `runtime_offline`, `runtime_unusable`, `runtime_signed_out`,
      `agent_archived`, `assignee_inactive` (the assignee is no longer an
      active member, or their account is closed, and the task needs
      reassigning), or `assignee_cannot_run`
      (the assignee does not hold `project.tasks.execute` on the task's
      Project, so a start would be refused with
      `403 project_permission_required`; someone who manages the Project
      grants it, or the task goes to someone who holds it) — or `null`.
      When several apply, the first of `assignee_inactive`, `agent_archived`,
      `assignee_cannot_run`, `not_bound` and then the computer's state is
      given. It is read live, so it can change while `revision` stays: when
      the assignee's setup or computer changes, `task.updated` carries the
      task again with the same `revision`, and when their access to the
      Project changes, `project.access_changed` tells the Project's readers
      to read its tasks again.
    required: [agent, assigneeReady, unreadyReason]
    properties:
      agent:
        description: The agent that executes or assists this task's conversation.
        oneOf:
          - $ref: './_common.yaml#/schemas/ActorRef'
          - type: 'null'
      assigneeReady: { type: boolean }
      unreadyReason:
        type: [string, "null"]
        enum: [not_bound, runtime_offline, runtime_unusable, runtime_signed_out, agent_archived, assignee_inactive, assignee_cannot_run, null]


  DependencyEdge:
    type: object
    description: |
      One dependency edge, seen from one task. `task` is always the **other**
      endpoint — the prerequisite inside `blockedBy`, the dependent inside
      `blocks` — so both directions share one wire type and a blocker chip
      renders from the edge alone.

      `revision` is the **edge's**, which is what
      `PlanArtifact.base.dependencies` expects; the task's own version travels
      inside `task`.
    required: [task, createdAt, revision]
    properties:
      task: { $ref: '#/schemas/DependencyTask' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }


  DependencyGraph:
    type: object
    description: |
      The complete matching edge set plus the stubs it names. `tasks` covers
      exactly the endpoints of `items`, so the response is self-contained.
    required: [items, tasks]
    properties:
      items:
        type: array
        items: { $ref: './_common.yaml#/schemas/TaskDependency' }
      tasks:
        type: array
        description: Stubs for every task named by an edge on this page.
        items: { $ref: './_common.yaml#/schemas/DependencyGraphTask' }


  DependencySet:
    type: object
    description: |
      Both directions for one task. Either array being `[]` is an
      authoritative empty, not missing data.
    required: [blockedBy, blocks]
    properties:
      blockedBy:
        type: array
        description: Edges whose `task` must reach `done` before this one may run.
        items: { $ref: '#/schemas/DependencyEdge' }
      blocks:
        type: array
        description: Edges whose `task` is waiting on this one.
        items: { $ref: '#/schemas/DependencyEdge' }


  DependencyTask:
    type: object
    description: |
      The far endpoint of a dependency edge, carried inline so "blocked by
      ENG-9, which Ada owns" renders without a read per blocker.
    required: [id, projectId, key, number, title, status, assignee, executedBy, revision]
    properties:
      id: { type: string, format: uuid }
      projectId: { type: string, format: uuid }
      key: { type: string }
      number:
        type: integer
        format: int64
        description: What every surface displays as `{taskPrefix}-{number}`.
      title: { type: string }
      status: { $ref: './_common.yaml#/schemas/TaskStatus' }
      assignee: { $ref: './_common.yaml#/schemas/ActorRef' }
      executedBy: { $ref: './_common.yaml#/schemas/ActorRef' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }


  PlanApplyResult:
    type: object
    description: |
      Compact counts across the Plan transaction's entity mutations, and the
      Project changes it left undone because the applier lacks the Project
      permission they need (ADR 0017).
    required: [created, updated, deleted, skipped]
    properties:
      created: { type: integer }
      updated: { type: integer }
      deleted: { type: integer }
      skipped:
        type: array
        description: |
          Project changes the apply left undone while the rest applied
          (ADR 0017): renaming a Project without `project.settings.update`
          (`update`); archiving it, or leaving it out of `desired` while it
          has open Tasks, without `project.archive` (`archive`); or changing
          it or its Tasks after the applier lost `project.tasks.write` or
          `project.read` there since the plan was read (`tasks`). In the
          last two the whole Project and its Tasks are left as they are.
          Empty when nothing was held back.
        items: { $ref: '#/schemas/PlanSkip' }

  PlanSkip:
    type: object
    required: [entityType, key, operation, permission]
    properties:
      entityType: { type: string, enum: [project] }
      key: { type: string }
      operation: { type: string, enum: [update, archive, tasks] }
      permission:
        allOf: [{ $ref: './projects.yaml#/schemas/ProjectPermission' }]
        description: |
          The Project permission the applier lacks: `project.settings.update`
          to rename, `project.archive` to archive or empty the Project,
          `project.tasks.write` or `project.read` for `tasks`.


  PlanArtifact:
    type: object
    description: |
      The plan document as its author reads the Company. `base` is the plan
      snapshot the client read — every Project they read, every Task in it
      (terminal ones included) and every dependency edge, each with its
      revision; `desired` is the target. The apply reaches only the listed
      Projects the applier may change (ADR 0017). Both stay nested: they are two
      documents the caller assembles and ships whole, not groupings of the
      response's own scalars. The apply is a three-way reconciliation and is
      the **only** path that deletes tasks or writes dependencies.
    required: [artifactVersion, companyId, companySlug, createdAt, base, desired]
    properties:
      artifactVersion: { type: integer, const: 1 }
      companyId: { type: string, format: uuid }
      companySlug:
        type: string
        description: Must equal the live slug, else `409 work_plan_conflict`.
      createdAt:
        allOf: [{ $ref: './_common.yaml#/schemas/Timestamp' }]
        description: |
          Must fall inside `now - 24h` .. `now + 5min`, else
          `409 work_plan_conflict`. A zero value is `422` instead.
      base:
        type: object
        required: [projects, tasks, dependencies]
        properties:
          projects:
            type: array
            items: { $ref: './_common.yaml#/schemas/PlanBaseEntity' }
          tasks:
            type: array
            items: { $ref: './_common.yaml#/schemas/PlanBaseEntity' }
          dependencies:
            type: array
            items:
              type: object
              required: [dependentTaskId, prerequisiteTaskId, revision]
              properties:
                dependentTaskId: { type: string, format: uuid }
                prerequisiteTaskId: { type: string, format: uuid }
                revision: { $ref: './_common.yaml#/schemas/Revision' }
      desired:
        type: object
        required: [formatVersion, company, projects, tasks]
        properties:
          formatVersion:
            type: integer
            const: 5
            description: |
              Company Tasks and their dependencies, each naming its assignee
              agent by id.
          company: { type: string }
          projects:
            type: array
            items: { $ref: './approvals.yaml#/schemas/CompanyPlanProject' }
          tasks:
            type: array
            items:
              type: object
              required:
                - key
                - projectKey
                - title
                - description
                - status
                - priority
                - agentId
                - milestoneType
                - dependsOn
              properties:
                key: { type: string }
                projectKey: { type: string }
                title: { type: string, maxLength: 240 }
                description: { type: string }
                status:
                  allOf: [{ $ref: './_common.yaml#/schemas/TaskStatus' }]
                  description: |
                    `failed` and `error` may only restate an existing Task
                    already in that same server-owned status; a Plan
                    cannot introduce either outcome.
                priority: { $ref: '#/schemas/TaskPriority' }
                agentId:
                  type: string
                  description: |
                    The Agent that does the work (`executedBy`) — any active
                    Agent of the company. Empty when the task's assignee does
                    the work themself. A task the plan creates is assigned to
                    the member who applies the plan; a restated task keeps its
                    assignee.
                milestoneType: { $ref: '#/schemas/TaskMilestoneTypeDto' }
                dependsOn:
                  type: array
                  items:
                    type: object
                    required: [taskKey]
                    properties:
                      taskKey: { type: string }

  # ------------------------------------------------------------- tasks

  Task:
    type: object
    required:
      - assignmentStatus
      - scheduledAt
      - scheduleFiredAt
      - scheduleId
      - scheduleOccurrenceAt
      - scheduleDisposition
      - id
      - key
      - companyId
      - projectId
      - milestoneType
      - conversationId
      - number
      - title
      - description
      - status
      - priority
      - labels
      - startDate
      - dueDate
      - assignee
      - executedBy
      - execution
      - creator
      - blockedByCount
      - dependenciesResolved
      - assigneeOutsideProject
      - createdAt
      - updatedAt
      - completedAt
      - revision
    properties:
      assignmentStatus: { type: string, enum: [accepted, pending, declined] }
      scheduledAt: { type: [string, "null"], format: date-time }
      scheduleFiredAt: { type: [string, "null"], format: date-time }
      scheduleId: { type: [string, "null"], format: uuid }
      scheduleOccurrenceAt: { type: [string, "null"], format: date-time }
      scheduleDisposition: { type: string, enum: ['', scheduled, started, skipped, missed, cancelled] }
      id: { type: string, format: uuid }
      key:
        type: string
        description: |
          Stable identity, unique per company: the displayed
          `{taskPrefix}-{number}` label when the server minted it on a
          create without a key, otherwise the slug a Company Plan or client
          chose (never in that label shape).
      companyId: { type: string, format: uuid }
      projectId: { type: string, format: uuid, description: Immutable owning Project. }
      milestoneType: { $ref: '#/schemas/TaskMilestoneTypeDto' }
      conversationId:
        type: string
        format: uuid
        description: Every task owns exactly one conversation.
      number:
        type: integer
        format: int64
        example: 14
        description: Monotonic per company. What every surface displays as `{taskPrefix}-{number}`.
      title: { type: string, maxLength: 240 }
      description: { type: string }
      status: { $ref: './_common.yaml#/schemas/TaskStatus' }
      priority: { $ref: '#/schemas/TaskPriority' }
      labels: { $ref: '#/schemas/TaskLabels' }
      startDate: { $ref: '#/schemas/TaskCalendarDate' }
      dueDate: { $ref: '#/schemas/TaskCalendarDate' }
      assignee:
        description: "The member responsible for running the task on their own computer. Always `kind: user`."
        $ref: './_common.yaml#/schemas/ActorRef'
      executedBy:
        description: "Who does the work — an agent, or the assignee themself (then identical to `assignee`)."
        $ref: './_common.yaml#/schemas/ActorRef'
      execution: { $ref: '#/schemas/TaskExecution' }
      creator: { $ref: './_common.yaml#/schemas/ActorRef' }
      blockedByCount:
        type: integer
        format: int64
        example: 2
        description: |
          Prerequisites this task has, done or not. A board draws its
          "2 blockers" chip from this instead of one dependency read per row.
      dependenciesResolved:
        type: boolean
        description: |
          False while any prerequisite is not `done`. This is the exact
          predicate the enqueue path evaluates, so a client disables *Start*
          rather than discovering `409 task_dependency_blocked`. It is **not**
          derivable from `blockedByCount`: a task can have four prerequisites
          and still be startable because all four are finished.
      assigneeOutsideProject:
        type: boolean
        description: |
          True when the task sits in a restricted Project and its assignee
          cannot read that Project (ADR 0017): the assignee can neither open
          nor run it until someone gives them access. The server decides it
          on every read and frame; a client shows it and never works it out
          from the Project's grants.
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      completedAt:
        description: |
          Latest business outcome time, or `null` while unfinished. A new user
          message that resumes a `failed` Task clears this field.
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      revision: { $ref: './_common.yaml#/schemas/Revision' }
      access:
        description: |
          Present on every REST response; left out of `task.created` and
          `task.updated` frames.
        $ref: '#/schemas/TaskAccess'

  TaskAccess:
    type: object
    description: |
      What the caller may do with the task (ADR 0017): their effective
      permissions on the task's Project, decided by the server and merged
      exactly like the Project's own `access.permissions` (grants, plus the
      company-visible floor, plus the management names for `projects.manage`
      holders). A task appears only to readers of its Project, so
      `project.read` is always present. Clients gate on it and never derive
      it from a role. Every REST read carries it; `task.created` and
      `task.updated` frames reach other people and leave it out, so a client
      keeps the value it read and refetches on the frame.
    required: [permissions]
    properties:
      permissions:
        type: array
        items: { $ref: './projects.yaml#/schemas/ProjectPermission' }


  TaskMutationResult:
    description: |
      The one task-write receipt: the updated task **flat**, with the run the
      transition enqueued as a sibling `runId`. PATCH and the run-start action
      share it, so both land in the same cache slot. Whether a run was created
      is exactly `runId != null` — there is no separate flag.
    allOf:
      - $ref: '#/schemas/Task'
      - type: object
        required: [runId, assigneeOutsideProjectTaskIds]
        properties:
          assigneeOutsideProjectTaskIds:
            type: array
            items: { type: string, format: uuid }
            description: |
              The written tasks whose assignee cannot read the task's Project
              (ADR 0017), usually empty. An assignee who loses access keeps
              the task until someone who can read the Project and holds
              `tasks.assign` hands it over; a client shows an "outside
              project" badge. It names no one.
          runId:
            {"type": ["string", "null"], "format": "uuid", "description": "The run this write enqueued, or `null` when the transition\nstarted nothing. The run projection arrives through the run API\nand realtime lifecycle events.\n"}

  TaskHandoffConfirmationError:
    description: |
      The `task_handoff_confirmation_required` refusal: the standard error
      envelope with `runLive` flat beside it.
    allOf:
      - $ref: './_common.yaml#/schemas/Error'
      - type: object
        required: [runLive]
        properties:
          code: { const: task_handoff_confirmation_required }
          runLive:
            type: boolean
            description: |
              `true` when a run of the task is live right now, so confirming
              the handoff cancels it; `false` when the task only ran before.
              Read from the same runs a confirmed handoff would cancel.

  TaskUpdateConflict:
    description: |
      What a refused task update returns with 409. Branch on `code`: only
      `task_handoff_confirmation_required` carries `runLive`; every other
      conflict is the plain envelope. `anyOf`, not `oneOf`: the envelope
      admits extra keys, so a handoff refusal matches both branches.
    anyOf:
      - $ref: '#/schemas/TaskHandoffConfirmationError'
      - $ref: './_common.yaml#/schemas/Error'

  TaskPriority:
    type: string
    enum: [low, medium, high, urgent]


  TaskMilestoneTypeDto:
    type: string
    description: Stable Task planning outcome from milestone catalog version 3.
    enum:
      - positioning
      - brand
      - presence
      - finance
      - product
      - launch
      - growth
      - sales_outbound
      - operations
      - support

  TaskLabels:
    type: array
    maxItems: 20
    description: Task-owned display labels, trimmed and deduplicated case-insensitively in first-seen order. Empty and control-character labels are rejected. These are not Company-managed label identities.
    items: { type: string, minLength: 1, maxLength: 48 }

  TaskCalendarDate:
    description: Gregorian calendar date (year 0001–9999), without a time zone; null means unset.
    oneOf:
      - { type: string, format: date }
      - { type: "null" }

  TaskCalendarSchedule:
    type: object
    required: [id, templateTaskId, trigger, paused, revision]
    properties:
      id: { type: string, format: uuid }
      templateTaskId: { type: string, format: uuid }
      trigger: { $ref: './schedules.yaml#/schemas/ScheduleTrigger' }
      paused: { type: boolean }
      revision: { type: integer, format: int64 }
  TaskCalendarOccurrence:
    type: object
    required: [task, schedule, occurrenceAt, runAt, materialized]
    properties:
      task: { $ref: '#/schemas/Task' }
      schedule: { $ref: '#/schemas/TaskCalendarSchedule' }
      occurrenceAt: { type: string, format: date-time }
      runAt: { type: string, format: date-time }
      materialized: { type: boolean }
  TaskCalendarPage:
    type: object
    required: [occurrences, truncated]
    properties:
      occurrences:
        type: array
        items: { $ref: '#/schemas/TaskCalendarOccurrence' }
      truncated: { type: boolean }
  TaskScheduleInput:
    type: object
    required: [expectedRevision]
    properties:
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      trigger: { $ref: './schedules.yaml#/schemas/ScheduleTrigger' }
      paused: { type: boolean, default: false }
  TaskOccurrenceInput:
    type: object
    required: [expectedRevision, occurrenceAt]
    properties:
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      occurrenceAt: { type: string, format: date-time }
      runAt: { type: [string, "null"], format: date-time }
      cancel: { type: boolean, default: false }
      title: { type: string, maxLength: 200 }
      description: { type: string, maxLength: 50000 }
  TaskAssignmentInput:
    type: object
    required: [expectedRevision, accept]
    properties:
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      accept: { type: boolean }
