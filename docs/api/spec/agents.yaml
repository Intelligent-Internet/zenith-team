schemas:
  AgentBindingRequest:
    type: object
    additionalProperties: false
    description: |
      Which of the caller's runtimes should run the agent. The runtime must
      be one the caller registered, of the agent's provider.
    required: [runtimeId]
    properties:
      runtimeId: { type: string, format: uuid }

  AgentVoiceSettings:
    type: object
    additionalProperties: false
    required: [enabled, voice, greet, participation]
    description: Huddle voice capability, on unless turned off for the Agent; it only takes effect on servers that run voice Agents. Does not grant runtime tools or skills. Profile changes apply at the next invitation; disabling revokes current voice sessions.
    properties:
      enabled: { type: boolean, default: true }
      voice: { type: string, enum: [aster, beacon, cinder, marin, stone, vesper], default: marin }
      greet:
        type: boolean
        default: true
        deprecated: true
        description: Ignored. Invited Agents always greet once; the server prevents replay on reconnect.
      participation: { type: string, enum: [addressed, natural], default: addressed }
  PlatformSkill:
    type: object
    additionalProperties: false
    required: [key, name, description, references]
    description: >-
      One compiled platform skill. `key` is the reserved `zenith-<name>`
      key an Agent passes to `load_skill_reference`; `name` is what a
      person reads; `references` are the file paths it can load beside
      `SKILL.md`, in bytewise path order (so `zenith-workflows` lists its
      playbooks by key, not in `listWorkflows`' name order).
    properties:
      key: { type: string, example: zenith-platform }
      name: { type: string, example: Zenith platform }
      description: { type: string }
      references:
        type: array
        items: { type: string, example: references/outputs.md }


  # ------------------------------------------------------------- tasks
  AgentCapabilitySettings:
    type: object
    additionalProperties: false
    required: [disabledBuiltIns, disabledPlugins, disabledMcpServers]
    description: >-
      Replaces this Agent's capability selections using expectedRevision on PATCH.
      enabledTools opts into managed Zenith Team tools; absent or empty means
      disabled, including for existing Agents. Zenith Studio uses the local
      Studio CLI account on the Runtime computer, separately from Connector policy.
      The selection is template state: the denial lists name plugins and MCP
      servers from the company's catalog for the agent's provider, and apply
      on whichever runtime a member's binding names — an id the machine does
      not have is simply not there. Empty arrays restore inheritance;
      enabling never installs a plugin or grants Company Connector authority;
      retained denials can be cleared even after discovery removes an item.
      Plugin-bundle skills share their containing plugin's switch. Future
      interactive Runs freeze the selection; queued/running Runs and retries
      keep their original inputs. Reviewed Schedule Connector scopes stay
      independent.
    properties:
      enabledTools:
        type: array
        maxItems: 1
        default: []
        items: { type: string, enum: [zenith-studio] }
      disabledBuiltIns:
        type: array
        maxItems: 5
        items: { type: string, enum: [planning, coordination, saved-work, founder-input, wiki] }
      disabledPlugins:
        type: array
        maxItems: 500
        items: { type: string, format: uuid }
      disabledMcpServers:
        type: array
        maxItems: 500
        items: { type: string, format: uuid }

  AgentSkillFile:
    type: object
    required: [path, sizeBytes, sha256, text]
    properties:
      path: { type: string }
      sizeBytes: { type: integer, format: int64 }
      sha256: { type: string }
      text: { type: boolean }
  AgentSkill:
    type: object
    required: [id, agentId, versionId, name, description, enabled, revision, contentHash, sizeBytes, fileCount, files, sourceType, sourceUrl, sourceCommit, sourcePath, updatedAt, edited]
    properties:
      id: { type: string, format: uuid }
      agentId: { type: string, format: uuid }
      versionId: { type: string, format: uuid }
      name: { type: string }
      description: { type: string }
      enabled: { type: boolean }
      revision: { type: integer, format: int64 }
      contentHash: { type: string }
      sizeBytes: { type: integer, format: int64 }
      fileCount: { type: integer }
      files:
        type: array
        items: { $ref: '#/schemas/AgentSkillFile' }
      sourceType: { type: string, enum: [github, zip, markdown] }
      sourceUrl: { type: string }
      sourceCommit: { type: string }
      sourcePath: { type: string }
      updatedAt: { type: string, format: date-time }
      edited: { type: boolean, description: Files were edited in Zenith Team; source fields describe the original import. }
  AgentSkillPreviewVersion:
    type: object
    required: [versionId, name, description, contentHash, sizeBytes, files, sourcePath, instructions]
    properties:
      versionId: { type: string, format: uuid }
      name: { type: string }
      description: { type: string }
      contentHash: { type: string }
      sizeBytes: { type: integer, format: int64 }
      files:
        type: array
        items: { $ref: '#/schemas/AgentSkillFile' }
      sourcePath: { type: string }
      instructions: { type: string }
  AgentSkillCandidate:
    allOf:
      - $ref: '#/schemas/AgentSkillPreviewVersion'
      - type: object
        properties:
          originalName:
            type: string
            description: Source name when normalization or collision handling changed the installed name.
          existingSkill:
            type: object
            required: [id, revision]
            properties:
              id: { type: string, format: uuid }
              revision: { type: integer, format: int64, minimum: 1 }
          addAsNew:
            $ref: '#/schemas/AgentSkillPreviewVersion'
  AgentSkillPreview:
    type: object
    required: [id, expiresAt, sourceType, sourceUrl, sourceCommit, skills]
    properties:
      id: { type: string, format: uuid }
      expiresAt: { type: string, format: date-time }
      sourceType: { type: string, enum: [github, zip, markdown] }
      sourceUrl: { type: string }
      sourceCommit: { type: string }
      skills:
        type: array
        items: { $ref: '#/schemas/AgentSkillCandidate' }
  AgentSkillCollection:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items: { $ref: '#/schemas/AgentSkill' }
  AgentSkillReference:
    type: object
    required: [path, content, sha256]
    properties:
      path: { type: string }
      content: { type: string }
      sha256: { type: string }
  AgentSkillGitHubRequest:
    type: object
    additionalProperties: false
    required: [url]
    properties:
      url: { type: string, maxLength: 2048 }
      replaceSkillId: { type: string, format: uuid }
  AgentSkillInstallRequest:
    type: object
    additionalProperties: false
    required: [importId, versionIds]
    properties:
      importId: { type: string, format: uuid }
      versionIds:
        type: array
        minItems: 1
        maxItems: 32
        items: { type: string, format: uuid }
      replaceSkillId: { type: string, format: uuid }
      expectedRevision: { type: integer, format: int64, minimum: 1 }
      replacements:
        type: array
        maxItems: 32
        description: Explicit per-version updates; mutually exclusive with replaceSkillId and expectedRevision. Unlisted versions are added without replacing existing skills.
        items:
          type: object
          additionalProperties: false
          required: [versionId, skillId, expectedRevision]
          properties:
            versionId: { type: string, format: uuid }
            skillId: { type: string, format: uuid }
            expectedRevision: { type: integer, format: int64, minimum: 1 }
  AgentSkillUpdateRequest:
    type: object
    additionalProperties: false
    description: |
      Supply enabled to change access, or changes/deletePaths to edit existing files.
      These modes cannot be mixed. File edits publish a new immutable version;
      the installed name cannot change and SKILL.md cannot be deleted. The complete
      resulting package must have valid frontmatter and no missing Markdown references.
      Original import provenance is retained. Existing Runs keep their frozen version.
    required: [expectedRevision]
    oneOf:
      - required: [enabled]
        properties:
          changes: { maxItems: 0 }
          deletePaths: { maxItems: 0 }
      - not:
          required: [enabled]
          properties:
            enabled: { type: boolean }
        anyOf:
          - required: [changes]
            properties:
              changes: { minItems: 1 }
          - required: [deletePaths]
            properties:
              deletePaths: { minItems: 1 }
    properties:
      enabled: { type: boolean }
      expectedRevision: { type: integer, format: int64, minimum: 1 }
      changes:
        type: array
        maxItems: 2000
        items:
          type: object
          additionalProperties: false
          required: [path, content]
          properties:
            path: { type: string, minLength: 1, maxLength: 1024 }
            content: { type: string, description: UTF-8 text; empty content is allowed for supporting files. }
      deletePaths:
        type: array
        maxItems: 2000
        items: { type: string, minLength: 1, maxLength: 1024 }
  AgentSkillRemoveRequest:
    type: object
    additionalProperties: false
    required: [expectedRevision]
    properties:
      expectedRevision: { type: integer, format: int64, minimum: 1 }
