      subdomain: { type: string, description: Name reserved for this output across unpublish and republish. }
      failureCode: { $ref: '#/schemas/PublicationFailureCode' }
      failureDetail: { type: string }
      publishedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      unpublishedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }

  PublicationCreateInput:
