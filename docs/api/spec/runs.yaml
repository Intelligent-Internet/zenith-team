  # /api/v1/companies/{companyId}/runs/{runId}/artifacts/{artifactId}/items/{ordinal}/download
  companies_companyId_runs_runId_artifacts_artifactId_items_ordinal_download:
    get:
      tags: [runs, deliverables]
      operationId: downloadArtifactItem
      summary: Download one file item from a saved Artifact
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ordinal
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 31 }
        - name: X-Boardly-Artifact-Cache
          in: header
          description: Opt into desktop disk-cache revalidation after current artifact authorization.
          schema: { type: string, enum: [revalidate] }
        - name: If-None-Match
          in: header
          description: Exact ETag from a prior authorized download; only used with the desktop cache opt-in header.
          schema: { type: string }
      responses:
        '200':
          description: The stored bytes with their authoritative content type and filename. Studio source snapshots use application/vnd.zenith-studio.canvas+json.
          headers:
            ETag:
              description: Immutable attachment identity and revision, present for opted-in desktop downloads.
              schema: { type: string }
            Cache-Control:
              description: Private no-cache for desktop revalidation; private no-store otherwise.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/vnd.zenith-studio.canvas+json:
              schema: { $ref: '#/schemas/StudioCanvas' }
        '304':
          description: The caller still has access and the ready attachment matches the supplied ETag. No file bytes or storage read.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ['private, no-cache'] }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 not_found` — including a malformed Artifact, ordinal, or inaccessible item.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


  # /api/v1/companies/{companyId}/runs/{runId}/artifacts/{artifactId}/items/{ordinal}/share
  companies_companyId_runs_runId_artifacts_artifactId_items_ordinal_share:
    post:
      tags: [runs, deliverables]
      operationId: shareArtifactItem
      summary: Create a temporary share link for one saved Artifact file
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ordinal
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 31 }
      responses:
        '200':
          description: A Zenith Team URL that checks current artifact access when opened.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `private, no-store`.
          content:
            application/json:
              schema: { $ref: '#/schemas/ArtifactShareLink' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 not_found` — including a malformed Artifact, ordinal, or inaccessible item.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
        '503': { $ref: './_common.yaml#/responses/ServiceUnavailable' }



parameters:
  artifactId:
    name: artifactId
    in: path
    required: true
    schema: { type: string, format: uuid }
  granteeUserId:
    name: userId
    in: path
    required: true
    schema: { type: string, format: uuid }

schemas:

  StudioCanvas:
    type: object
    additionalProperties: false
    description: Immutable source artifact saved by present_output alongside Studio media. Contains only the supplied source graph, with no credentials or live provider URLs. Maximum encoded size is 1 MiB.
    required: [version, projectId, nodes, edges]
    properties:
      version: { type: integer, enum: [1] }
      projectId: { type: string, minLength: 1, maxLength: 128 }
      nodes:
        type: array
        minItems: 1
        maxItems: 200
        items: { $ref: '#/schemas/StudioCanvasNode' }
      edges:
        type: array
        maxItems: 400
        items:
          type: object
          additionalProperties: false
          required: [source, target]
          properties:
            source: { type: string, minLength: 1, maxLength: 128 }
            target: { type: string, minLength: 1, maxLength: 128 }

  StudioCanvasNode:
    type: object
    additionalProperties: false
    required: [id, type, label, position]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      type: { type: string, minLength: 1, maxLength: 80 }
      label: { type: string, minLength: 1, maxLength: 160 }
      position:
        type: object
        additionalProperties: false
        required: [x, y]
        properties:
          x: { type: number, minimum: -1000000, maximum: 1000000 }
          y: { type: number, minimum: -1000000, maximum: 1000000 }
      prompt: { type: string, maxLength: 16000 }
      model: { type: string, maxLength: 16000 }
      status: { type: string, maxLength: 16000 }
      outputOrdinal:
        type: integer
        minimum: 0
        maximum: 31
        description: Zero-based ordinal of this node's media in the same frozen Output. Omitted for nodes without a delivered file.

  PresentRunOutputItemRequest:
    type: object
    additionalProperties: false
    required: [role, label]
    properties:
      role: { $ref: '#/schemas/DeliverableItemRole' }
      label: { type: string, minLength: 1, maxLength: 120 }
      assetVersionId: { type: string, format: uuid }
      attachmentId: { type: string, format: uuid }
    oneOf:
      - required: [assetVersionId]
      - required: [attachmentId]

  ArtifactType:
    type: string
    enum: [app, media, text, file]
    description: |
      The dedicated Artifact experience: running app preview, image/audio/video media,
      readable text such as a plan, or a general file collection.

  AppPreviewCommand:
    type: object
    additionalProperties: false
    required: [command, port]
    properties:
      command: { type: string, minLength: 1, maxLength: 4096 }
      args:
        type: array
        maxItems: 64
        items: { type: string, maxLength: 4096 }
      workingDirectory: { type: string, minLength: 1, maxLength: 4096 }
      port: { type: integer, minimum: 1024, maximum: 65535 }

  PresentRunAppOutput:
    type: object
    additionalProperties: false
    required: [commands]
    properties:
      commands:
        type: array
        minItems: 1
        maxItems: 8
        items: { $ref: '#/schemas/AppPreviewCommand' }

  PresentRunOutputRequest:
    type: object
    additionalProperties: false
    required: [title, summary]
    oneOf:
      - required: [type, app]
        properties:
          type: { const: app }
          items: { type: array }
        not:
          required: [items]
          properties:
            items: {}
      - required: [items]
        properties:
          type:
            type: string
            enum: [media, text, file]
          app: { type: object }
        not:
          required: [app]
          properties:
            app: {}
    properties:
      type:
        allOf: [{ $ref: '#/schemas/ArtifactType' }]
        default: file
        description: App requires an app command document and no file items.
      app:
        $ref: '#/schemas/PresentRunAppOutput'
      presentationId:
        type: string
        format: uuid
        description: Optional native Project presentation prepared by this exact Run; requires type=text and its canonical primary export.
      title: { type: string, minLength: 1, maxLength: 160 }
      summary: { type: string, minLength: 1, maxLength: 4000 }
      submissionNotes: { type: string, minLength: 1, maxLength: 4000 }
      items:
        type: array
        minItems: 1
        maxItems: 32
        items: { $ref: '#/schemas/PresentRunOutputItemRequest' }

  PresentRunOutputResponse:
    type: object
    additionalProperties: false
    required: [outputId]
    properties:
      outputId: { type: string, format: uuid }

  DeliverableItemRole:
    type: string
    enum: [primary, final, supporting]
    description: Exactly one primary item is the lead final result. Additional final items are completed deliverables requested by the user. Supporting items are sources or intermediate files.

  DeliverableStatus:
    type: string
    enum: [ready_for_review, approved, changes_requested, superseded]

  DeliverableOutputItem:
    type: object
    additionalProperties: false
    required: [id, assetVersionId, contentType, sizeBytes, ordinal, role, label, kind, displayName, detail]
    properties:
      id: { type: string, format: uuid }
      assetVersionId: { type: string, format: uuid }
      contentType: { type: string }
      sizeBytes: { type: integer, format: int64, minimum: 0 }
      ordinal: { type: integer, minimum: 0, maximum: 31 }
      role: { $ref: '#/schemas/DeliverableItemRole' }
      label: { type: string }
      kind: { type: string }
      displayName: { type: string }
      detail: { type: string }

  DeliverableOutput:
    type: object
    additionalProperties: false
    required: [id, type, title, summary, items, createdAt]
    properties:
      actorType: {type: string, enum: [user, agent]}
      actorUserId: {type: string, format: uuid}
      actorAgentId: {type: string, format: uuid}
      freshness:
        type: string
        enum: [current, stale, unavailable, unknown, not_applicable]
        description: Current comparison with authorized shared content; never changes delivery or approval.
      liveUrl:
        type: string
        description: Authorized destination for current shared content.

      id: { type: string, format: uuid }
      type: { $ref: '#/schemas/ArtifactType' }
      url: { type: string, format: uri }
      presentationUrl:
        type: string
        description: Relative authenticated URL for this exact immutable Project presentation.
      canvasUrl:
        type: string
        description: Relative authenticated Project canvas URL for this exact saved Output version; omitted when unregistered.
      title: { type: string }
      summary: { type: string }
      submissionNotes: { type: string }
      items:
        type: array
        items: { $ref: '#/schemas/DeliverableOutputItem' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  ArtifactShareLink:
    type: object
    additionalProperties: false
    required: [url]
    properties:
      url: { type: string, format: uri }

  ArtifactPermission:
    type: string
    enum: [view, edit, manage]

  ArtifactGrant:
    type: object
    additionalProperties: false
    required: [userId, displayName, permission, grantedAt]
    properties:
      userId: { type: string, format: uuid }
      displayName: { type: string }
      permission: { $ref: '#/schemas/ArtifactPermission' }
      grantedAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  ArtifactAccess:
    type: object
    additionalProperties: false
    required: [ownerUserId, ownerDisplayName, ownerActive, permission, revision, grants, visibility, conversationGrants]
    properties:
      visibility: { $ref: './artifact-sharing.yaml#/schemas/ArtifactVisibility' }
      publicToken: { type: string, format: uuid }
      conversationGrants:
        type: array
        items: { $ref: './artifact-sharing.yaml#/schemas/ArtifactConversationGrant' }
      ownerUserId:
        description: >-
          The Task's creator; for a Run started by tagging an Agent in a
          channel or group DM, the person who tagged it (the Run's
          authorizer), so the Output starts `private` to them and the Agent's
          creator gets nothing unless they share it; otherwise the direct or
          Schedule Conversation's creator. Null for an Agent-created Task
          until someone claims it. When a Task Run's authorizer is not the
          owner, they hold a `view` grant from the moment the Run presents it.
          A tagged Run's Output presented before this rule keeps the Agent's
          creator as owner.
        oneOf:
          - { type: string, format: uuid }
          - { type: 'null' }
      ownerDisplayName:
        oneOf:
          - { type: string }
          - { type: 'null' }
      ownerActive: { type: boolean }
      permission: { $ref: '#/schemas/ArtifactPermission' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }
      grants:
        type: array
        items: { $ref: '#/schemas/ArtifactGrant' }

  ArtifactSource:
    type: object
    additionalProperties: false
    required: [conversationId, type]
    properties:
      conversationId: { type: string, format: uuid }
      type: { type: string, enum: [task, direct, channel, human_direct, schedule, huddle] }
      taskId: { type: string, format: uuid }
      agentId: { type: string, format: uuid }

  ArtifactDetail:
    type: object
    additionalProperties: false
    required: [runId, result, access, url]
    properties:
      source:
        description: Original conversation, only present when the viewer can read it. Artifact access alone does not grant source access.
        $ref: '#/schemas/ArtifactSource'
      runId: { type: [string, 'null'], format: uuid }
      result: { $ref: '#/schemas/RunResult' }
      access: { $ref: '#/schemas/ArtifactAccess' }
      url: { type: string, format: uri }

  UnownedArtifact:
    type: object
    additionalProperties: false
    required: [id, runId, revision, createdAt]
    properties:
      id: { type: string, format: uuid }
      runId: { type: [string, 'null'], format: uuid }
      taskId: { type: string, format: uuid }
      revision: { $ref: './_common.yaml#/schemas/Revision' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  UnownedArtifactPage:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        items: { $ref: '#/schemas/UnownedArtifact' }

  ArtifactGrantRequest:
    type: object
    additionalProperties: false
    required: [permission, expectedRevision]
    properties:
      permission: { $ref: '#/schemas/ArtifactPermission' }
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }

  TaskRunResult:
    type: object
    additionalProperties: false
    required: [runId, runtimeId, runStatus, output, deliverable, publication]
    properties:
      runId: {"type": ["string", "null"], "format": "uuid"}
      runtimeId:
        type: [string, "null"]
        format: uuid
        description: |
          The runtime the run executed on, for the member who registered it;
