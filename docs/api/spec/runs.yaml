  PublicationUnpublishInput:
    type: object
    additionalProperties: false
    required: [expectedRevision]
    properties:
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }


  ModelDiscoveryStatus:
    type: string
    enum: [pending, running, completed, failed, timeout]

  RuntimeReasoningLevel:
    type: object
    required: [value, label]
    properties:
      value: { type: string, minLength: 1, maxLength: 255 }
      label: { type: string, minLength: 1, maxLength: 255 }
      description: { type: string, maxLength: 1024 }

  RuntimeModelReasoning:
    type: object
    required: [levels]
    properties:
      defaultLevel: { type: string, maxLength: 255 }
      levels:
        type: array
        maxItems: 16
        items: { $ref: '#/schemas/RuntimeReasoningLevel' }

  RuntimeModel:
    type: object
    required: [id, label]
    properties:
      id: { type: string, minLength: 1, maxLength: 255 }
      label: { type: string, minLength: 1, maxLength: 255 }
      default: { type: boolean }
      reasoning: { $ref: '#/schemas/RuntimeModelReasoning' }

  ModelDiscoveryError:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
        enum: [discovery_failed, pending_timeout, running_timeout]
      message: { type: string, minLength: 1, maxLength: 512 }

  ModelDiscoveryRequest:
    type: object
    required: [requestId, runtimeId, status, models, createdAt, updatedAt]
    properties:
      requestId: { type: string, format: uuid }
      runtimeId: { type: string, format: uuid }
      status: { $ref: '#/schemas/ModelDiscoveryStatus' }
      models:
        type: array
        maxItems: 100
        items: { $ref: '#/schemas/RuntimeModel' }
      error: { $ref: '#/schemas/ModelDiscoveryError' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  RunLifecyclePayload:
    type: object
    description: |
      The browser-safe Run lifecycle projection shared by queued, dispatched,
      running, waiting, and terminal realtime events. It deliberately has no
      raw `error`; provider output can therefore never enter the browser
      realtime lane through generic serialization.

      Every nullable field here is **explicitly `null`** when it has no value,
      never absent — the projection is complete on every surface that carries
      it.

      The immutable `revision` is the Task input revision for task Runs and the
      Conversation input revision for direct_chat/schedule Runs. Legacy unknown
      inputs are null. It is not a lifecycle version or a cancellation token;
      lifecycle concurrency uses atomic status transitions.
    required:
      - runType
      - revision
      - source
      - id
      - companyId
      - agentId
      - taskId
      - taskExecutionGeneration
      - conversationId
      - runtimeId
      - provider
      - status
      - attempt
      - maxAttempts
      - parentRunId
      - triggerMessageId
      - failureReason
      - failureMessage
      - failureDetail
      - waitReason
      - transcriptThroughSeq
      - createdAt
      - updatedAt
      - fireAt
    properties:
      runType: {type: string, enum: [task, direct_chat, schedule]}
      revision:
        type: [integer, 'null']
        format: int64
        minimum: 1
        maximum: 9007199254740991
        description: Frozen source revision; retries inherit it. Null when historically unknown.
      source:
        oneOf:
          - {$ref: '#/schemas/RunSource'}
          - {type: 'null'}
      id:
        {"type": "string", "format": "uuid", "description": "Database-generated Run UUID."}
      companyId: { type: string, format: uuid }
      agentId:
        type: string
        format: uuid
        description: |
          The agent executing the run. An id, not an embedded ref — the agent
          roster is a cached collection every client already holds, so the row
          joins client-side against the cache slot the roster filled.
      taskId:
        type: [string, "null"]
        format: uuid
        description: '`null` for a direct-conversation run.'
      taskExecutionGeneration:
        type: [integer, "null"]
        format: int64
        minimum: 1
        maximum: 9007199254740991
        description: |
          The Task execution generation frozen into this Run, or `null` for a
          non-Task Run. Manual workspace acceptance echoes this value so the
          server can reject a review that belongs to an older generation.
      conversationId:
        type: string
        format: uuid
        description: Always present — a run always belongs to a conversation.
      runtimeId:
        type: [string, "null"]
        format: uuid
        description: |
          The runtime the run is placed on, for the member who registered
          that runtime: every Run executes on its authorizer's own binding
          (ADR 0014), and that machine is theirs alone. `null` for every
          other reader, and on every `run.*` realtime frame, which reaches
          more readers than the registrant. The registrant resolves it
          against their own runtimes roster.
      provider:
        type: string
        enum: [claude, codex]
        description: |
          The runtime's provider, carried on the run so a surface can name
          it ("Runs with Codex", "Codex has hit its usage limit") without
          joining the runtimes roster.
      status: { $ref: './_common.yaml#/schemas/RunStatus' }
      attempt:
        type: integer
        format: int32
        example: 1
        description: 1-based. A retry child starts at the parent's attempt + 1.
      maxAttempts:
        type: integer
        format: int32
        example: 3
        description: |
          The ceiling this run may reach, derived from `failureReason`: a
          transient provider stream cut earns three attempts, every other
          retryable reason two, and a run that has not failed reports the
          generic ceiling. A failure the auto-retry path will not act on
          reports the run's own `attempt` as the ceiling, so
          `attempt == maxAttempts` always reads as final and a client never
          waits for a child that is not coming; the ceiling is never below
          `attempt`, so a third attempt earned by two stream cuts reads as
          3 of 3, not 3 of 2. It is computed rather than
          stored — the server has no `max_attempts` column — so a client
          still renders "attempt 2 of 3" from `attempt`/`maxAttempts`
          instead of hard-coding the number.
      parentRunId:
        {"type": ["string", "null"], "format": "uuid", "description": "Set only on a server-created retry child. Whether a failed run got a\nretry is read from the child's linkage, not from a flag on the\nparent.\n"}
      triggerMessageId:
        type: [string, "null"]
        format: uuid
        description: |
          The run's own first `user_message` conversation item — the words this
          run was started on. Still a UUID: conversation items keep uuid
          identity even though runs do not.

          `null` for a run that has no words of its own: a server-created retry
          child (follow `parentRunId` to reach the original) and an assignment
          run.

          The reverse edge is now `Message.runId`, present on **every** item,
          so a client can also reach this from the message side.
      transcriptThroughSeq:
        type: integer
        format: int64
        minimum: 0
        description: |
          PostgreSQL's authoritative durable transcript cursor for this Run —
          the conversation `seq` of the newest item committed to it. Lifecycle
          events carry the same value. A client with a verified complete prefix
          can converge against it, but merely observing the largest seq does
          not prove earlier items arrived. Recover uncertain coverage through
          the owning Conversation's transcript endpoint; filtered numeric gaps
          alone do not indicate loss.
      failureReason:
        type: [string, "null"]
        description: |
          Coarse classifier. **Open set** — the column carries no check
          constraint and new reasons ship without an API change. Match on the
          prefix before the dot and always keep a fallback branch.
      failureMessage:
        type: [string, "null"]
        description: |
          The user-facing sentence for `failureReason`, naming `provider`
          ("Codex has hit its usage limit or run out of credit. Retrying
          will not help until the plan or balance is topped up."), safe to
          render as-is. Present exactly when `failureReason` is, and `null`
          otherwise.

          It exists so a client can explain a failed run from this snapshot
          alone. `failureReason` is a classifier, not copy, and the raw
          provider text is only on the authorized `Run` read — so without
          this every surface would invent its own wording from an enum and
          they would drift.

          Server-owned and not a stable contract: the wording may change to
          read better without an API version bump, and a reason Zenith Team has
          not classified yet resolves to a generic sentence rather than
          nothing. Branch on `failureReason`, display `failureMessage`, then
          `failureDetail`.
      failureDetail:
        type: [string, "null"]
        maxLength: 320
        description: |
          The provider's or daemon's own words for the failure, as one
          bounded, cleaned line: the part a sentence per reason cannot carry
          ("… try again at Sep 22nd, 2026 11:27 AM.", the rejected model
          name, a billing link). Derived from the raw failure text at read
          time — JSON envelopes reduced to their message, whitespace
          collapsed, cut at a word boundary — and the daemon's bounded
          `run.preparation_failed.<phase>` codes replaced by a plain
          sentence for the phase. Present when `failureReason` is and the
          run recorded any text; `null` otherwise. Render it under
          `failureMessage`; never parse it.
      waitReason:
        type: [string, "null"]
        description: |
          `local_directory_busy` while waiting for a local path, or
          `studio_auth_required` while a running Studio command waits for sign-in.
          Host paths remain daemon-local. Cleared on resume and on failure.
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt:
        description: |
          The authoritative mutation clock, and the run's only timestamp
          besides `createdAt`. Every lifecycle write moves it, so for a run in
          a given status it is when the run entered that status: a dispatched
          run's claim time, a terminal run's finish time. Who caused the
          transition, and the ones before this one, are the activity stream's
          to answer — the row carries state, not a history.
        $ref: './_common.yaml#/schemas/Timestamp'
      fireAt:
        description: |
          When a `deferred` run becomes claimable — the backoff deadline of a
          retry child. `null` in every other status.

          This is the answer to "when will it try again". A client that does
          not have it can only poll, because the delay is a per-reason server
          decision.
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      queuedAt:
        type: [string, "null"]
        format: date-time
        description: When the Run entered the claimable queue.
      claimedAt:
        type: [string, "null"]
        format: date-time
        description: When a Runtime claimed the Run.
      startedAt:
        type: [string, "null"]
        format: date-time
        description: When provider execution started.
      finishedAt:
        type: [string, "null"]
        format: date-time
        description: When the Run reached a terminal state.
      durationMs:
        type: [integer, "null"]
        format: int64
        description: "finishedAt - startedAt, when both are known."

  TerminalRunLifecyclePayload:
    allOf:
      - $ref: '#/schemas/RunLifecyclePayload'
      - type: object
        description: |
          A committed terminal Run snapshot. `transcriptThroughSeq` names the
          exact durable transcript prefix at the transition; clients accept
          terminal convergence only when it matches.
        required: [status, transcriptThroughSeq, updatedAt]
        properties:
          status:
            type: string
            enum: [completed, failed, cancelled]
          transcriptThroughSeq:
            type: integer
            format: int64
            minimum: 0
          updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  Run:
    allOf:
      - $ref: '#/schemas/RunLifecyclePayload'
      - type: object
        description: |
          The authorized user-plane REST projection used by the runs surface
          and composed task-workspace responses. It extends the browser-safe
          lifecycle snapshot with raw terminal failure text.
        required: [error]
        properties:
          error:
            type: [string, "null"]
            description: |
              Free-form provider failure text, or the fixed cancellation
              marker: `user_cancelled` when a person cancelled it, or the
              reason the server cancelled it — for example
              `project_access_revoked` when the member the Run works for
              lost `project.read` or `project.tasks.execute` on its Project
              (ADR 0017), or `task_deleted` when a Company Plan apply deleted
              its task. Returned verbatim here, and explicitly `null` when
              the run has none; a Run that failed with a server-side
              `failureReason` such as `no_eligible_resolver` has none. The typed realtime snapshot has no
              `error` field, so this authorized read is the only browser
              surface that can obtain it.
          usageRestricted:
            type: boolean
            description: Whether this viewer lacks permission to read this Run's token and cost counters.
          usage:
            oneOf:
              - $ref: '#/schemas/RunUsageSummary'
              - { type: "null" }
            description: Per-Run token and reported-cost evidence for authorized readers.

  RunUsageSummary:
    type: object
    required: [inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens]
    properties:
      inputTokens: { type: string, pattern: '^[0-9]+$' }
      outputTokens: { type: string, pattern: '^[0-9]+$' }
      cacheReadTokens: { type: string, pattern: '^[0-9]+$' }
      cacheWriteTokens: { type: string, pattern: '^[0-9]+$' }
      costUsdTicks: { type: [string, "null"], pattern: '^[0-9]+$' }

  RunTranscriptEntry:
    type: object
    description: |
      One immutable provider-neutral item in a Conversation's transcript.
      Provider-native envelopes never cross this interface. Every row carries
      `runId` because the Conversation route spans Runs; live
      `run.message_created` payloads add Conversation routing context. The canonical
      `{itemKey, role, parts}` item accepted by the write seam is limited to
      2 MiB (2,097,152 bytes); content is never silently truncated.

      The Run's own `user_message` item is **not** a transcript entry: it
      carries no provider parts and no digest, and it is read from the chat
      surface instead.
    required: [id, runId, seq, itemKey, role, parts, itemDigest, createdAt]
    properties:
      id: { type: string, format: uuid }
      runId:
        {"type": "string", "format": "uuid", "description": "The Run that produced this provider item."}
      seq:
        type: integer
        format: int64
        minimum: 1
        example: 41
        description: |
          The item's position in its **Conversation's** sequence, assigned by
          PostgreSQL under the conversation row lock. Ascending within the
          Run and never reused, but not dense: a user message sent while the
          Run works takes a number in between, so a transcript's `seq` values
          are a subsequence of the conversation's. Ordering and catch-up
          cursor; not a per-Run ordinal and not a global event sequence.
      itemKey:
        type: string
        description: |
          Stable provider item identity within this Run. A replay with the same
          key and normalized content returns the existing row; different content
          conflicts. This is not a generic idempotency key.
        minLength: 1
        maxLength: 512
      role:
        type: string
        description: |
          A display label derived on read from the item's stored type, not a
          round trip of what the daemon sent: the stream stores `type`,
          because type is what decides visibility. `tool_result` items read
          back as `tool` and everything else as `agent`, so a read never
          returns `system` even though the write seam accepts it.
        enum: [agent, tool, system]
      parts:
        type: array
        minItems: 1
        maxItems: 128
        items: { $ref: '#/schemas/RunItemPart' }
      itemDigest:
        type: string
        pattern: '^[0-9a-f]{64}$'
        description: SHA-256 of one canonical normalized item, not a transcript hash chain or proof of earlier-item delivery.
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  RunItemPart:
    oneOf:
      - $ref: '#/schemas/RunTextPart'
      - $ref: '#/schemas/RunReasoningPart'
      - $ref: '#/schemas/RunToolCallPart'
      - $ref: '#/schemas/RunToolResultPart'
      - $ref: '#/schemas/RunErrorPart'

  RunTextPart:
    type: object
    additionalProperties: false
    required: [type, text]
    properties:
      type: { const: text }
      text: { type: string, minLength: 1 }
      final: { type: boolean, description: Explicit provider confirmation that this text is a final answer. }

  RunReasoningPart:
    type: object
    additionalProperties: false
    required: [type, text]
    properties:
      type: { const: reasoning }
      text: { type: string, minLength: 1 }

  RunToolCallPart:
    type: object
    additionalProperties: false
    required: [type, callId, name]
    properties:
      type: { const: toolCall }
      callId: { type: string, minLength: 1, maxLength: 512 }
      name: { type: string, minLength: 1, maxLength: 512 }
      input:
        type: object
        additionalProperties: true

  RunToolResultPart:
    type: object
    additionalProperties: false
    required: [type, callId]
    properties:
      type: { const: toolResult }
      callId: { type: string, minLength: 1, maxLength: 512 }
      name: { type: string, maxLength: 512 }
      output: { type: string }
      status:
        type: string
        enum: [in_progress, completed, failed, declined, cancelled]
      exitCode:
        type: integer
        format: int64
        minimum: 0
      durationMs:
        type: integer
        format: int64
        minimum: 0

  RunErrorPart:
    type: object
    additionalProperties: false
    required: [type, text]
    properties:
      type: { const: error }
      text: { type: string, minLength: 1 }

  Runtime:
    type: object
    description: |
      The user-plane runtime projection: one of the **caller's own**
      machines. Runtimes are created and kept alive over the daemon plane;
      the user-plane writes are the machine rename (`customName`) and the
      registrant's removal (`DELETE`, `POST …/remove`), after which the row
      is gone from every read.

      Every runtime is private to the member who registered it (ADR 0014):
      only the registrant's own authorized Runs execute on it, and only the
      registrant sees, renames, removes or probes it. Another member's
      machine is invisible — absent from the list, `404` by id — whatever
      the caller's company role.

      No general `revision`: the rename is a last-writer-wins set of one
      display field, and the removal moves or drops the caller's own
      bindings. `updatedAt` is the freshness signal, and `lastSeenAt` is the
      liveness one.
    required:
      - id
      - companyId
      - daemonId
      - name
      - customName
      - provider
      - status
      - unusableReason
      - signIn
      - providerVersion
      - cliVersion
      - launchedBy
      - createdAt
      - updatedAt
    properties:
      tools:
        type: array
        items: { $ref: "#/schemas/ToolObservation" }
        description: Sanitized installation and company sign-in observations from the runtime computer.
      id: { type: string, format: uuid }
      companyId: { type: string, format: uuid }
      daemonId:
        type: string
        description: |
          The registering daemon's persistent id. One laptop running both
          providers registers **two** runtimes that share this value, so it is
          the only key that groups a roster by machine. Always present: every
          runtime is registered by a machine, and it is half of the natural
          identity the registration upsert arbitrates on.
      name:
        type: string
        description: |
          The daemon's submitted name; when blank the **server** substitutes
          `provider` or `"<provider> (<deviceName>)"`. Never overwritten by a
          rename — clearing `customName` restores it.
      customName:
        type: [string, "null"]
        description: |
          The name a person gave the machine through
          `PATCH …/runtimes/{runtimeId}`, or `null` when nobody renamed it.
          Sits beside `name` rather than replacing it, so a re-registration
          cannot undo the rename; render `customName ?? name`. Every runtime
          the same daemon registered shares it when the rename applied to
          the machine.
      provider:
        type: string
        description: |
          One of the server's supported providers. Registration accepts the
          value only as an exact, case-sensitive match, and PostgreSQL
          enforces the same closed vocabulary.
        enum: [claude, codex]
      status:
        description: |
          Set by registration, heartbeats, deregistration, and the stale
          sweeper.
        $ref: './_common.yaml#/schemas/RuntimeStatus'
      unusableReason:
        description: |
          Why this machine's provider CLI cannot run work — below the minimum
          version, or not executable — or `null` for an ordinary row. Present
          only while `status` is `offline` (the constraint is structural: a
          heartbeat cannot bring an unusable runtime online), and cleared by
          the daemon's next registration once the CLI is fixed. This is the
          difference the roster draws between "machine off" and "machine on,
          CLI broken": the recovery is on that machine, not a wake-up.
        oneOf:
          - { $ref: './_common.yaml#/schemas/RuntimeUnusableReason' }
          - { type: "null" }
      signIn:
        description: |
          Whether the provider CLI on this machine is signed in, as the daemon
          last checked it, or `null` when no registration has carried a
          verdict yet (a daemon older than the probe). Rosters and pickers
          show it beside the version so a person does not start a run on a
          signed-out provider; `POST …/refresh` asks the daemon to look again.
        oneOf:
          - { $ref: './_common.yaml#/schemas/RuntimeSignIn' }
          - { type: "null" }
      owner:
        description: |
          The member whose machine this is, resolved from the registering
          principal — always the caller on a served row. `null` when the
          registration carried no user.
        oneOf:
          - { $ref: './_common.yaml#/schemas/ActorRef' }
          - { type: "null" }
      deviceInfo:
        type: string
        description: |
          The daemon's self-reported device string, verbatim and unparsed. A
          display label, not a structure.
      providerVersion:
        type: string
        description: |
          The provider CLI version the daemon probed at registration (for
          example the `claude` or `codex` binary's version). Empty when the
          daemon reported none — a row registered before versions were
          announced, or a probe that found no version string.
      cliVersion:
        type: string
        description: |
          The `zen` CLI/daemon version that registered the runtime. Empty
          when the daemon reported none.
      launchedBy:
        type: string
        description: |
          `desktop` when the desktop app spawned the daemon, `cli` for a
          daemon started from a terminal. The daemon announces only the
          desktop case; the server names everything else `cli`, so a client
          never branches on an empty string.
        enum: [desktop, cli]
      lastSeenAt:
        description: |
          Last heartbeat. Nullable in the schema, but every write path stamps
          it, so it is present on every row a client can see. A runtime is
          swept to `offline` once this falls behind the stale threshold.
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }

  RuntimeAccess:
    type: object
    description: |
      The viewer's server-derived standing on an Agent through their own
      binding, so a client never reconstructs permission from a role.
      `execute` is true when the viewer has set the Agent up on one of
      their runtimes and that runtime is online, usable and signed in
      (ADR 0014) — the same fact the Agent's `runtimeAvailable` carries.
    required: [execute]
    properties:
      execute: { type: boolean }

  RuntimeRenameRequest:
    type: object
    additionalProperties: false
    description: |
      The machine rename. `customName` is always sent: the server trims it,
      and the empty string clears the custom name (there is no `null` — a
      client that means "clear" says so with `""`). `applyToMachine` renames
      every runtime the same daemon registered in the company; omitted or
      `false` renames the one row the path names.
    required: [customName]
    properties:
      customName:
        type: string
        maxLength: 100
        description: Trimmed by the server; at most 100 characters; `""` clears.
      applyToMachine:
        type: boolean
        default: false
        description: Rename every runtime of the same machine, not only this row.

  RuntimeRemovalInput:
    type: object
    additionalProperties: false
    description: |
      Where the caller's bindings on the removed runtime go.
      `targetRuntimeId` names another runtime the caller registered, of the
      same provider; `null` drops the bindings and cancels the caller's
      queued Runs on the machine. The runtime being removed is refused with
      `422 validation_failed`.
    required: [targetRuntimeId]
    properties:
      targetRuntimeId:
        type: [string, "null"]
        format: uuid
        description: The runtime the caller's bindings move to, or `null` to drop them.

  RuntimeRemoval:
    type: object
    description: |
      The removal receipt: what was removed, how many of the caller's
      bindings moved, how many queued and deferred Runs followed them, and
      how many were cancelled because the bindings were dropped. Not a
      projection — the row is gone from every read.
    required: [removedRuntimeId, movedBindingCount, retargetedRunCount, cancelledRunCount]
    properties:
      removedRuntimeId: { type: string, format: uuid }
      movedBindingCount:
        type: integer
        format: int64
        minimum: 0
        description: The caller's bindings now on the target.
      retargetedRunCount:
        type: integer
        format: int64
        minimum: 0
        description: Queued and deferred Runs now waiting on the target.
      cancelledRunCount:
        type: integer
        format: int64
        minimum: 0
        description: Queued and deferred Runs cancelled because no target was named.

  PublicationSubdomainInput:
    type: object
    additionalProperties: false
    required: [subdomain, expectedRevision]
    properties:
      subdomain:
        type: string
        minLength: 2
        maxLength: 63
        description: A DNS label under the configured base domain. Normalized to lowercase; reserved names and consecutive hyphens are rejected. A claimed name cannot be changed.
      expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }

  PublicationSubdomainOptions:
    type: object
    additionalProperties: false
    required: [baseDomain, canSet]
    properties:
      baseDomain: { type: string }
      canSet: { type: boolean }

  RunSource:
    type: object
    additionalProperties: false
    required: [id, type, key, title]
    properties:
      id: {type: string, format: uuid}
      type: {type: string, enum: [task, conversation]}
      key: {type: [string, 'null']}
      title: {type: [string, 'null']}
    description: Immutable enqueue-time source identity and labels, retained after deletion.

  ToolObservation:
    description: Shared tool installation or one Agent authentication profile on this runtime. Unscoped rows carry no authenticated state. Select auth by tool key and agentId.
    type: object
    additionalProperties: false
    required: [key, version, state, authState, reasonCode, observedAt]
    properties:
      agentId: { type: string, format: uuid }
      apiOrigin: { type: string, format: uri }
      key: { type: string, enum: [zenith-studio, hyperframes] }
      version: { type: string, maxLength: 128, pattern: '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$' }
      state: { type: string, enum: [pending, installing, installed, error] }
      authState: { type: string, enum: [unknown, needs_auth, authenticated, connecting, error, not_required] }
      reasonCode: { type: string, enum: ["", setup_failed, prerequisites_missing] }
      observedAt: { type: string, format: date-time }
