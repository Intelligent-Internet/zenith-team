        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runs/{runId}/result/studio-canvas
  companies_companyId_runs_runId_result_studio_canvas:
    post:
      tags: [runs, deliverables]
      operationId: attachRunStudioCanvas
      summary: Add a missing Studio source snapshot to an existing result
      description: >-
        Company owners with access to the Run may add a source snapshot once.
        This supplements provenance without changing the frozen output or review
        items. Identical retries return the existing snapshot; replacement or a
        result already containing a Studio source artifact returns conflict.
      parameters:
        - { $ref: './_common.yaml#/parameters/companyId' }
        - { $ref: './_common.yaml#/parameters/runId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [canvas]
              properties:
                canvas: { $ref: '#/schemas/StudioCanvas' }
      responses:
        '200':
          description: Saved source snapshot
          content:
