# Authored domain section of the Zenith Team API contract.
# docs/api/spec/openapi.yaml is the index
# that references it, and docs/api/runs.md is its prose counterpart.

paths:

  companies_companyId_runs_runId_agent_artifacts_artifactId:
    get:
      tags: [runs, deliverables]
      operationId: inspectArtifactForRun
      summary: Inspect immutable Artifact evidence for a live Run
      description: Requires the Run Authorizer's session and live Run proof. Checks current Artifact access for the Run's Authorizer. Every Run, a Task Run's included, reads exactly the Artifacts its Authorizer reads, and no chat audience narrows it (D31). An Artifact the Authorizer cannot read is 404. The artifact ID pins its immutable output items and Asset Versions; no source workspace path is exposed.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - $ref: '#/parameters/artifactId'
        - name: X-Boardly-Run-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The exact saved Output and its file items or document destination.
          content:
            application/json:
              schema: { $ref: '#/schemas/DeliverableOutput' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
  companies_companyId_runs_runId_agent_artifacts_artifactId_items_ordinal_download:
    get:
      tags: [runs, deliverables]
      operationId: downloadArtifactForRun
      summary: Download a pinned Artifact file for a live consuming Run
      description: Requires the Run Authorizer's session and live Run proof, rechecked before streaming bytes. Checks current Artifact access for the Run's Authorizer. Every Run, a Task Run's included, reads exactly the Artifacts its Authorizer reads, and no chat audience narrows it (D31). An Artifact the Authorizer cannot read is 404. The runId identifies the consuming Run, not the Run that produced the Artifact. Does not redirect to storage.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - $ref: '#/parameters/artifactId'
        - name: ordinal
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 31 }
        - name: X-Boardly-Run-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorized immutable file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }

  companies_companyId_artifacts_unowned:
    get:
      tags: [deliverables]
      operationId: listUnownedArtifacts
      summary: List minimal identifiers for Artifacts needing owner recovery
      description: Requires the Company results.review permission. Contents remain inaccessible until claimed.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: Up to 200 unowned or inactive-owner Artifacts.
          content:
            application/json:
              schema: { $ref: '#/schemas/UnownedArtifactPage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }

  companies_companyId_artifacts_artifactId_claim:
    post:
      tags: [deliverables]
      operationId: claimUnownedArtifact
      summary: Claim an Artifact whose owner is missing or inactive
      description: Requires results.review and records the caller as the new owner.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/artifactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      responses:
        '200':
          description: Claimed Artifact.
          content:
            application/json:
              schema: { $ref: '#/schemas/ArtifactDetail' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '409':
          description: Artifact is already owned or its access revision changed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

  companies_companyId_artifacts:
    get:
      tags: [deliverables]
      operationId: listArtifacts
      summary: List every Artifact the caller can open in the Company
      description: |
        Newest first; used by chat attachments and Company Wiki citations. Each Artifact
        appears only for the people who can already read it (owner, grants,
        shared Conversations, `company` visibility), so the list reveals
        nothing that could not be opened one by one. `search` matches the
        title, case-insensitively.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: ownership
          in: query
          schema: { type: string, enum: [owned, shared] }
        - name: source
          in: query
          schema: { type: string, enum: [channel, direct, task, schedule] }
        - $ref: './_common.yaml#/parameters/limit'
        - $ref: './_common.yaml#/parameters/cursor'
      responses:
        '200':
          description: A page of Artifacts the caller can open.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationArtifactPage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  companies_companyId_artifacts_resolve:
    get:
      tags: [deliverables]
      operationId: resolveArtifacts
      summary: Resolve Artifact ids for the caller
      description: |
        Returns the named Artifacts the caller can open now, newest first.
        An id that is missing, deleted or not visible to the caller is simply
        absent, so the three cases cannot be told apart. Company Wiki readers
        resolve `[[artifact:<id>]]` citations through this; an absent id
        renders as an unavailable citation. Repeated ids are read once.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The requested Artifacts the caller can open.
          content:
            application/json:
              schema: { $ref: '#/schemas/ResolvedArtifacts' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  companies_companyId_artifacts_artifactId:
    get:
      tags: [deliverables]
      operationId: getArtifact
      summary: Read one Artifact under its current per-person permission
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/artifactId'
      responses:
        '200':
          description: Authorized Artifact and access roster.
          content:
            application/json:
              schema: { $ref: '#/schemas/ArtifactDetail' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }

  companies_companyId_artifacts_artifactId_grants_userId:
    put:
      tags: [deliverables]
      operationId: putArtifactGrant
      summary: Grant or change a person's Artifact permission
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/artifactId'
        - $ref: '#/parameters/granteeUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/ArtifactGrantRequest' }
      responses:
        '200':
          description: Updated access roster.
          content:
            application/json:
              schema: { $ref: '#/schemas/ArtifactAccess' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: Access revision changed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    delete:
      tags: [deliverables]
      operationId: deleteArtifactGrant
      summary: Revoke a person's Artifact permission
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/artifactId'
        - $ref: '#/parameters/granteeUserId'
        - name: expectedRevision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Updated access roster.
          content:
            application/json:
              schema: { $ref: '#/schemas/ArtifactAccess' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }
        '409':
          description: Access revision changed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

  companies_companyId_artifacts_artifactId_items_ordinal_download:
    get:
      tags: [deliverables]
      operationId: downloadArtifactFile
      summary: Stream an authorized Artifact file through Zenith Team
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/artifactId'
        - name: ordinal
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 31 }
        - name: X-Boardly-Artifact-Cache
          in: header
          description: Opt into desktop disk-cache revalidation after current artifact authorization.
          schema: { type: string, enum: [revalidate] }
        - name: If-None-Match
          in: header
          description: Exact ETag from a prior authorized download; only used with the desktop cache opt-in header.
          schema: { type: string }
      responses:
        '200':
          description: Private file bytes; never a storage redirect.
          headers:
            ETag:
              description: Immutable attachment identity and revision, present for opted-in desktop downloads.
              schema: { type: string }
            Cache-Control:
              description: Private no-cache for desktop revalidation; private no-store otherwise.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304':
          description: The caller still has access and the ready attachment matches the supplied ETag. No file bytes or storage read.
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ['private, no-cache'] }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404': { $ref: './_common.yaml#/responses/NotFound' }

  # ===================================================================== runs

  # /api/v1/companies/{companyId}/runs
  companies_companyId_runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: List the company's runs
      description: |
        Newest first (`createdAt DESC, id DESC`), paged by the standard opaque
        cursor. The next page seeks strictly before the prior boundary:
        `(created_at, id) < (cursor_created_at, cursor_id)`. The id tie-breaker
        prevents equal timestamps from skipping or duplicating runs.

        Every filter below exists because a shipped client emulated it by
        fetching the company's runs and filtering in JavaScript — one screen per
        filter. `active=true` is the one-parameter form of the non-terminal
        status set, so a "what is running right now" panel does not have to
        enumerate the vocabulary and re-enumerate it when a status is added.

        `status` takes a **comma-separated list**, not a repeated parameter: a
        repeated query parameter is `422` API-wide, so the multi-status filter
        has to travel in one value.

        Task-conversation runs are visible to every company member. Direct-
        conversation runs are visible only to the conversation creator.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/limit'
        - $ref: './_common.yaml#/parameters/cursor'
        - name: status
          in: query
          required: false
          description: |
            Comma-separated run statuses. An unrecognized value is `422` and the
            message lists the allowed set.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: './_common.yaml#/schemas/RunStatus' }
        - name: active
          in: query
          required: false
          description: |
            `true` restricts to the non-terminal statuses — `queued`,
            `deferred`, `dispatched`, `waiting_local_directory`, `running`.
            Mutually exclusive with `status`; sending both is `422`.
          schema: { type: boolean }
        - name: task_id
          in: query
          required: false
          description: Runs serving one task.
          schema: { type: string, format: uuid }
        - name: conversation_id
          in: query
          required: false
          description: Runs in one conversation.
          schema: { type: string, format: uuid }
        - name: agent_id
          in: query
          required: false
          description: Runs executed by one agent.
          schema: { type: string, format: uuid }
        - name: runtime_id
          in: query
          required: false
          description: |
            Runs dispatched to one runtime — "what is this machine working on",
            which the runtimes roster links straight into. Only the caller's
            own runtimes match: another member's runtime returns no runs,
            because a machine is its registrant's alone (ADR 0014).
          schema: { type: string, format: uuid }
        - name: run_type
          in: query
          schema: {type: string, enum: [task, direct_chat, schedule]}
        - name: revision
          in: query
          description: Frozen input revision. Requires a task_id or conversation_id source scope; the two may be combined and AND together like every other filter.
          schema: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
        - name: from
          in: query
          description: Inclusive creation time.
          schema: {type: string, format: date-time}
        - name: to
          in: query
          description: Exclusive creation time; greater than from when both are supplied.
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: A page of runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/Run' }
                  nextCursor:
                    type: [string, "null"]
                    description: '`null` on the last page.'
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runs/{runId}
  companies_companyId_runs_runId:
    get:
      tags: [runs]
      operationId: getRun
      summary: Read one run
      description: |
        The run row minus its internal columns: the context document, the
        prepare lease, `sessionId`, `sessionRolloutMissing`,
        `retiredSessionId`, and `forceFreshSession` are daemon-plane concerns
        and are not projected here.

        This read is the **only** way to obtain a run's `error` text — it is
        structurally absent from the typed realtime lifecycle snapshot.

        A direct-conversation run is visible only to its creator.

        A Run reads its own record here with its proof (`zen run get`), a
        Run tagged in a channel or group DM included. With
        `X-Boardly-Run-Token` the path must name the token's own Run
        (`403 task_outside_run_scope`).
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - $ref: './_common.yaml#/parameters/runTokenOwnRead'
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/schemas/Run' }
        '401': { $ref: './_common.yaml#/responses/UnauthorizedRunProof' }
        '403': { $ref: './_common.yaml#/responses/RunOwnReadOutsideScope' }
        '404':
          description: |
            `404 run_not_found` or `company_not_found`. A malformed `runId`
            lands here too — a path id that cannot name a row is
            indistinguishable from one that names nothing.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runs/{runId}/cancel
  companies_companyId_runs_runId_cancel:
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel a run
      description: |
        The database transition is immediate. Stopping an already-running
        provider process is cooperative, but the returned row is already
        `cancelled` and `run.cancelled` is published after commit.

        **Guarded on state, not on `revision`.** The `runs` table carries no
        version column, so there is nothing for an `expectedRevision` to
        compare against. Cancellation is idempotent: a terminal run is returned
        unchanged.

        A task-conversation run is visible to the readers of its Project
        (ADR 0017), and cancelling it stops work there, so the caller needs
        `project.tasks.execute` on that Project (`403
        project_permission_required`); someone who cannot read the Project
        gets `404 run_not_found`. A direct-conversation run is
        creator-private, exactly like list and get; its provider items
        inherit the owning Conversation's visibility.

        **Only the run's authorizer or a `tasks.assign` holder may cancel
        it.** Stopping a run acts on the computer it runs on, its
        authorizer's own (ADR 0014); any other member who can read it gets
        `403 company_permission_required` and nothing changes.

        **A cancellation transition never produces a retry.** An
        already-terminal run is returned unchanged; whether a failed run
        already earned a retry child is read from that child's `parentRunId`
        linkage, not from a flag on the parent.

        Cancelling a Run does not cancel its Task. The Task keeps its current
        workflow state and Conversation, so a later message starts a fresh Run
        in the same retained Task workspace. Task cancellation is a separate
        Task mutation.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
      responses:
        '200':
          description: The authoritative run projection after the idempotent action.
          content:
            application/json:
              schema: { $ref: '#/schemas/Run' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 csrf_invalid` — cookie callers only — `403 project_permission_required` — a reader of a task run''s Project without `project.tasks.execute` (ADR 0017) — or `403 company_permission_required`: the caller neither authorized the run nor holds `tasks.assign`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 run_not_found` or `company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runtimes
  companies_companyId_runtimes:
    get:
      tags: [runtimes]
      operationId: listRuntimes
      summary: List the caller's runtimes
      description: |
        Registration and liveness happen over the daemon plane; the user
        plane writes two things — the machine rename
        (`PATCH …/runtimes/{runtimeId}`) and the registrant's removal
        (`DELETE …/runtimes/{runtimeId}`, `POST …/runtimes/{runtimeId}/remove`).
        A runtime exists because a daemon registered it, goes offline when
        that daemon deregisters or is swept, and leaves this list when the
        registrant removes it or the garbage collector drops it.

        Every runtime is private to the member who registered it
        (ADR 0014), so the roster is the caller's own machines — whatever
        their company role: an owner or admin sees no more than that.
        Another member's machine is absent — not present with a flag — so
        counts, pickers and searches built from this list never disclose
        it. An empty list means the caller has no computer registered here,
        not that the company has none.

        Ordered `createdAt ASC, id ASC` — the roster is a stable list of
        machines, not a feed, so a new registration appends rather than
        reshuffling the rows above it. All matching runtimes are returned in
        one response; `status` and `provider` are filters, not pagination
        controls.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: status
          in: query
          required: false
          description: Filter by liveness.
          schema: { $ref: './_common.yaml#/schemas/RuntimeStatus' }
        - name: provider
          in: query
          required: false
          description: |
            Filter to one provider. An agent can only bind to a runtime of its
            own provider, so the picker would otherwise read the whole roster
            and discard most of it.
          schema: { type: string }
      responses:
        '200':
          description: All matching runtimes, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/Runtime' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runtimes/{runtimeId}
  companies_companyId_runtimes_runtimeId:
    get:
      tags: [runtimes]
      operationId: getRuntime
      summary: Read one runtime
      description: |
        One roster row by id, the same projection the list serves. Only the
        member who registered the runtime may read it; another member's
        machine is `404 runtime_not_found` for every role, exactly like an
        unknown id (ADR 0014).

        The agents the caller runs on the machine are
        `GET /agent-bindings?runtime_id=` and the work on it is
        `GET /runs?runtime_id=&active=true`; the detail read does not embed
        either, so the three reads stay one request each and cache
        independently.

        An unknown id, another company's id, a malformed id, and another
        member's runtime are all `404 runtime_not_found`: the answer never
        says whether the id exists elsewhere.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runtimeId'
      responses:
        '200':
          description: The runtime.
          content:
            application/json:
              schema: { $ref: '#/schemas/Runtime' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
    patch:
      tags: [runtimes]
      operationId: renameRuntime
      summary: Rename a machine
      description: |
        The one user-plane write on a runtime. Sets or clears the name a
        person gives the machine; the daemon's own `name` is never touched,
        so clearing the custom name restores it. With `applyToMachine: true`
        the name lands on every runtime the same daemon registered in this
        company — both provider rows of one laptop — which is what "rename a
        machine" means; `false` (the default) renames the one row the path
        names.

        Gate: the member whose machine it is, judged inside the write
        transaction against the stored registration. Another member's
        runtime is invisible to every role and answers
        `404 runtime_not_found` (ADR 0014).

        No `revision`, deliberately: the row has no version column and the
        write is a last-writer-wins set of one display field. Two people
        renaming the same machine at once end with whichever committed last,
        which is the right outcome for a label.

        After the commit the registrant receives `daemon.roster_changed`
        with `action: update`, naming the machine and the runtimes it
        touched, and refetches the roster.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runtimeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/RuntimeRenameRequest' }
      responses:
        '200':
          description: The renamed runtime — the same projection the read serves.
          content:
            application/json:
              schema: { $ref: '#/schemas/Runtime' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found` — unknown, foreign, malformed, removed, or another member''s runtime (invisible to the caller, ADR 0014).'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
    delete:
      tags: [runtimes]
      operationId: deleteRuntime
      summary: Remove a runtime, dropping the caller's bindings on it
      description: |
        The registrant's removal (ADR 0014) with no target: the row leaves
        the roster and every other runtime read, its run history stays
        readable, every binding the caller holds on it is deleted, and the
        caller's queued and deferred Runs on it are cancelled
        (`run.cancelled`, reason `runtime_removed`). No request body.
        `POST …/runtimes/{runtimeId}/remove` is the same removal with the
        bindings moved to another of the caller's runtimes instead.

        Refused with `409 runtime_remove_blocked` while the runtime is
        online: its daemon would register the row again moments later. The
        detail tells the person to quit Zenith Team on that computer, or
        stop its zen daemon, then try again.

        Soft, not a row delete: `runs.runtime_id` points at the row and run
        history outlives the machine. The row is stamped `removed_at`,
        hidden from the list, the detail read, the heartbeat and the claim
        path, and revived by the same machine registering the same runtime
        again — a restart is the user's intent, not a bug.

        After the commit the registrant receives `daemon.roster_changed`
        with `action: remove`, naming the machine and the row, and one
        `agent.binding_changed` (`binding: null`) per dropped binding.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runtimeId'
      responses:
        '204':
          description: Removed. No body.
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found` (unknown, another company''s, malformed, already removed, or another member''s runtime — invisible to the caller, ADR 0014).'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 runtime_remove_blocked` — the runtime is online.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runtimes/{runtimeId}/remove
  companies_companyId_runtimes_runtimeId_remove:
    post:
      tags: [runtimes]
      operationId: removeRuntime
      summary: Remove a runtime, moving the caller's bindings to another
      description: |
        The registrant's removal (ADR 0014) with the caller's bindings on
        the machine moved to `targetRuntimeId` — another runtime the caller
        registered, of the same provider, online or not — or dropped when
        `targetRuntimeId` is `null` (then it is exactly the `DELETE`).

        Checked inside one transaction under the runtime rows: the runtime
        must be offline (`409 runtime_remove_blocked`, "Quit Zenith Team on
        that computer first, or stop its zen daemon, then try again"); the
        target must be another live runtime the
        caller registered (`404 runtime_not_found`) of the same provider
        (`422 agent_binding_provider_mismatch`). Then every binding the
        caller holds on the runtime moves to the target, the caller's queued
        and deferred Runs follow, and the runtime is stamped removed exactly
        as the `DELETE` describes; Runs a daemon already claimed stay on
        the offline runtime for the sweepers.

        After the commit the registrant receives one `agent.binding_changed`
        per moved binding, then `daemon.roster_changed` with
        `action: remove`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runtimeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/RuntimeRemovalInput' }
      responses:
        '200':
          description: The removal receipt.
          content:
            application/json:
              schema: { $ref: '#/schemas/RuntimeRemoval' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found` — the runtime or the target is unknown, another company''s, malformed, already removed, or another member''s runtime (invisible to the caller, ADR 0014).'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 runtime_remove_blocked` — the runtime is online.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: '`422 validation_failed` — `targetRuntimeId` is missing, not a runtime id or `null`, or names the runtime being removed, and the detail says which; or `422 agent_binding_provider_mismatch` — the target runs another provider.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runtimes/{runtimeId}/models
  companies_companyId_runtimes_runtimeId_models:
    post:
      tags: [runtimes]
      operationId: discoverRuntimeModels
      summary: Discover one runtime's model catalog
      description: |
        The runtime's registrant (ADR 0014). Enqueues discovery against the exact online runtime named by
        the path and always answers `202`, including when it coalesces with the
        runtime's existing pending or running request. The daemon receives the
        work on its next heartbeat; `daemon.pending_work` only asks it to send
        that heartbeat sooner.

        The request is transient coordination state, retained for two minutes
        after it becomes terminal. Clients poll the returned request id with
        the companion GET. Zenith Team stores no model-discovery request in
        PostgreSQL.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: runtimeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Enqueued, or coalesced with the active request.
          content:
            application/json:
              schema: { $ref: '#/schemas/ModelDiscoveryRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found` — including another member''s runtime, invisible to the caller (ADR 0014).'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 runtime_offline`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/runtimes/{runtimeId}/refresh
  companies_companyId_runtimes_runtimeId_refresh:
    post:
      tags: [runtimes]
      operationId: refreshRuntime
      summary: Ask a machine to check its provider setup again
      description: |
        Asks the daemon behind the exact online runtime named by the path to
        probe every provider CLI on that machine again — path, version,
        sign-in state — and register what it finds. The answer is not
        awaited: the daemon's fresh registration is the result, served on
        the `Runtime` rows and announced by `daemon.roster_changed`, so a
        client that refetches the roster on that event needs nothing else.
        The hint rides the daemon's realtime socket and is safe to lose or
        repeat; a runtime that is offline has no daemon to hear it and is
        refused with `409 runtime_offline`.

        It makes a machine do work, so the gate is the machine's, not a
        role's (ADR 0014): only its registrant may ask. Another member's
        machine is invisible to the caller and answers
        `404 runtime_not_found`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: runtimeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: The daemon was asked; watch the roster.
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found` or `runtime_not_found` — including another member''s runtime, invisible to the caller (ADR 0014).'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 runtime_offline`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  # /api/v1/companies/{companyId}/runtimes/{runtimeId}/models/{requestId}
  companies_companyId_runtimes_runtimeId_models_requestId:
    get:
      tags: [runtimes]
      operationId: getRuntimeModelDiscovery
      summary: Read a runtime model-discovery request
      description: |
        The runtime's registrant (ADR 0014). `pending` becomes `timeout` after 30 seconds without a
        daemon claim; `running` becomes `timeout` after 60 seconds without a
        terminal report. A request id is visible only through the exact company
        and runtime path that created it.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: runtimeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current request lifecycle and any terminal result.
          content:
            application/json:
              schema: { $ref: '#/schemas/ModelDiscoveryRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: |
            `404 company_not_found`, `runtime_not_found`, or
            `model_discovery_not_found`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/runs/{runId}/output
  runs_runId_output:
    post:
      tags: [runs]
      operationId: presentRunOutput
      summary: Save an Artifact produced by a running Run
      description: |
        Run-bound MCP callers use their normal user authentication plus the
        injected Run proof. `Idempotency-Key` is a UUID. An exact presentation
        replay returns its existing Artifact; a distinct presentation while the
        Run is running creates another immutable, independently reviewable
        Artifact. For `type: app`, the local MCP backend supplies normalized
        development commands and no file items. The server stores that command
        payload without exposing a local HTTP loopback URL. Local app preview
        controls are unavailable until an access-checked gateway is added.
        Active Company membership and the exact Run proof are required. Terminal
        Runs accept exact replays but reject new presentations.
      parameters:
        - $ref: './_common.yaml#/parameters/runId'
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Boardly-Run-Token
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/PresentRunOutputRequest' }
      responses:
        '200':
          description: An exact replay of an Artifact already saved by the Run.
          content:
            application/json:
              schema: { $ref: '#/schemas/PresentRunOutputResponse' }
        '201':
          description: A new Artifact was saved as another Output of the Run.
          content:
            application/json:
              schema: { $ref: '#/schemas/PresentRunOutputResponse' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '404':
          description: '`404 not_found` — including a malformed or unavailable Run.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 conflict` — the Run is terminal and this is not an exact replay.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: '`422 validation_failed` or `target_unavailable` for an invalid Artifact.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }


  # /api/v1/companies/{companyId}/conversations/{conversationId}/artifacts
  companies_companyId_conversations_conversationId_artifacts:
    get:
      tags: [runs, conversations]
      operationId: listConversationArtifacts
      summary: List the Artifacts saved in one Conversation
      description: |
        Returns app, media, text, and file Artifacts newest first for the
        right-side Conversation canvas. A Task Conversation is visible to the
        readers of its Project (ADR 0017); direct and Schedule Conversations
        remain creator-private. Channels and human direct discussions require
        active conversation membership and include Artifacts from tagged Agent
        Runs, conversation shares, and non-deleted message links across all
        threads. Multiple references to an Artifact produce one entry. This
        listing does not grant access to private Agent output. Each Artifact
        is listed only for the people who can read it: its owner, the people
        and Conversations it is shared with, and, for a Task Run, the member
        who ran it (the Run's authorizer), who holds a `view` grant.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: query
          required: false
          description: Restrict results to one Run without changing Conversation or Artifact access checks.
          schema: { type: string, format: uuid }
        - $ref: './_common.yaml#/parameters/limit'
        - $ref: './_common.yaml#/parameters/cursor'
      responses:
        '200':
          description: A page of saved Artifacts.
          content:
            application/json:
              schema: { $ref: '#/schemas/ConversationArtifactPage' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 not_found` — including an inaccessible or malformed Conversation.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }
  # /api/v1/companies/{companyId}/runs/{runId}/result
  companies_companyId_runs_runId_result:
    get:
      tags: [runs, deliverables]
      operationId: getRunResult
      summary: Read one Artifact presented by a Run
      description: |
        When `artifactId` is present, returns that exact Output and its
        Deliverable. Without it, returns the newest Output as a compatibility
        default.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/runId'
        - name: artifactId
