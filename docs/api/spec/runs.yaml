  TaskResultPage:
    type: object
    additionalProperties: false
    required: [items, sources, nextCursor, selection]
    properties:
      selection: { $ref: './tasks.yaml#/schemas/TaskResultSelection' }
      items:
        type: array
        maxItems: 50
        items: { $ref: '#/schemas/TaskRunResult' }
      sources:
        type: array
        maxItems: 50
        items: { $ref: '#/schemas/TaskResultSource' }
      nextCursor:
        type: [string, 'null']
        description: Opaque continuation tracking both feeds; null when both are exhausted.

  Deliverable:
    type: object
    additionalProperties: false
    required: [id, runId, status, output, submittedAt, revision]
    properties:
      id: { type: string, format: uuid }
      runId: {"type": ["string", "null"], "format": "uuid"}
      status: { $ref: '#/schemas/DeliverableStatus' }
      output: { $ref: '#/schemas/DeliverableOutput' }
      submittedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      reviewedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
