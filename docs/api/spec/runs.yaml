      publication:
        oneOf:
          - { $ref: '#/schemas/OutputPublication' }
          - { type: 'null' }

  ArtifactLibraryMetadata:
    type: object
    additionalProperties: false
    required: [ownerName, owned, canShare, source]
    description: Present on Company list and resolve results. Source details require separate source access.
    properties:
      ownerName: { type: string }
      owned: { type: boolean }
      canShare: { type: boolean }
      source:
        type: object
        additionalProperties: false
        required: [type, title, detail]
        properties:
          type: { type: string, enum: [channel, direct, task, schedule, restricted] }
          title: { type: string }
          detail: { type: string }

  ArtifactRunResult:
    type: object
    additionalProperties: false
    required: [runId, runtimeId, runStatus, artifact, deliverable, publication]
    properties:
      library:
        $ref: '#/schemas/ArtifactLibraryMetadata'
      runId: { type: [string, 'null'], format: uuid }
      runtimeId:
        type: [string, "null"]
        format: uuid
        description: |
          The runtime the run executed on, for the member who registered it;
          `null` for every other reader (ADR 0014).
      runStatus: { type: string }
      artifact: { $ref: '#/schemas/DeliverableOutput' }
      deliverable:
        oneOf:
          - { $ref: '#/schemas/Deliverable' }
          - { type: 'null' }
      publication:
        oneOf:
          - { $ref: '#/schemas/OutputPublication' }
