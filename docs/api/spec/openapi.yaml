openapi: 3.1.0
info:
  title: Zenith Team API
  version: "1.0.0"
  summary: The Zenith Team HTTP surface — companies, agents, work, conversations, runs.
  description: |
    Machine-readable source of truth for the Zenith Team server. The prose guides in
    this directory explain intent; this document pins the wire contract. When the
    two disagree, this document is right.

    ## Layout

    This file is an **index**. It carries the document metadata, the security
    schemes, and one `$ref` per path into a domain file beside it, named to
    match its prose counterpart — `spec/companies.yaml` alongside
    `../companies.md`. Each domain file holds that domain's path items and the
    schemas only it uses; `_common.yaml` holds the reusable parameters, the
    standard error responses, and every schema more than one domain shares.

    Edit the domain files. `make api-bundle` flattens the whole thing into one
    document for consumers that want a single file.

    ## Conventions

    These are stated once in `conventions.md` and are not repeated per
    operation. An operation only documents where it *deviates*.

    - Every JSON field the server serializes is camelCase. Query parameters are
      snake_case.
    - Timestamps are RFC3339, nanosecond precision, always UTC.
    - Calendar days are date-only `YYYY-MM-DD`, never an instant.
    - Bounded entity collections return their complete matching set and do not
      accept `limit` or `cursor`. High-volume chronological feeds use seek
      pagination and return `{items, nextCursor}`.
    - A feed cursor is opaque and carries the `(createdAt, id)` sort tuple.
      Newest-first feeds seek strictly before that tuple; oldest-first feeds
      seek strictly after it. A malformed cursor is `422 invalid_cursor`.
    - Messages and Conversation transcripts use their monotonic `seq` instead
      of a timestamp cursor: `after_seq` reads rows with `seq > after_seq`.
      The source Conversation sequence is gap-free, allocated as `max(seq) +
      1` over committed rows under its row lock; each filtered read may skip
      positions owned by item types it does not return.
    - Mutable resources carry `revision` (int64); mutations that must not
      clobber a concurrent edit take `expectedRevision` and answer `409`.
    - A mutation returns the authoritative new projection, so a confirming
      `GET` after a 2xx is unnecessary. Create and update events carry that
      domain's complete public projection; deletion events carry a typed
      removal receipt.
    - An absent field is absent only where its schema permits omission; it is
      not a generic field-level patch. `null` means cleared only where the
      schema permits `null`, and `[]` means authoritatively empty.
    - Counters that can exceed 2^53 (token totals, run counts) are serialized as
      **strings**, because JavaScript consumes them.
    - Company-scoped denial is `404`, never `403`. A non-member cannot tell
      "does not exist" from "exists but is not yours".
    - Request bodies are `application/json` unless stated. The decoder is strict:
      unknown fields are rejected, the root must be an object, and the body is
      size-capped. Wrong content type is `415`; oversize is `413`.
    - Unknown, repeated, or empty-valued query parameters are `422`, everywhere.
      A multi-valued filter travels as **one comma-separated value** in a
      single parameter — that is the mechanism, not repetition.
    - A path id that cannot name a row is `404`, never `422` — malformed and
      missing are indistinguishable to the caller.
    - Creation signals through the status code alone: `201` created, `200`
      replayed or already-existing. No `{entity, created}` wrappers and no
      `created` flags.
    - An entity has exactly one public projection. Whenever REST and realtime
      expose that entity they reuse the projection; routed events may wrap it
      with routing ids, and signals remain their own typed payloads — see
      `realtime.md`.

    ## Error codes

    Every failure uses `{detail, code, requestId}`. Branch on `code`, never on
    `detail`. The full vocabulary and the retry policy for each code are in
    `errors.md`, which a test diffs against the server's registry in both
    directions.

    ## Operations that lead the implementation

    An operation carrying `x-boardly-status: planned` is contracted before it is
    served. The route-table gate allows it to have no route and reports it as
    awaiting implementation; the marker is removed in the commit that serves it.

    ## Authentication

    One credential in two containers, one per request:

    - `sessionCookie` — `boardly_access`, set by the auth endpoints. Used by the
      web app. Cookie-authenticated unsafe methods additionally require
      `X-CSRF-Token` matching the `boardly_csrf` cookie (`/auth/refresh` and
      `/auth/logout` validate against `boardly_refresh_csrf`); a mismatch is
      `403 csrf_invalid`. Bearer callers never encounter CSRF.
    - `bearerToken` — `Authorization: Bearer <accessToken>`. Used by the desktop
      shell and by the machine-side daemon.

    The default `security` for this document is "either user credential".
    Operations that need no credential declare `security: []`. The daemon plane
    (`/api/v1/daemon/*`) accepts that same bearer token, but from the
    `Authorization` header only — never a cookie, so CSRF never applies there.
    The spec spells that header-only rule as the `daemonToken` scheme; it is
    not a distinct credential. The plane is tagged `daemon` so it stays
    identifiable in the generated client.

  contact:
    name: Zenith Team engineering
servers:
  - url: http://localhost:8788
    description: Local development
  - url: /
    description: Same-origin deployment

security:
  - sessionCookie: []
  - bearerToken: []

tags:
  - name: wiki
    description: Company Wiki pages, collections, links, and revision history, plus the read-only Agent Wiki routes and the Run evidence trail.
  - name: calendar
    description: Personal and company events with durable Inbox reminders.
  - name: social
    description: Personal social account connections.
  - name: health
    description: Liveness, readiness, and operator metrics. Outside `/api/v1`.
  - name: auth
    description: Signup, login, session lifecycle, OAuth, desktop handoff.
  - name: account
    description: The authenticated user's own record.
  - name: companies
    description: Companies, membership, profile, search.
  - name: resources
    description: Company resources (local directories bound to a daemon).
  - name: groups
    description: Named sets of Team members that hold Project access together.
  - name: agents
    description: Agents and their archive/restore lifecycle.
  - name: connectors
    description: Company Connector discovery, policy, and setup.
  - name: plugins
    description: Provider Plugin discovery and installation.
  - name: tasks
    description: Tasks, task dependencies, and task-triggered runs.
  - name: schedules
    description: Server-authoritative one-shot and recurring Schedules.
  - name: workflows
    description: The release-owned Workflow catalog the Workflows page launches as Tasks.
  - name: plan
    description: Whole-company plan apply (the only path that deletes work).
  - name: conversations
    description: Conversations, per-user state, and the run queue.
  - name: messages
    description: Message reads and sends, addressed by conversation or by task.
  - name: attachments
    description: Attachment upload, completion, and download.
  - name: runs
    description: Run reads and cancellation on the user plane.
  - name: runtimes
    description: Runtime reads on the user plane. Read-only — daemons register.
  - name: approvals
    description: |
      Human-in-the-loop: permission approvals and mid-run questions. A run that
      raises one does not wait — it ends, and the answer arrives as a new run.
  - name: inbox
    description: Per-recipient inbox items and unread counts.
  - name: mailbox
    description: Company Email configuration and retained inbound messages.
  - name: agent-mail
    description: Reviewable outbound email drafts produced by Agents.
  - name: activity
    description: The company activity feed.
  - name: usage
    description: Token/cost usage reports and the activity insight tile.
  - name: diagnostics
    description: Crash report intake.
  - name: realtime
    description: WebSocket upgrade endpoints. Not HTTP request/response.
  - name: daemon
    description: |
      The machine-side daemon plane. Not consumed by browser or desktop UI
      code. The tag identifies the plane — a generator *could* filter on it,
      though the default generated client currently includes it. Authenticated
      with the standard bearer credential, header-only; every denial is `404`.


  - name: whiteboards
    description: Whiteboard Artifacts, drawn together by the people of the chat they were made in and their Agents.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: boardly_access
      description: |
        Web session cookie issued by `/auth/login`, `/auth/signup`, and
        `/auth/refresh`. Unsafe methods additionally require the `X-CSRF-Token`
        header.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Desktop access token from `session.accessToken`.
    daemonToken:
      type: http
      scheme: bearer
      description: |
        The bearer token as the daemon plane accepts it: from the
        `Authorization` header only. It is the daemon's own session
        (`POST /auth/daemon-session`, D31) or, as older daemons send, the
        person's `bearerToken`, authenticated by the same service. This
        scheme exists to state the header-only rule for `/api/v1/daemon/*`:
        cookies are never read there, so CSRF never applies. A daemon's own
        session is refused everywhere else (`403 run_proof_required`) unless
        the route accepts a Run and the request carries a live Run proof of
        its person.
