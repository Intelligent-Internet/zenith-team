  # /api/v1/companies/{companyId}/search
  companies_companyId_search:
    post:
      tags: [companies]
      operationId: searchCompany
      summary: Search tasks, conversations, and messages
      description: |
        One cross-entity search over tasks, conversations and messages. Member
        gated. A POST because the query travels in the body, not because it
        writes anything. Task hits and messages in task chats come only from
        Projects the caller reads (ADR 0017); a task in any other Project is
        never a hit.

        `limit` is a **1..50, default 20** top-result cap. Search has no cursor
        or continuation contract; a caller changes the query or raises the cap.

        Matching is not uniform across kinds. Tasks and conversations
        substring-match the whole whitespace-collapsed query
        (case-insensitively, over task key, the displayed
        `{taskPrefix}-{number}` label, title/description/status/priority,
        and over conversation title plus agent name/title), so a
        multi-word query hits only where the words are contiguous. Messages use
        a token-built full-text query — the first 12 distinct alphanumeric
        tokens, prefix-matched and ANDed. Ranking interleaves the kinds
        round-robin, so a flood of message hits cannot bury the one matching
        task.

        The `message` kind searches only the two chat item types,
        `user_message` and `agent_text`. A conversation is one stream that also
        holds a run's reasoning and tool output, so this is an explicit fence,
        written into the partial index the query is planned against: search
        returns only what the caller could already read in the chat.

        `includeArchived` also includes archived discussion messages. For Agent chats it affects only the conversation kind. It is not
        applied to task matches at all, and message matches ignore it: an
        archived direct conversation yields no message hits regardless of the
        flag, while archived task conversations still surface them.

        The body cap on this route is 4 KiB rather than the usual limit.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                conversationId: {type: string, format: uuid}
                authorId: {type: string, format: uuid}
                after: {type: string, format: date-time, description: Inclusive message creation boundary.}
                before: {type: string, format: date-time, description: Exclusive message creation boundary.}
                hasFile:
                  type: boolean
                  default: false
                  description: |
                    Only messages holding a file the caller may open. A file
                    left out of the message for the caller (a Project file of a
                    Project they do not read, ADR 0017) does not count, and
                    neither does an upload that never finished.

                query:
                  type: string
                  maxLength: 256
                  description: |
                    Whitespace-collapsed; at least 2 runes, at most 256 bytes,
                    and at least one letter or digit.
                kinds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: |
                    Restrict the union. Absent or `null` means all three; `[]`
                    is `422`.
                  items: { type: string, enum: [task, conversation, message] }
                includeArchived: { type: boolean, default: false }
                limit: { type: integer, minimum: 1, maximum: 50, default: 20, example: 50 }
      responses:
        '200':
          description: A bounded ranked, interleaved union.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/SearchResult' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` (query too short or long, `kinds` empty,
            unknown or duplicated, or `limit` outside 1..50).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

  # ================================================================ resources

  # /api/v1/companies/{companyId}/resources
  companies_companyId_resources:
    get:
      tags: [resources]
      operationId: listCompanyResources
      summary: List company resources (company.resources.manage)
      description: |
        A company resource is a typed handle on something outside Zenith Team that
        agents work against. There is exactly one type — `local_directory`, a
        directory on a machine where a daemon runs. Requires `company.resources.manage`. Ordered by
        `position`, then `createdAt`, then `id`.

        Members holding `company.resources.manage` (owner, admin) create a binding through POST on this collection.
        Public Resource responses omit the filesystem path; the server stores
        it and includes it in the private frozen daemon Run context. There is
        no GitHub/repository Resource type.

        `daemonStatus` and `daemonLastSeenAt` are derived from the runtimes the
        row's daemon registered in this company. They are included in the full
        public projection but are not writable and do not advance the resource
        row's `revision`.

        The matching resources are returned in full. `daemon_id` remains a
        filter; this endpoint accepts no pagination parameters.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: '#/parameters/daemonId'
      responses:
        '200':
          description: All matching resources, ordered by position.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/CompanyResource' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422':
          description: |
            `validation_failed` (unknown query parameter or empty `daemon_id`).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

    post:
      tags: [resources]
      operationId: createCompanyResource
      summary: Bind a directory on one machine to this company
      description: |
        Attaches a local directory so non-Schedule runs claimed by that
        machine's daemon execute **in place**, overriding managed main or a
        Task worktree. Schedule runs remain isolated. Gate: `company.resources.manage` (owner, admin).

        The daemon serializes access to the selected path. A managed directory
        or Git worktree is not an OS sandbox guarantee. The managed-only
        replacement is Planned in docs/specs/workspaces; this operation still
        describes the served directory-binding baseline.

        PostgreSQL generates the row `id`. Repeating the same `daemonId`,
        `localPath`, `label`, and `position` returns the existing row with
        `200`; changing any canonical field for a daemon that is already bound
        is `409 company_resource_conflict`.

        `localPath` is **not** checked against a filesystem here — the server
        cannot see the caller's disk. A binding client needs local validation;
        the daemon validates during preparation on the machine that will
        actually execute there. HTTP authorization is owner access, not a
        browser/desktop distinction.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daemonId, localPath, label]
              properties:
                daemonId:
                  type: string
                  maxLength: 200
                  description: |
                    The machine this directory lives on. A company holds **one
                    directory per daemon**: the daemon resolves its own row by
                    this id, so a second row for the same machine would leave
                    it choosing which of the user's folders to write into.
                localPath:
                  type: string
                  maxLength: 4096
                  description: |
                    Absolute path on that machine. Omitted from public
                    Resource responses; stored and included in private daemon
                    Run context.
                label:
                  type: string
                  maxLength: 120
                position:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 0
      responses:
        '200':
          description: An identical daemon-scoped binding already existed.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyResource' }
        '201':
          description: Bound with a database-generated `id`.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyResource' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` — members cannot bind directories.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 company_resource_conflict` — this daemon already has a
            directory bound with different canonical fields.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/resources/{resourceId}
  companies_companyId_resources_resourceId:
    get:
      tags: [resources]
      operationId: getCompanyResource
      summary: Read one company resource (company.resources.manage)
      description: |
        Returns the resource object bare — the same bytes the list carries in
        `items` and `resource.updated` carries on the socket. A company the
        caller cannot see is `404 company_not_found`, the same code every other
        company-scoped route uses; `company_resource_not_found` names only a
        missing or foreign **resource**.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/resourceId'
      responses:
        '200':
          description: The resource.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyResource' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: |
            `404 company_not_found` (unknown or malformed company id, or no
            active membership) or `404 company_resource_not_found` (unknown or
            malformed resource id, or a resource in another company).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
    patch:
      tags: [resources]
      operationId: updateCompanyResource
      summary: Update a company resource (company.resources.manage)
      description: |
        A true partial update: send `expectedRevision` plus **at least one**
        of `label` and `position`. Omitted fields keep their stored value, and
        an explicit `null` is rejected for both — a resource without a label or
        a position is not a thing the ordering can render.

        A mismatched `expectedRevision` is a conflict, full stop. There is no
        one-step replay allowance: "the stored values already match what you
        asked for" is not the same statement as "your write won".

        `metadata` is **not** an input. Its only recognized key, `checkoutRef`,
        was rejected on a `local_directory` resource and that is the only type,
        so it was contract surface for a resource type that does not exist. It
        stays in the response as `{}` because the column is real.

        The body cap on this and the delete is 32 KiB.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              minProperties: 2
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
                label: { type: string, minLength: 1, maxLength: 120 }
                position: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
      responses:
        '200':
          description: |
            The full updated resource. A write whose values already match
            returns `200`, does not bump `revision`, and emits no event.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyResource' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: |
            `404 company_not_found` or `404 company_resource_not_found`.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 company_resource_conflict` — `expectedRevision` did not
            match. Re-read, re-apply, write again.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — `expectedRevision` out of range,
            neither `label` nor `position` supplied, `label` empty or too long,
            or `position` out of range.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
    delete:
      tags: [resources]
      operationId: deleteCompanyResource
      summary: Delete a company resource (company.resources.manage)
      description: |
        A hard delete — no tombstone is kept. Success is `204` with an empty
        body; there is no row left to return, which is the one case the write
        receipt rule exempts.

        Requires a JSON **request body** carrying `expectedRevision`, with
        `Content-Type: application/json`, because the version guard has nowhere
        else to travel. A bodiless request is `400` and a missing content type
        is `415`.

        Not idempotent on replay: with no tombstone, repeating a successful
        delete is `404 company_resource_not_found`, the same answer as for a
        resource that never existed. The `resource.deleted` event carries
        `expectedRevision + 1` as the version of the deletion, so a client
        can order it against a snapshot it already holds.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - $ref: './_common.yaml#/parameters/resourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      responses:
        '204':
          description: Deleted. No body.
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: |
            `404 company_not_found`, or `404 company_resource_not_found` —
            including a replayed delete.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 company_resource_conflict` — `expectedRevision` did not
            match the stored version.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — `expectedRevision` missing or out of
            range.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


  # ======================================================== composites
  # Named, hand-written screen reads. Each replaces a measured waterfall; see
  # the resource file that owns it for the before/after and the use cases.

  companies_companyId_initialization:
    parameters:
      - $ref: './_common.yaml#/parameters/companyId'
    get:
      tags: [companies]
      operationId: getCompanyInitialization
      summary: Read the founder's company research progress
      responses:
        '200':
          description: Durable research phase, Run status and how many Wiki pages the research has written so far.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyInitialization' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
    post:
      tags: [companies]
      operationId: advanceCompanyInitialization
      summary: Start the company research
      description: |
        Requires agents.manage and a human actor. Company-serialized and
        idempotent; repeating a request never duplicates a live Run.
        The initial POST can reserve a durable receipt while waiting for models.
        Starting or retrying research requires a completed model discovery from
        the founder's bound runtime advertising Luna. Uses no reasoning when
        offered, otherwise its lowest supported level. The CEO model is unchanged.
        The research then runs in the background and writes linked Company Wiki
        pages; nothing else needs a client. When the Run reaches its final state
        the server completes the receipt and sends the founder an Inbox notice
        that opens the Wiki. A failed Run stays failed until a POST with
        `retry: true` starts a new one. The CEO conversation accepts sends
        once the Run exists. A background reconciler only completes a receipt
        whose final Run the terminal path could not reach; it never starts
        discovery, a Run or a retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/AdvanceCompanyInitialization' }
      responses:
        '200':
          description: The existing or newly advanced initialization.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyInitialization' }
        '403': { $ref: './_common.yaml#/responses/Forbidden' }
        '409': { $ref: './_common.yaml#/responses/Conflict' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  # /api/v1/companies/{companyId}/bootstrap
  companies_companyId_bootstrap:
    get:
      tags: [companies]
      operationId: getCompanyBootstrap
      summary: Load everything the authenticated session needs
      description: |
        One read replacing the ten an opening session made before rendering
        anything: the shell's company and inbox counts, plus
        home's root agent, the conversation to open, and the two
        counters the top chrome draws. Gate: `agents.manage` (owner, admin). Every component is read
        from one read-only `REPEATABLE READ` snapshot.

        **Each object is the same DTO its own endpoint returns**, so a client
        writes each part straight into the cache slot the individual read would
        have filled, and the realtime events that follow update those slots
        directly. The individual endpoints stay — this is an accelerator, not a
        replacement.

        This is session-scoped, not route-scoped: it is read once when a
        company is opened and thereafter maintained over the socket. There is
        deliberately no second composite for the home route. An earlier draft
        had one, and it re-sent `company` and the unread
        count that this response already carries — putting one entity in two
        composites read on the same paint, so a single `company.updated` had to
        patch two cache slots or leave one stale.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: The session snapshot.
          content:
            application/json:
              schema:
                type: object
                required:
                  - company
                  - inboxCounts
                  - ceoAgent
                  - ceoConversationId
                  - activeTaskCount
                  - queuedRunCount
                  - activeRunCount
                properties:
                  company: { $ref: '#/schemas/Company' }
                  inboxCounts: { $ref: './_common.yaml#/schemas/InboxCounts' }
                  ceoAgent:
                    description: |
                      The company's root agent — the one agent with no manager.
                      `null` until one exists.

                      This is the shared `Agent` — the same wire type **every**
                      agent response carries, so it is byte-identical to what
                      the agent endpoints return and lands in the same cache
                      slot.
                    oneOf:
                      - $ref: './_common.yaml#/schemas/Agent'
                      - { type: "null" }
                  ceoConversationId:
                    type: [string, "null"]
                    format: uuid
                    description: |
                      The caller's own direct conversation with the root agent.
                      `null` when they have not started it yet — a different
                      screen from "loading". Opening that chat is home's only
                      job, and resolving it otherwise meant listing
                      conversations and filtering client-side.

                      An id rather than the conversation, because the client
                      reads the conversation itself from
                      `GET …/conversations/{conversationId}` when it opens the
                      panel, and that read is the one the socket keeps fresh.
                  activeTaskCount:
                    type: integer
                    format: int64
                    example: 14
                    description: |
                      Company tasks whose status is not `done` or `cancelled`.
                  queuedRunCount:
                    type: integer
                    format: int64
                    example: 1
                    description: |
                      Company runs in `queued` or `deferred` — scheduled work
                      that has not started. The standard counting vocabulary;
                      no other run counter names exist.
                  activeRunCount:
                    type: integer
                    format: int64
                    example: 2
                    description: |
                      Company runs in `dispatched`, `waiting_local_directory`,
                      or `running` — work currently in flight.
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422':
          description: '`422 validation_failed` — unknown query parameter.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


