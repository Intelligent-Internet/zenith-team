# Authored domain section of the Zenith Team API contract.
# docs/api/spec/openapi.yaml is the index
# that references it, and docs/api/companies.md is its prose counterpart.

parameters:
  daemonId:
    name: daemon_id
    in: query
    required: false
    description: |
      Restrict a resource list to the resources one daemon registered. The
      storage rule is one local directory per daemon per company, so this is a
      single-row lookup rather than a filter over a page. An empty value is
      `422 validation_failed` like any other empty-valued parameter.
    schema: { type: string, minLength: 1 }

paths:
  # ================================================================ companies

  # /api/v1/companies
  companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: List the caller's companies
      description: |
        Every company where the caller holds an active membership, oldest first
        (`createdAt`, then `id`). A company whose deletion has started is
        excluded and never reappears. The collection is bounded by the caller's
        memberships and is returned in full; this endpoint accepts no
        pagination parameters.

        `role` is the **caller's** role in that company, not a property of the
        company: two members reading the same row get two different values, so
        a client caching this object must key it by viewer as well.
      responses:
        '200':
          description: All companies the caller actively belongs to.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/Company' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '422':
          description: |
            `validation_failed` (unknown, repeated, or empty query parameter).
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
    post:
      tags: [companies]
      operationId: createCompany
      summary: Create a company
      description: |
        Creates the bare tenant: the company row and the caller's owner
        membership. No agents and no
        conversations are seeded — an agent is bound to the runtime that
        executes it, and no runtime can exist before the company does, so a
        fresh company comes back with an empty org.

        PostgreSQL generates the company `id`. The first successful write
        returns `201`; the globally unique slug is the authoritative duplicate
        boundary and maps collisions to `409 company_create_conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, taskPrefix]
              properties:
                name:
                  type: string
                  description: |
                    1..120 runes and at most 480 UTF-8 bytes after trimming.
                slug:
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
                  description: |
                    At most 63 bytes and not one of the reserved slugs listed
                    in companies.md.
                taskPrefix:
                  type: string
                  pattern: '^[A-Z][A-Z0-9]{1,9}$'
                  description: The prefix in `NWR-42`.
                businessContext:
                  type: string
                  maxLength: 32768
                  description: '`""` is accepted.'
                websiteUrl:
                  type: string
                  format: uri
                  description: |
                    Absolute `http(s)` URL, or absent. The CEO Agent scans it
                    during onboarding research.
      responses:
        '201':
          description: |
            Created with a database-generated `id`. The body is the company
            object, identical to the one the list returns.
          content:
            application/json:
              schema: { $ref: '#/schemas/Company' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '409':
          description: '`409 company_create_conflict` — the slug is taken.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: '`422 validation_failed` — a request field fails validation.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


  # /api/v1/companies/{companyId}
  companies_companyId:
    get:
      tags: [companies]
      operationId: getCompany
      summary: Read one company
      description: |
        The company object at the top level — the same bytes the list carries
        in `items`, and the same DTO `company.updated` carries on the socket.

        Membership is enforced by the read itself, so a non-member and a
        nonexistent company are the same `404`. A `companyId` that is not a
        UUID is also `404 company_not_found`, not `400`: the membership gate
        parses the segment before any handler sees it.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: The company.
          content:
            application/json:
              schema: { $ref: '#/schemas/Company' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: |
            `404 company_not_found` — missing, malformed, not a member, or the
            company is being deleted.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422':
          description: '`422 validation_failed` — unknown query parameter.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }

    delete:
      tags: [companies]
      operationId: deleteCompany
      summary: Permanently delete a company (company.delete)
      description: |
        Requires `company.delete`, which only owners hold, and a human actor. Permanently removes the Company, its PostgreSQL-owned graph,
        and its detached Company Activity and Run records, then revokes every
        member's access. `expectedRevision` fences a stale confirmation against
        a concurrent Company profile change.

        Success is `204` with an empty body. A successful deletion has no
        tombstone, so replay returns `404 company_not_found`. Authored local
        workspace files on connected computers and content held by external
        providers are not remotely deleted; local files are not a cloud backup.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      responses:
        '204': { description: Company deleted; response body is empty. }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`409 company_delete_conflict` — the Company revision changed.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/proactive-mode
  companies_companyId_proactive_mode:
    get:
      tags: [companies]
      operationId: getProactiveMode
      summary: Read the Company's Proactive Mode setting
      description: |
        Member-gated read of the automation setting used by the exact
        owner-to-top-level-CEO Conversation. `canManage` is true for members holding
        `company.proactive_mode.manage` (owner, admin); other active members can
        see the state but cannot change it.

        The setting is disabled by default. Its `revision` is independent of
        the Company projection's revision.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: The current Proactive Mode setting for this Company.
          content:
            application/json:
              schema: { $ref: '#/schemas/ProactiveMode' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

    patch:
      tags: [companies]
      operationId: updateProactiveMode
      summary: Update the Company's Proactive Mode setting (company.proactive_mode.manage)
      description: |
        Requires `company.proactive_mode.manage`. `expectedRevision` protects concurrent settings edits. A
        successful write returns the complete authoritative setting, so a
        confirming read is unnecessary.

        Enabling requires the owner's active direct Conversation with the
        Company's top-level CEO Agent. If that exact Conversation is not
        available, the setting remains unchanged.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedRevision]
              properties:
                enabled: { type: boolean }
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
      responses:
        '200':
          description: The authoritative Proactive Mode setting after the write.
          content:
            application/json:
              schema: { $ref: '#/schemas/ProactiveMode' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 proactive_mode_conflict` — `expectedRevision` did not match;
            or `proactive_mode_conversation_required` — the owner's exact CEO
            Conversation is unavailable.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/statistics
  companies_companyId_statistics:
    get:
      tags: [companies]
      operationId: getCompanyStatistics
      summary: Read company membership and runtime counts
      description: |
        Member-gated aggregate counts that change independently of the company
        row. Keeping them on this read prevents membership and heartbeat churn
        from changing the company projection or its `revision`.

        Any query parameter is `422 validation_failed`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: Current company statistics.
          content:
            application/json:
              schema: { $ref: '#/schemas/CompanyStatistics' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  # /api/v1/companies/{companyId}/profile
  companies_companyId_reference_documents:
    post:
      tags: [companies]
      operationId: addCompanyReferenceDocuments
      summary: Keep uploaded files as Company reference documents (company.resources.manage)
      description: |
        Requires `company.resources.manage` and a human actor. Registers already-uploaded Attachments as the Company's
        founder-supplied source material — the deck, brief or brand guide a
        founder hands over at onboarding so the CEO Agent can read them before
        interviewing.

        The documents belong to the Company rather than to one message, so
        every interactive Run receives them and the daemon places them in the
        Company workspace under `assets/references/`. Registering also holds
        the upload out of the abandoned-attachment sweep, which is what keeps a
        founder's file from being collected before an Agent has read it.

        Registration is idempotent: naming the same Attachment twice states one
        fact twice.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentIds]
              properties:
                attachmentIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uuid }
                  description: |
                    Ready Attachments the caller uploaded to this Company that
                    are not shared anywhere yet: no chat message, queued
                    message or Project holds them. Every Run receives the
                    reference documents, so a file with its own audience
                    cannot become one (ADR 0017). An id naming another
                    person's or tenant's file, a file already shared, or an
                    upload that never completed is `422 validation_failed`.
      responses:
        '200':
          description: The Attachments now kept as reference documents.
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered:
                    type: array
                    items: { type: string, format: uuid }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — an empty set, more than ten files, or an
            id that names no ready Attachment of this Company.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  companies_companyId_milestone_attestations:
    post:
      tags: [companies]
      operationId: attestCompanyMilestones
      summary: Record milestones already completed outside Zenith Team
      description: |
        Records what the founder has just confirmed already exists, so the
        Company Plan never proposes rebuilding it.

        Two gates, because this stores a person's statement but is written by an
        Agent: the session must be the Company owner, and the request must carry
        `X-Boardly-Run-Token` proving a live Run in the same Company. An owner
        session alone would let any client assert the founder's history outside
        the conversation where the founder was actually asked.

        The whole set is written in one transaction — a founder lists what they
        have rather than answering once per milestone, and a partial write would
        leave the planner with a half-true history. Re-attesting restates the
        fact rather than conflicting.

        There is no read surface. The only consumer is the Agent, which receives
        attestations in its frozen Run brief.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: X-Boardly-Run-Token
          in: header
          required: true
          description: Proof of a live Run in this Company.
          schema: { type: string, pattern: '^brt_[0-9a-f]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [milestones]
              properties:
                milestones:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: './tasks.yaml#/schemas/TaskMilestoneTypeDto' }
                note:
                  type: string
                  maxLength: 2000
                  description: The founder's own words, carried verbatim.
      responses:
        '200':
          description: The milestones now on record as already completed.
          content:
            application/json:
              schema:
                type: object
                required: [attested]
                properties:
                  attested:
                    type: array
                    items: { $ref: './tasks.yaml#/schemas/TaskMilestoneTypeDto' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401':
          description: '`401 run_token_invalid` — missing, unknown or foreign Run token.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — an empty set, a repeat, a value outside the
            milestone catalogue, or an over-long note.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '500': { $ref: './_common.yaml#/responses/InternalError' }

  companies_companyId_profile:
    patch:
      tags: [companies]
      operationId: updateCompanyProfile
      summary: Update the company profile (company.profile.update)
      description: |
        Requires `company.profile.update`. Despite the PATCH verb this **replaces** the profile: all
        four profile fields must be present on every call, and omitting one is
        `422 validation_failed` rather than "leave it alone".
        `phoneCountryIso2` and `phoneNumber` move together — both strings or
        both `null`; one of each is `422`.

        `avatarAttachmentId` is optional: omit it to keep the current avatar,
        send `null` to remove it, or select a ready upload made by the caller
        in this Company. Avatars accept PNG, JPEG and WebP up to 5 MiB.
        The selected attachment is retained and readable by active members;
        replacing or removing it releases that grant and retention pin.

        The version check runs **before** the no-change check, so a stale
        `expectedRevision` paired with a payload that happens to match the
        stored values is a `409`, not a silently swallowed conflict. A write
        that changes nothing returns `200`, does not bump `revision`, and
        raises no event.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, name, contactEmail, phoneCountryIso2, phoneNumber]
              properties:
                expectedRevision: { $ref: './_common.yaml#/schemas/Revision' }
                avatarAttachmentId:
                  type: [string, "null"]
                  format: uuid
                  description: Ready Company image upload, null to remove, omitted to preserve.
                name:
                  type: string
                  description: |
                    1..120 runes and at most 480 UTF-8 bytes after trimming.
                contactEmail:
                  type: [string, "null"]
                  format: email
                  maxLength: 320
                  description: |
                    Lowercased, must parse as a bare address with a dotted
                    domain. `""` normalizes to `null`.
                phoneCountryIso2:
                  type: [string, "null"]
                  description: |
                    Supported ISO-3166 alpha-2, uppercased server-side.
                phoneNumber:
                  type: [string, "null"]
                  description: 1..15 digits, digits only.
      responses:
        '200':
          description: |
            The updated (or unchanged) company. This is the authoritative
            post-write state; no confirming `GET` is needed.
          content:
            application/json:
              schema: { $ref: '#/schemas/Company' }
        '400': { $ref: './_common.yaml#/responses/BadRequest' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`403 company_permission_required` or `csrf_invalid`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: |
            `409 company_profile_revision_conflict` — `expectedRevision` did
            not match.
            One of the responses that deliberately extend the error
            envelope: `currentCompany` carries the server's current state so a
            client rebases without a refetch. Treat it exactly as if it had
            come from the read.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: './_common.yaml#/schemas/Error' }
                  - type: object
                    required: [currentCompany]
                    properties:
                      currentCompany: { $ref: '#/schemas/Company' }
        '413': { $ref: './_common.yaml#/responses/PayloadTooLarge' }
        '415': { $ref: './_common.yaml#/responses/UnsupportedMediaType' }
        '422':
          description: |
            `422 validation_failed` — a field is missing, of the wrong type, or
            fails its rule.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }


  # /api/v1/companies/{companyId}/members
  companies_companyId_members:
    get:
      tags: [companies]
      operationId: listCompanyMembers
      summary: List active members
      description: |
        Active memberships only, oldest first (`createdAt`, then the member's
        user id). Revoked members are absent with no tombstone. All active
        Company members may read the roster; a non-member gets `404`.

        A row embeds a resolved actor ref plus the member's `email`, because
        nothing else in the API can turn a user id into a person: there is no
        `GET /users/{userId}` in the route table and there never was.

        The active roster is returned in full; this endpoint accepts no
        pagination parameters.

        Consumed by the Team page.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
      responses:
        '200':
          description: All active members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/schemas/ActiveMember' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '404':
          description: '`404 company_not_found`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }


  companies_companyId_members_userId:
    patch:
      tags: [companies]
      operationId: changeCompanyMemberRole
      summary: Change another member's role
      description: |
        Requires `members.manage`. When the target is an owner, or the new
        role is `owner`, the caller also needs `members.owners.manage`, which
        only owners hold. A member never changes their own role here: leaving
        and transferring ownership are the two self-directed moves. The last
        active owner is never demoted (`409 team_last_owner`). Sending the
        role the member already holds is a no-op that returns the current
        row and emits nothing.

        The change is a person's decision: a request carrying a Run proof is
        refused with `403 human_actor_required`.

        Success returns the updated roster row. The company receives
        `member.updated`; the member receives `auth.company_access_changed`
        with their new `role` and `permissions`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/MemberRoleChange' }
      responses:
        '200':
          description: The member's updated roster row.
          content:
            application/json:
              schema: { $ref: '#/schemas/ActiveMember' }
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`company_permission_required` or `human_actor_required`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: Company or active membership not found.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: '`team_last_owner` or `team_member_revision_conflict`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }
    delete:
      tags: [companies]
      operationId: removeCompanyMember
      summary: Remove another member
      description: |
        Requires `members.manage`; removing an owner also requires
        `members.owners.manage`. The last active owner cannot be removed. A
        request carrying a Run proof is refused with `403 human_actor_required`.
      parameters:
        - $ref: './_common.yaml#/parameters/companyId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/schemas/MembershipMutation' }
      responses:
        '204':
          description: Membership revoked; company access ends immediately.
        '401': { $ref: './_common.yaml#/responses/Unauthorized' }
        '403':
          description: '`company_permission_required` or `human_actor_required`.'
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '404':
          description: Company or active membership not found.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '409':
          description: Last owner cannot leave or be removed, or membership revision changed.
          content:
            application/json:
              schema: { $ref: './_common.yaml#/schemas/Error' }
        '422': { $ref: './_common.yaml#/responses/ValidationFailed' }

  companies_companyId_members_userId_transfer_ownership:
    post:
