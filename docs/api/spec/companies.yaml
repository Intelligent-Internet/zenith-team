schemas:
  CompanyInitialization:
    type: object
    required: [phase, status, pagesWritten]
    properties:
      phase:
        type: string
        enum: [not_started, research, ready]
        description: not_started until the research Run exists, research while it works or after it failed, ready once it completed.
      status: { type: string, enum: [idle, awaiting_model, queued, dispatched, running, waiting_local_directory, deferred, waiting_runtime, completed, failed] }
      runId: { type: string, format: uuid }
      conversationId: { type: string, format: uuid }
      message: { type: string }
      pagesWritten:
        type: integer
        minimum: 0
        description: Wiki pages the research Run (including its automatic retries) has written so far.
      overviewPageId:
        type: string
        format: uuid
        description: The research's `company-overview` hub page; omitted until it is written.
  AdvanceCompanyInitialization:
    type: object
    additionalProperties: false
    properties:
      conversationId: { type: string, format: uuid }
      modelDiscoveryId: { type: string, format: uuid }
      retry: { type: boolean, default: false }
  MembershipMutation:
    type: object
    additionalProperties: false
    required: [expectedRevision]
    properties:
      expectedRevision: { type: integer, format: int64, minimum: 1 }

  MemberRoleChange:
    type: object
    additionalProperties: false
    required: [expectedRevision, role]
    properties:
      expectedRevision: { type: integer, format: int64, minimum: 1 }
      role: { $ref: '#/schemas/CompanyRole' }

  ActiveMember:
    type: object
    description: |
      An active membership row. Carries a resolved actor ref plus the member's
      email, because there is no `GET /users/{userId}` in the route table and a
      roster that ships ids alone cannot be rendered at all.
    required:
      - companyId
      - actor
      - email
      - role
      - accountDisabled
      - createdAt
      - updatedAt
      - revision
    properties:
      companyId: { type: string, format: uuid }
      actor:
        description: |
          `actor.id` is the user id — the value `member.removed` names on the
          socket, and the value to compare against `GET /me` to find the
          caller's own row.
        $ref: './_common.yaml#/schemas/ActorRef'
      email:
        type: string
        format: email
        description: |
          The member's address. Sits beside the ref rather than inside it: an
          actor ref is also a message author and a task creator, and those
          appear on screens where a member's address has no business being.
          Every active member reads this roster, and it is the one place the
          address appears. It is also the only thing separating two members
          with the same display name, which is free text with no uniqueness
          rule.
      role: { $ref: '#/schemas/CompanyRole' }
      accountDisabled:
        type: boolean
        description: |
          The user's account is disabled. **Disabling an account does not
          revoke the membership**, so a disabled user keeps an active row here
          — and their runtimes drop out of the statistics read's
          `runtimeOnlineCount`. Without this flag an owner sees a full roster
          with no explanation for why an online runtime was excluded.
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }


  Company:
    type: object
    description: |
      A company (tenant). `role` and `permissions` are the **calling
      user's**: the role their membership holds and the permission set it
      resolves to. Gate every UI affordance on `permissions`, never on the
      role name, so client and server cannot drift.
    required:
      - id
      - name
      - slug
      - taskPrefix
      - businessContext
      - websiteUrl
      - contactEmail
      - phoneCountryIso2
      - phoneNumber
      - role
      - permissions
      - revision
      - createdAt
      - updatedAt
      - agentSetupCompletedAt
      - firstPlanAppliedAt
      - avatarAttachmentId
    properties:
      id: { type: string, format: uuid }
      name: { type: string }
      avatarAttachmentId:
        type: [string, "null"]
        format: uuid
        description: Download through the authenticated attachment endpoint with this Company ID.
      slug: { type: string }
      taskPrefix:
        type: string
        description: Prefix for generated task keys, e.g. `NWR` in `NWR-42`.
      businessContext: { type: string }
      websiteUrl:
        type: [string, "null"]
        format: uri
      contactEmail: { type: [string, "null"] }
      phoneCountryIso2:
        type: [string, "null"]
        description: Two-letter ISO country code, uppercased server-side.
      phoneNumber: { type: [string, "null"] }
      role: { $ref: '#/schemas/CompanyRole' }
      permissions:
        type: array
        description: |
          The calling user's resolved permissions, sorted. Members receive
          `conversations.discuss` and `plugins.manage`. Realtime
          `company.updated` frames omit `role` and `permissions`; only
          `auth.company_access_changed` moves them.
        items: { $ref: '#/schemas/CompanyPermission' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      initializationPending:
        type: boolean
        description: The founder's receipt exists but research has not been started (no research Run yet); the client must start it. It is false while research runs and after it ends.
      agentSetupCompletedAt:
        oneOf:
          - $ref: './_common.yaml#/schemas/Timestamp'
          - type: "null"
        description: |
          When the Company gained its root Agent, or `null` before it has one.
          A server-owned stamp: it is written once and takes no part in
          `revision`, so it never conflicts with a profile edit.
      firstPlanAppliedAt:
        oneOf:
          - $ref: './_common.yaml#/schemas/Timestamp'
          - type: "null"
        description: |
          When the Company's first Company Plan transaction applied, or `null`
          before one has. Server-owned on the same terms as
          `agentSetupCompletedAt`.

  ProactiveMode:
    type: object
    description: |
      The Company automation setting. It is a distinct mutable projection with
      its own `revision`; `canManage` reflects the calling member's current
      authority.
    additionalProperties: false
    required:
      - companyId
      - enabled
      - enabledByUserId
      - conversationId
      - revision
      - canManage
    properties:
      companyId: { type: string, format: uuid }
      enabled: { type: boolean }
      enabledByUserId:
        type: [string, "null"]
        format: uuid
        description: The sponsoring owner while enabled; otherwise `null`.
      conversationId:
        type: [string, "null"]
        format: uuid
        description: The exact owner-to-top-level-CEO Conversation while enabled.
      revision: { $ref: './_common.yaml#/schemas/Revision' }
      canManage:
        type: boolean
        description: Whether the caller may update this setting.


  CompanyStatistics:
    type: object
    description: Aggregate company counts that are intentionally not Company fields.
    required: [memberCount, runtimeCount, runtimeOnlineCount]
    properties:
      memberCount:
        type: integer
        format: int64
        minimum: 0
        example: 4
        description: Active company memberships.
      runtimeCount:
        type: integer
        format: int64
        minimum: 0
        example: 2
        description: Runtimes registered in the company, online or offline.
      runtimeOnlineCount:
        type: integer
        format: int64
        minimum: 0
        example: 1
        description: |
          Online runtimes owned by active members whose accounts are enabled.


  CompanyResource:
    type: object
    description: |
      A typed handle on something outside Zenith Team that agents work against.
      One type exists: `local_directory`, a directory on a machine where a
      daemon runs.
    required:
      - id
      - companyId
      - resourceType
      - resourceRef
      - daemonStatus
      - daemonLastSeenAt
      - label
      - position
      - metadata
      - createdBy
      - createdAt
      - updatedAt
      - revision
    properties:
      id: { type: string, format: uuid }
      companyId: { type: string, format: uuid }
      resourceType: { type: string, enum: [local_directory] }
      resourceRef:
        description: |
          The public projection of the handle. For `local_directory` it names
          the daemon and nothing else. The filesystem path is stored but
          omitted from public Resource responses and events; private daemon
          Run context includes the frozen `localPath`.
        $ref: './_common.yaml#/schemas/ResourceRef'
      daemonStatus:
        $ref: '#/schemas/DaemonStatus'
      daemonLastSeenAt:
        description: |
          Newest heartbeat across the runtimes this daemon registered in this
          company. `null` while the daemon is `unregistered` or has never
          heartbeat. It is included in the full public projection but is not
          writable and does not advance `revision` — it describes the machine,
          not the row.
        oneOf:
          - { $ref: './_common.yaml#/schemas/Timestamp' }
          - { type: "null" }
      label: { type: string, minLength: 1, maxLength: 120 }
      position: { type: integer, format: int32, minimum: 0, maximum: 1000000 }
      metadata: { $ref: '#/schemas/ResourceMetadata' }
      createdBy: { $ref: './_common.yaml#/schemas/ActorRef' }
      createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      revision: { $ref: './_common.yaml#/schemas/Revision' }


  CompanyRole:
    type: string
    description: |
      A membership role. Roles are what people assign; code checks
      permissions (`CompanyPermission`). An `owner` holds every permission.
      An `admin` holds every permission except `company.delete`,
      `members.owners.manage`, `commerce.manage` and `results.publish`. Company roles do not grant private content access. A
      `member` holds `conversations.discuss` and `plugins.manage` — installing
      plugins and connecting apps on their own computers — and no
      Company-wide management permission: they work on Tasks and chats,
      register their own runtimes, set Agents up on them and start the Tasks
      assigned to them. A company keeps at least one active owner.
    enum: [owner, admin, member]

  CompanyPermission:
    type: string
    description: |
      One action the server checks. The server resolves a member's set from
      their role and publishes it on every `Company` read and on the
      `auth.company_access_changed` frame; clients gate on the set. Runtime
      ownership (a machine executes only its registrant's own work,
      ADR 0014), a Task's assignee (only they start it) and actor type (a
      person versus a Run acting through its proof) are separate rules that
      no permission overrides. `tasks.assign` admits assigning a Task to
      another member and handing a Task off; the current assignee may hand
      their own Task off without it. `plugins.manage` installs plugins and
      connects apps on the holder's own computers, the only ones a Plugins
      action reaches, so every role holds it; `connectors.manage` (owner,
      admin) reviews an app whose tools changed and sets Company Connector
      policy.
    enum:
      - agents.manage
      - approvals.resolve
      - commerce.manage
      - commerce.read
      - company.delete
      - company.plan.apply
      - company.proactive_mode.manage
      - conversations.discuss
      - channels.manage
      - company.profile.update
      - company.resources.manage
      - connectors.manage
      - mailbox.manage
      - members.invite
      - members.manage
      - members.owners.manage
      - plugins.manage
      - projects.manage
      - wiki.publish
      - whiteboards.read
      - whiteboards.create
      - whiteboards.edit
      - whiteboards.manage
      - results.publish
      - results.review
      - calendar.manage
      - schedules.manage
      - tasks.assign
      - usage.read


  DaemonStatus:
    type: string
    description: |
      Whether the machine behind a `local_directory` resource can run anything
      right now, derived from the runtimes that daemon registered in this
      company.

      - `online` — at least one of those runtimes is online; runs can start.
      - `offline` — the daemon registered runtimes here and none is online.
        `daemonLastSeenAt` says when it was last heard from. A daemon is marked
        offline once its heartbeat falls behind the staleness threshold, so
        this lags the machine going away by that window.
      - `unregistered` — no runtime for this daemon exists in this company at
        all. Not "offline for a while": the row is permanently dead and the fix
        is to re-add the directory, not to wait.
    enum: [online, offline, unregistered]


  ResourceMetadata:
    type: object
    description: |
      Free-form per-resource document, currently always `{}` for
      `local_directory`. Response-only: it is not accepted on the update path.
    additionalProperties: true


  SearchResult:
    description: |
      Discriminated by `kind` — **branch on it before reading any other
      field.** Navigation takes `routeKind` plus the conversation, which is
      `conversationId` on a task or message hit and `id` on a conversation hit,
      because a conversation hit *is* its conversation.
    oneOf:
      - type: object
        title: SearchTaskResult
        required: [kind, id, key, number, title, status, priority, agent, conversationId, routeKind, updatedAt]
        properties:
          kind: { type: string, const: task }
          id: { type: string, format: uuid }
          key: { type: string }
          number:
            type: integer
            format: int64
            description: |
              What every surface displays as `{taskPrefix}-{number}`. The
              query matches that label as well as `key`, so a person can
              type what they read off the board.
          title: { type: string }
          status: { $ref: './_common.yaml#/schemas/TaskStatus' }
          priority: { type: string }
          agent:
            description: |
              The assignee agent. A task that is not assigned to an active
              agent is invisible to search, so this is never null on a task
              hit.
            $ref: './_common.yaml#/schemas/NamedRef'
          conversationId: { type: string, format: uuid }
          routeKind: { $ref: '#/schemas/SearchRouteKind' }
          updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      - type: object
        title: SearchConversationResult
        required: [kind, id, title, agent, routeKind, updatedAt]
        properties:
          kind: { type: string, const: conversation }
          id:
            type: string
            format: uuid
            description: |
              The conversation. There is no separate `conversationId` on this
              variant and no `taskId`: only `direct` conversations the caller
              created themselves are searchable, so a task id would always be
              null.
          title: { type: string }
          agent:
            description: The conversation's counterpart agent.
            $ref: './_common.yaml#/schemas/NamedRef'
          routeKind: { $ref: '#/schemas/SearchRouteKind' }
          updatedAt: { $ref: './_common.yaml#/schemas/Timestamp' }
      - type: object
        title: SearchMessageResult
        required:
          - kind
          - id
          - seq
          - conversationId
          - conversationKind
          - taskId
          - agent
          - key
          - number
          - title
          - snippet
          - author
          - routeKind
          - createdAt
        properties:
          threadRootId: {type: [string, "null"], format: uuid}
          kind: { type: string, const: message }
          id:
            type: string
            format: uuid
            description: |
              The message. Named `id` like every other element of the union —
              it was `messageId` with no `id` at all, so the union disagreed
              with itself about identity.
          seq: { type: integer, format: int64, example: 41 }
          conversationId: { type: string, format: uuid }
          conversationKind: { type: string, enum: [task, direct, human_direct, channel] }
          taskId:
            type: [string, "null"]
            format: uuid
            description: |
              `null` on a direct-conversation hit. The query used to substitute
              the all-zeros UUID here, which clients followed as if it were a
              real task.
          agent:
            description: The conversation's agent.
            oneOf:
              - { $ref: './_common.yaml#/schemas/NamedRef' }
              - { type: "null" }
          key:
            type: [string, "null"]
            description: The task key when the hit is inside a task conversation.
          number:
            type: [integer, "null"]
            format: int64
            description: The task number when the hit is inside a task conversation.
          title: { type: string }
          snippet:
            type: string
            description: |
              Whitespace-collapsed, capped at 240 runes, windowed around the
              first query token.
          author:
            description: |
              The same actor ref the roster carries. A deleted author resolves
              to `name: "Unknown"`.
            $ref: './_common.yaml#/schemas/ActorRef'
          routeKind: { $ref: '#/schemas/SearchRouteKind' }
          createdAt: { $ref: './_common.yaml#/schemas/Timestamp' }


  SearchRouteKind:
    type: string
    description: |
      Where the client should navigate for this hit. A **different** enum from
      the result `kind`.

      This replaces the former nested `route` object, which grouped nothing: on
      a message hit it repeated `conversationId`, `taskId` and `agentId`
      verbatim from the element containing it, so every message result
      shipped the same values twice with nothing to say which copy was
      authoritative. `route.kind` carried the only information the object
      owned.
    enum: [task, direct_conversation, task_conversation, discussion]

  InvitableRole:
    type: string
    description: The role an invitation or share link grants. Never `owner`.
    enum: [admin, member]
  ShareLinkReset:
    type: object
    additionalProperties: false
    required: [expectedRevision]
    properties:
      expectedRevision: { type: integer, format: int64, minimum: 1 }
      role: { $ref: '#/schemas/InvitableRole' }
  CompanyInvitation:
    type: object
    required: [id, email, role, status, deliveryStatus, expiresAt, createdAt, renewalRequestedAt, revision]
    properties:
      id: { type: string, format: uuid }
      email: { type: string }
      role:
        description: The role accepting grants; always `admin` or `member`.
        $ref: '#/schemas/CompanyRole'
      status: { type: string, enum: [pending, accepted, revoked, expired] }
      deliveryStatus: { type: string, enum: [queued, sending, sent, failed, cancelled] }
      expiresAt: { type: string, format: date-time }
      createdAt: { type: string, format: date-time }
      renewalRequestedAt: { type: [string, 'null'], format: date-time }
      revision: { type: integer, format: int64 }
  InvitationCollection:
    type: object
    required: [items, enabled]
    properties:
      enabled: { type: boolean }
      items:
        type: array
        items: { $ref: '#/schemas/CompanyInvitation' }
  InvitationResults:
    type: object
    required: [items]
    properties:
      items:
        type: array
        items:
          type: object
          required: [email, outcome, invitation]
          properties:
            email: { type: string }
            outcome: { type: string, enum: [queued, alreadyMember, alreadyInvited] }
            invitation:
              oneOf:
                - { $ref: '#/schemas/CompanyInvitation' }
                - { type: 'null' }
  CompanyShareLink:
    type: object
    required: [url, role, expiresAt, revision, available]
    properties:
      url: { type: [string, 'null'], format: uri }
      role:
        description: The role the link grants; `member` before any link was created.
        $ref: '#/schemas/CompanyRole'
      expiresAt: { type: [string, 'null'], format: date-time }
      revision: { type: integer, format: int64, minimum: 0 }
      available: { type: boolean }
  InvitationPreview:
    type: object
    required: [type, companyId, companyName, inviterName, maskedEmail, role, state, expiresAt]
    properties:
      type: { type: string, enum: [email, link] }
      companyId: { type: string, format: uuid }
      companyName: { type: string }
      inviterName: { type: string }
      maskedEmail: { type: string }
      role:
        description: The role accepting grants.
        $ref: '#/schemas/CompanyRole'
      state: { type: string, enum: [pending, accepted, revoked, expired, replaced, wrong-account, already-member, removed] }
      expiresAt: { type: string, format: date-time }
  InvitationAcceptance:
    type: object
    required: [company, outcome]
    properties:
      company: { $ref: '#/schemas/Company' }
      outcome: { type: string, enum: [joined, alreadyMember] }
