# Packages a desktop build after .github/actions/desktop-setup: signed and
# notarized installers on macOS, an unsigned zip on Linux. Used by the release's
# desktop job (prod) and by desktop-dev.yml (dev). The Apple credentials come in
# as inputs from the caller's protected environment and reach only the keychain
# and signing steps; the signing step runs the build tools from node_modules,
# which can reach the unlocked keychain and the notary key while it runs. The
# keychain and key file are removed whatever the outcome.
name: Desktop package
description: Sign, notarize and package the desktop app for one platform.

inputs:
  platform:
    description: "darwin or linux"
    required: true
  certificate-base64:
    description: "Developer ID Application certificate (.p12), base64; macOS only"
    required: false
    default: ""
  certificate-password:
    description: "Password of the .p12; macOS only"
    required: false
    default: ""
  sign-identity:
    description: "Signing identity name; macOS only"
    required: false
    default: ""
  notary-api-key-base64:
    description: "App Store Connect API key (.p8), base64; macOS only"
    required: false
    default: ""
  notary-api-key-id:
    description: "App Store Connect API key ID; macOS only"
    required: false
    default: ""
  notary-api-issuer:
    description: "App Store Connect API issuer ID; macOS only"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Load the signing identity into a temporary keychain
      if: inputs.platform == 'darwin'
      shell: bash
      env:
        CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        NOTARY_API_KEY_BASE64: ${{ inputs.notary-api-key-base64 }}
      run: |
        set -euo pipefail
        if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$NOTARY_API_KEY_BASE64" ]; then
          echo "::error::The signing certificate and notary key are missing; check the environment's secrets."
          exit 1
        fi
        keychain_password="$(uuidgen)"
        keychain="$RUNNER_TEMP/zenith-team-release.keychain-db"
        certificate="$RUNNER_TEMP/zenith-team-mac-certificate.p12"
        notary_key="$RUNNER_TEMP/zenith-team-notary-api-key.p8"
        printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
        printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$notary_key"
        chmod 600 "$certificate" "$notary_key"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        # Only codesign may use the key; exporting it is refused.
        security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
        # Keep the existing search list and put the release keychain first.
        keychains=("$keychain")
        while IFS= read -r line; do
          line="${line//\"/}"
          keychains+=("${line//[[:space:]]/}")
        done < <(security list-keychains -d user)
        security list-keychains -d user -s "${keychains[@]}"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
        rm -f "$certificate"
    - name: Make signed and notarized macOS installers
      if: inputs.platform == 'darwin'
      shell: bash
      working-directory: frontend
      env:
        # Written by the keychain step; the build reads the key from this file.
        ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY: ${{ runner.temp }}/zenith-team-notary-api-key.p8
        ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY: ${{ inputs.sign-identity }}
        ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID: ${{ inputs.notary-api-key-id }}
        ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER: ${{ inputs.notary-api-issuer }}
        # The renderer build needs more than Node's default heap.
        NODE_OPTIONS: --max-old-space-size=4096
      run: pnpm electron:make:mac:signed
    - name: Make the Linux zip
      if: inputs.platform == 'linux'
      shell: bash
      working-directory: frontend
      env:
        NODE_OPTIONS: --max-old-space-size=4096
      run: pnpm electron:make
    - name: Remove the signing identity
      if: always() && inputs.platform == 'darwin'
      shell: bash
      run: |
        security delete-keychain "$RUNNER_TEMP/zenith-team-release.keychain-db" || true
        rm -f "$RUNNER_TEMP/zenith-team-notary-api-key.p8"
