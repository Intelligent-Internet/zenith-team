# Shared setup for every desktop build: the release's signed desktop job and
# the CI desktop lane. It installs the toolchain and the frontend dependencies,
# then chooses the build variant. It sees no secrets, so nothing a dependency
# runs at install time can read them; callers sign afterwards, in a step that
# runs the build tools from node_modules. It restores no
# cache, so a release build never uses what another run wrote.
name: Desktop setup
description: Install the desktop build toolchain and dependencies, and choose the build variant.

inputs:
  api-origin:
    description: "Server origin for a prod build, https without a trailing slash; empty builds the local variant"
    required: false
    default: ""
  release-base-url:
    description: "Where releases are served, https without a trailing slash; set, it turns on static auto-updates (needs api-origin)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: frontend/package.json
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.26.x"
        cache: false
    - name: Install the frontend dependencies
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile
    - name: Choose the desktop variant
      shell: bash
      env:
        API_ORIGIN: ${{ inputs.api-origin }}
        RELEASE_BASE_URL: ${{ inputs.release-base-url }}
      run: |
        set -euo pipefail
        for value in "$API_ORIGIN" "$RELEASE_BASE_URL"; do
          if [ -n "$value" ] && [[ ! "$value" =~ ^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._/-]*[A-Za-z0-9._-])?$ ]]; then
            echo "::error::Desktop origins must be https URLs without a trailing slash; got '$value'"
            exit 1
          fi
        done
        if [ -n "$RELEASE_BASE_URL" ] && [ -z "$API_ORIGIN" ]; then
          echo "::error::Auto-updates need a prod build: set api-origin with release-base-url."
          exit 1
        fi
        if [ -n "$API_ORIGIN" ]; then
          {
            echo "ZENITH_TEAM_DESKTOP_ENV=prod"
            echo "ZENITH_TEAM_DESKTOP_PROD_ORIGIN=$API_ORIGIN"
            echo "ZENITH_TEAM_DESKTOP_API_BASE_URL=$API_ORIGIN/api/v1"
            echo "VITE_API_URL=$API_ORIGIN"
          } >> "$GITHUB_ENV"
        else
          {
            echo "ZENITH_TEAM_DESKTOP_ENV=local"
            echo "ZENITH_TEAM_DESKTOP_API_BASE_URL=http://127.0.0.1:8788/api/v1"
            echo "VITE_API_URL=http://127.0.0.1:8788"
          } >> "$GITHUB_ENV"
        fi
        if [ -n "$RELEASE_BASE_URL" ]; then
          {
            echo "ZENITH_TEAM_DESKTOP_AUTO_UPDATE=true"
            echo "ZENITH_TEAM_DESKTOP_AUTO_UPDATE_STATIC_FEED=true"
            echo "ZENITH_TEAM_DESKTOP_AUTO_UPDATE_MANIFEST_URL=$RELEASE_BASE_URL/latest.json"
            echo "ZENITH_TEAM_DESKTOP_AUTO_UPDATE_FEED_BASE_URL=$RELEASE_BASE_URL/updates"
          } >> "$GITHUB_ENV"
        fi
