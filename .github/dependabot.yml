# Weekly dependency updates, grouped so minor and patch bumps arrive as one
# pull request per ecosystem. The cooldown skips versions younger than a week,
# which keeps a freshly compromised release out of the queue.
#
# Paused for now: open-pull-requests-limit: 0 on every ecosystem stops version
# update pull requests (GitHub's documented way to pause them), and security
# update pull requests are off under Settings -> Code security. Dependabot
# alerts stay on. To resume, delete the limit lines (npm had 10) and turn
# security updates back on.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /voice-agent
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    # The workflows, and the composite action the signed builds use.
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/server, /frontend, /voice-agent]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
