# Publishes the server image of one commit as
# ghcr.io/intelligent-internet/zenith-team-server:sha-<full commit>, so a
# deployment can run exactly that commit. It runs on every push to main that
# changes the image, and when someone with write access dispatches it at a
# branch or tag. A commit whose image already exists is skipped.
#
# It only builds and publishes, through build-image.yml; nothing here deploys,
# and it takes no inputs, so a run shows nothing but the commit it built. Pull
# requests never run it, so fork code cannot publish an image.
name: Image

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/image.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

# One run per commit. A second request for the same commit waits, then finds
# the image and skips.
concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  server:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-image.yml
    with:
      image: server
      skip-existing: true
