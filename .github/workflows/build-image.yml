# Reusable: builds one image (server, web or voice) of the calling commit for
# linux/amd64 and linux/arm64, each on a native runner, and publishes it as one
# multi-arch image tagged sha-<commit> plus the caller's tags to a Google
# Artifact Registry repository. It publishes from the caller's GitHub
# environment (dev for build-deploy.yml, prod for release.yml), signing in
# through Workload Identity Federation as that environment's GCP_DEPLOYER_SA.
#
# The build jobs hold no registry credentials: they run the Dockerfile and
# upload an OCI archive that carries the image's SBOM and provenance. Only the
# publish job can write to a registry, and it never checks out or runs project
# code. It pushes each archive by digest, merges them into one image, and
# attests the merged digest's build provenance. No cache is restored, so
# nothing another run wrote reaches a published image.
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: "server, web or voice"
        required: true
        type: string
      version:
        description: "VERSION build argument; empty means dev-<short commit>"
        required: false
        type: string
        default: ""
      tags:
        description: "Tags to add besides sha-<commit>, one per line"
        required: false
        type: string
        default: ""
      gcp-image:
        description: "Image name without a tag, <region>-docker.pkg.dev/<project>/<repository>/<name>"
        required: true
        type: string
      gcp-environment:
        description: "GitHub environment to publish from; it holds GCP_DEPLOYER_SA"
        required: true
        type: string
    outputs:
      image:
        description: "The image name, without a tag"
        value: ${{ jobs.plan.outputs.image }}
      digest:
        description: "The published digest"
        value: ${{ jobs.publish.outputs.digest }}

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      image: ${{ steps.plan.outputs.image }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      context: ${{ steps.plan.outputs.context }}
      registry-host: ${{ steps.plan.outputs.registry-host }}
    steps:
      - name: Resolve the image
        id: plan
        env:
          IMAGE: ${{ inputs.image }}
          GCP_IMAGE: ${{ inputs.gcp-image }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          # Release tags such as 1.3.0 or latest come only from a version-tag
          # run, so no branch run can repoint them through this workflow.
          if [ -n "$(printf '%s' "$TAGS" | tr -d '[:space:]')" ] && [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9] ]]; then
            echo "::error::Extra image tags are allowed only from a version tag, not $GITHUB_REF"
            exit 1
          fi
          case "$IMAGE" in
            server) dockerfile=server/Dockerfile context=. ;;
            web) dockerfile=frontend/Dockerfile context=. ;;
            voice) dockerfile=voice-agent/Dockerfile context=voice-agent ;;
            *) echo "::error::image must be server, web or voice, got '$IMAGE'"; exit 1 ;;
          esac
          if [[ ! "$GCP_IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "::error::gcp-image must be <region>-docker.pkg.dev/<project>/<repository>/<name>, got '$GCP_IMAGE'"
            exit 1
          fi
          {
            echo "image=$GCP_IMAGE"
            echo "dockerfile=$dockerfile"
            echo "context=$context"
            echo "registry-host=${GCP_IMAGE%%/*}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the version
        id: build
        env:
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "version=${VERSION:-dev-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
          echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ needs.plan.outputs.image }}
          tags: |
            type=raw,value=${{ steps.build.outputs.version }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ needs.plan.outputs.context }}
          file: ${{ needs.plan.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.image }}-${{ steps.build.outputs.pair }}
          path: ${{ runner.temp }}/image.tar
          # A re-run of a failed attempt uploads the same name again.
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          # Long enough for "Re-run failed jobs" to reach a failed publish.
          retention-days: 7

  # From the caller's environment: the deploy account is bound to that
  # environment, not to the repository.
  publish:
    needs: [plan, build]
    environment: ${{ inputs.gcp-environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ inputs.image }}-*
          path: archives
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.plan.outputs.registry-host }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - name: Push the platform images and merge them
        id: push
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          refs=()
          for archive in archives/*/image.tar; do
            # The archive's one top-level entry is the platform's index: the
            # image plus its SBOM and provenance. Push it by that digest.
            digest="$(tar -xOf "$archive" index.json | jq -er '.manifests | if length == 1 then .[0].digest else error("expected one manifest") end')"
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
              "oci-archive:$archive" "docker://$IMAGE@$digest"
            refs+=("$IMAGE@$digest")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "::error::Expected 2 platform archives, got ${#refs[@]}"
            exit 1
          fi

          tag_args=(-t "$IMAGE:sha-$GITHUB_SHA")
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_args+=(-t "$IMAGE:$tag")
            fi
          done <<< "$TAGS"

          # The digest of the exact index about to be pushed. Attesting it,
          # not whatever a tag points at afterwards, keeps a concurrent run
          # for the same commit from swapping the subject.
          index="$(docker buildx imagetools create --dry-run "${refs[@]}")"
          digest="sha256:$(printf '%s' "$index" | sha256sum | cut -d' ' -f1)"
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          docker buildx imagetools inspect --raw "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::Published $IMAGE:sha-$GITHUB_SHA ($digest)"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          # Artifact Registry's cleanup deletes untagged manifests no image
          # references, which an attestation pushed beside the image is, so
          # the attestation lives on GitHub alone.
          push-to-registry: false
          # The org-level storage record needs artifact-metadata: write, which
          # nothing here needs otherwise.
          create-storage-record: false
