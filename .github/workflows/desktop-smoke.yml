# Manual, unsigned desktop builds that check packaging on each platform.
# Nothing here signs, notarizes, or publishes: the installers are workflow
# artifacts for testing. Windows joins the matrix once `zen` builds there
# (cmd/zen still uses Unix-only terminal and process calls).
name: Desktop Smoke Build

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Server origin for a prod build; empty builds the local variant (http://127.0.0.1:8788)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      API_ORIGIN: ${{ inputs.api_origin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Choose the desktop variant
        shell: bash
        run: |
          origin="${API_ORIGIN%/}"
          if [ -n "$origin" ]; then
            {
              echo "ZENITH_TEAM_DESKTOP_ENV=prod"
              echo "ZENITH_TEAM_DESKTOP_PROD_ORIGIN=$origin"
              echo "ZENITH_TEAM_DESKTOP_API_BASE_URL=$origin/api/v1"
              echo "VITE_API_URL=$origin"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ZENITH_TEAM_DESKTOP_ENV=local"
              echo "ZENITH_TEAM_DESKTOP_API_BASE_URL=http://127.0.0.1:8788/api/v1"
              echo "VITE_API_URL=http://127.0.0.1:8788"
            } >> "$GITHUB_ENV"
          fi
      - name: Make unsigned installers
        working-directory: frontend
        env:
          # The renderer build needs more than Node's default heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm electron:make
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zenith-team-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: frontend/out/make/**
          if-no-files-found: error
          retention-days: 7
