# Pull request titles become squash-merge commit subjects, so they follow
# Conventional Commits: `type(scope): summary`, with `!` for a breaking change.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert|security)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "::error::Use a Conventional Commit title, for example 'fix(daemon): retry the first claim' or 'feat(web)!: drop the old share links'. Allowed types: feat fix docs refactor perf test build ci chore revert security. No trailing period."
          exit 1
