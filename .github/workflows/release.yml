# Publishes a release from a v<major>.<minor>.<patch> tag on main: the server
# and web images to GitHub Container Registry, built by build-image.yml (which
# image.yml shares), and the zen CLI plus the zenith-team-mcp binary to a
# GitHub Release with checksums. When desktop releases are on, the release also
# carries the signed desktop installers and the files a static host needs to
# serve them (see the desktop job). A tag with a -alpha.N, -beta.N or -rc.N
# suffix is a pre-release: it never moves the `latest` image tag, the latest
# GitHub Release or the desktop download and update manifests. A tag push is
# the only event that publishes; only the desktop job uses secrets, from its
# protected environment.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
      image-tags: ${{ steps.tag.outputs.image-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The image tags: the exact version, plus <major>.<minor> and latest for
      # a release that is not a pre-release.
      - name: Check the tag
        id: tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Numeric parts without leading zeros, as SemVer requires.
          num='(0|[1-9][0-9]*)'
          if [[ "$GITHUB_REF_NAME" =~ ^v$num\.$num\.$num$ ]]; then
            prerelease=false
            tags="$version"$'\n'"${version%.*}"$'\n'"latest"
          elif [[ "$GITHUB_REF_NAME" =~ ^v$num\.$num\.$num-(alpha|beta|rc)\.$num$ ]]; then
            prerelease=true
            tags="$version"
          else
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          {
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "image-tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # Release artifacts never restore a cache another run could write.
          cache: false
      # Fail-closed. A maintainer can release one tag anyway by setting the
      # repository variable ALLOW_VULN_BYPASS_FOR_TAG to exactly that tag
      # (see docs/content/docs/developers/releasing.mdx).
      - name: Go vulnerabilities
        env:
          BYPASS_TAG: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG }}
        run: |
          if make go-vuln; then
            exit 0
          fi
          if [ -n "$BYPASS_TAG" ] && [ "$BYPASS_TAG" = "$GITHUB_REF_NAME" ]; then
            echo "::warning::Releasing $GITHUB_REF_NAME with known Go vulnerabilities (ALLOW_VULN_BYPASS_FOR_TAG)."
            exit 0
          fi
          echo "::error::govulncheck found vulnerabilities. Fix them, or set ALLOW_VULN_BYPASS_FOR_TAG=$GITHUB_REF_NAME to release anyway."
          exit 1
      - run: make go-fmt-check
      - run: make go-unit
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      # No pnpm cache, for the same reason as Go above.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm --dir frontend install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: make lint typecheck api-lint api-types-check
      # Before anything publishes: a mismatch found later, in the desktop job,
      # would leave images out with no GitHub Release.
      - name: Require frontend/package.json to match the tag
        if: vars.ZENITH_TEAM_DESKTOP_RELEASE == 'true'
        run: pnpm --dir frontend electron:release:assert-version

  # Each image is built natively per platform and published, with its SBOM,
  # provenance and a build attestation, by build-image.yml. Besides the
  # version tags it gets sha-<commit>, repointed to this build; deployments
  # pin sha-<commit>@<digest>.
  images:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [server, web]
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      version: ${{ needs.verify.outputs.version }}
      tags: ${{ needs.verify.outputs.image-tags }}

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # Release artifacts never restore a cache another run could write.
          cache: false
      - name: Build zen and zenith-team-mcp
        working-directory: server
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./cmd/bundlectl prepare
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          # zen does not build for Windows yet; zenith-team-mcp does.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            stage="$(mktemp -d)"
            if [ "$os" != windows ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION#v}" -o "$stage/zen" ./cmd/zen
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" -o "$stage/zenith-team-mcp$ext" ./cmd/mcp
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md "$stage/"
            tar -C "$stage" -czf "$dist/zenith-team_${VERSION}_${os}_${arch}.tar.gz" .
          done
          (cd "$dist" && sha256sum ./*.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The production desktop app (Zenith Team), built only while the repository
  # variable ZENITH_TEAM_DESKTOP_RELEASE is "true": signed and notarized macOS
  # installers (arm64 and x64) and an unsigned Linux zip. A v* tag always builds
  # prod; desktop-dev.yml builds the dev app. The desktop-prod environment
  # requires a reviewer and holds the Apple credentials plus the variables
  # DESKTOP_API_ORIGIN (the server the app signs in to) and
  # DESKTOP_RELEASE_BASE_URL (where it looks for updates). Installing
  # dependencies sees no secrets. Windows joins once zen builds there.
  desktop:
    needs: verify
    if: vars.ZENITH_TEAM_DESKTOP_RELEASE == 'true'
    environment: desktop-prod
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    name: desktop (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # The publish job has no environment, so it takes the URL from here.
      release-base-url: ${{ steps.settings.outputs.release-base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without both, the shared setup would build the local variant.
      - name: Require the desktop-prod settings
        id: settings
        env:
          API_ORIGIN: ${{ vars.DESKTOP_API_ORIGIN }}
          RELEASE_BASE_URL: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
        run: |
          if [ -z "$API_ORIGIN" ] || [ -z "$RELEASE_BASE_URL" ]; then
            echo "::error::Set DESKTOP_API_ORIGIN and DESKTOP_RELEASE_BASE_URL in the desktop-prod environment."
            exit 1
          fi
          echo "release-base-url=$RELEASE_BASE_URL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/desktop-setup
        with:
          variant: prod
          api-origin: ${{ vars.DESKTOP_API_ORIGIN }}
          release-base-url: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
      - uses: ./.github/actions/desktop-package
        with:
          platform: ${{ matrix.platform }}
          certificate-base64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          sign-identity: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY }}
          notary-api-key-base64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_BASE64 }}
          notary-api-key-id: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID }}
          notary-api-issuer: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            frontend/out/make/**/Zenith-Team-prod-*.dmg
            frontend/out/make/**/Zenith-Team-prod-*.zip
            frontend/out/make/**/Zenith-Team-prod-*.sha256
          if-no-files-found: error
          retention-days: 7

  # Attaches everything to the GitHub Release with build attestations. The
  # desktop files come with release-publish.json and the manifests that tell a
  # static host where each goes (frontend/electron/scripts/write-release-publish.cjs).
  # Copying them to that host happens outside this repository, so it needs no
  # cloud credentials.
  publish:
    needs: [verify, images, binaries, desktop]
    if: >-
      !cancelled() && needs.images.result == 'success' && needs.binaries.result == 'success' &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.desktop.result == 'success'
        with:
          pattern: desktop-*
          path: desktop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.desktop.result == 'success'
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            frontend/electron/scripts
            frontend/electron/shared
      - name: Prepare the desktop release files
        if: needs.desktop.result == 'success'
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          ZENITH_TEAM_DESKTOP_ENV: prod
          ZENITH_TEAM_DESKTOP_RELEASE_BASE_URL: ${{ needs.desktop.outputs.release-base-url }}
        run: node source/frontend/electron/scripts/write-release-publish.cjs --artifacts desktop --out dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zenith Team $TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
