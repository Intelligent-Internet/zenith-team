# Publishes a release from a v<major>.<minor>.<patch> tag on main: the server
# and web images to GitHub Container Registry (build-image.yml, which
# build-deploy.yml shares), and the zen CLI plus the zenith-team-mcp binary to
# a GitHub Release with checksums. While desktop releases are on, it also
# builds the production desktop app (build-desktop.yml), publishes it to the
# prod downloads (publish-desktop.yml) and attaches it to the GitHub Release.
# A tag with a -alpha.N, -beta.N or -rc.N suffix is a pre-release: it never
# moves the `latest` image tag, the latest GitHub Release or the desktop
# download and update manifests. A tag push is the only event that publishes;
# only the desktop jobs use secrets and cloud access, from the prod environment.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A tag publishes only a commit that already passed CI: main-protection
  # requires ci-gate before a merge, and CI runs again on the push to main.
  # This job checks that rather than repeating it, and adds what can change
  # after the merge: newly published Go vulnerabilities.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
      image-tags: ${{ steps.tag.outputs.image-tags }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The image tags: the exact version, plus <major>.<minor> when it is the
      # newest release of that line and latest when it is the newest release
      # of all, so re-running an older release never moves either back.
      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Numeric parts without leading zeros, as SemVer requires.
          num='(0|[1-9][0-9]*)'
          stable="^v$num\.$num\.$num$"
          tags="$version"
          latest=false
          if [[ "$GITHUB_REF_NAME" =~ $stable ]]; then
            prerelease=false
            releases="$(git tag -l 'v*' | grep -E "$stable" | sort -V)"
            if [ "$(printf '%s\n' "$releases" | grep -E "^v${version%.*}\.[0-9]+$" | tail -n 1)" = "$GITHUB_REF_NAME" ]; then
              tags="$tags"$'\n'"${version%.*}"
            fi
            if [ "$(printf '%s\n' "$releases" | tail -n 1)" = "$GITHUB_REF_NAME" ]; then
              tags="$tags"$'\n'"latest"
              latest=true
            fi
          elif [[ "$GITHUB_REF_NAME" =~ ^v$num\.$num\.$num-(alpha|beta|rc)\.$num$ ]]; then
            prerelease=true
          else
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N"
            exit 1
          fi
          echo "Image tags: ${tags//$'\n'/ }"
          {
            echo "prerelease=$prerelease"
            echo "version=$version"
            echo "latest=$latest"
            echo "image-tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Before anything publishes: a mismatch found later, in the desktop build,
      # would leave images out with no GitHub Release.
      - name: Require frontend/package.json to match the tag
        if: vars.ZENITH_TEAM_DESKTOP_RELEASE == 'true'
        working-directory: frontend
        run: node electron/scripts/assert-release-version.cjs
      # A tag pushed right after a merge waits for that push's CI run.
      - name: Require CI to have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # shellcheck disable=SC2016 # $runs is jq's, not the shell's.
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci-gate&filter=latest" --jq '
              [.check_runs[] | select(.app.slug == "github-actions")] as $runs
              | if any($runs[]; .conclusion == "success") then "success"
                elif any($runs[]; .status != "completed") then "running"
                elif ($runs | length) > 0 then "failed"
                else "missing" end')"
            case "$state" in
              success) echo "ci-gate passed on $GITHUB_SHA."; exit 0 ;;
              failed) echo "::error::ci-gate failed on $GITHUB_SHA. If the failure was flaky, re-run that CI run, then re-run this release; otherwise fix main and tag a new version."; exit 1 ;;
            esac
            echo "ci-gate is $state on $GITHUB_SHA; waiting ($attempt/60)."
            sleep 30
          done
          echo "::error::ci-gate did not pass on $GITHUB_SHA within 30 minutes. Run CI on this tag (Actions, CI, Run workflow), then re-run this release."
          exit 1
      # check-latest: the newest 1.26 patch, not the one the runner image has
      # cached. govulncheck judges the standard library of the Go it runs on,
      # and the binaries below are built with the same one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          # Release artifacts never restore a cache another run could write.
          cache: false
      # Fail-closed. A maintainer can release one tag anyway by setting the
      # repository variable ALLOW_VULN_BYPASS_FOR_TAG to exactly that tag
      # (see docs/content/docs/developers/releasing.mdx).
      - name: Go vulnerabilities
        env:
          BYPASS_TAG: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG }}
        run: |
          if make go-vuln; then
            exit 0
          fi
          if [ -n "$BYPASS_TAG" ] && [ "$BYPASS_TAG" = "$GITHUB_REF_NAME" ]; then
            echo "::warning::Releasing $GITHUB_REF_NAME with known Go vulnerabilities (ALLOW_VULN_BYPASS_FOR_TAG)."
            exit 0
          fi
          echo "::error::govulncheck found vulnerabilities. Fix them, or set ALLOW_VULN_BYPASS_FOR_TAG=$GITHUB_REF_NAME to release anyway."
          exit 1

  # Each image is built natively per platform and published, with its SBOM,
  # provenance and a build attestation, by build-image.yml. Besides the
  # version tags it gets sha-<commit>, repointed to this build; deployments
  # pin sha-<commit>@<digest>.
  images:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # The voice worker is not released for now; it comes back as one more
        # entry here once its GHCR package lets this repository write to it.
        image: [server, web]
    uses: ./.github/workflows/build-image.yml
    with:
      image: ${{ matrix.image }}
      version: ${{ needs.verify.outputs.version }}
      tags: ${{ needs.verify.outputs.image-tags }}

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          # Release artifacts never restore a cache another run could write.
          cache: false
      - name: Build zen and zenith-team-mcp
        working-directory: server
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./cmd/bundlectl prepare
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          # zen does not build for Windows yet; zenith-team-mcp does.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=".exe"
            stage="$(mktemp -d)"
            if [ "$os" != windows ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION#v}" -o "$stage/zen" ./cmd/zen
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION#v}" -o "$stage/zenith-team-mcp$ext" ./cmd/mcp
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md "$stage/"
            tar -C "$stage" -czf "$dist/zenith-team_${VERSION}_${os}_${arch}.tar.gz" .
          done
          (cd "$dist" && sha256sum ./*.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The production desktop app (Zenith Team), while the repository variable
  # ZENITH_TEAM_DESKTOP_RELEASE is "true". The prod environment admits only
  # main and v* tags and holds the Apple credentials, the app's server and
  # update URLs, and the account that writes the prod downloads.
  desktop:
    needs: verify
    if: vars.ZENITH_TEAM_DESKTOP_RELEASE == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: prod
      version: ${{ needs.verify.outputs.version }}
    # Resolved in desktop-signing, where only the macOS jobs run.
    secrets:
      ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_BASE64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_BASE64 }}
      ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_PASSWORD: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_PASSWORD }}
      ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY }}
      ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_BASE64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_BASE64 }}
      ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID }}
      ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER }}

  # Only once the images and binaries exist too, so a failed release never
  # leaves its desktop app downloadable on its own.
  desktop-publish:
    needs: [verify, images, binaries, desktop]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-desktop.yml
    with:
      channel: prod
      version: ${{ needs.verify.outputs.version }}

  # Attaches everything to the GitHub Release with build attestations; the
  # desktop files and manifests come attested from publish-desktop.yml.
  publish:
    needs: [verify, images, binaries, desktop, desktop-publish]
    if: >-
      !cancelled() && needs.images.result == 'success' && needs.binaries.result == 'success' &&
      (needs.desktop-publish.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.desktop-publish.result == 'success'
        with:
          name: ${{ needs.desktop-publish.outputs.artifact }}
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          LATEST: ${{ needs.verify.outputs.latest }}
        run: |
          # Only the newest stable release becomes GitHub's latest one.
          flags=(--latest="$LATEST")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zenith Team $TAG" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
