# Signed builds of Zenith Team Dev, the desktop app for the dev server, started
# by hand from main (Actions tab, "Run workflow"). Zenith Team Dev installs next
# to Zenith Team and updates from its own channel. Release tags (v*) always
# build the production app, in release.yml; this workflow never does.
#
# Each run builds version <X.Y.Z of frontend/package.json>-dev.<run number>, so
# dev updates always move forward, and publishes a GitHub pre-release
# desktop-dev-v<version> that is never marked latest. Its files carry build
# attestations and the dev channel's manifests, for a static host to copy.
#
# The desktop-dev environment, limited to main, holds the Apple credentials and
# the variables DESKTOP_API_ORIGIN (the dev server) and
# DESKTOP_RELEASE_BASE_URL (where the dev app looks for updates). Only the macOS
# jobs reference the credentials, each secret in the one step that needs it;
# the Linux job references none.
name: Desktop Dev

on:
  workflow_dispatch:

# One dev build at a time; a newer request waits rather than cancelling one
# that is signing or publishing.
concurrency:
  group: desktop-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: frontend/package.json
          sparse-checkout-cone-mode: false
      - name: Choose the dev version
        id: version
        run: |
          set -euo pipefail
          package_version="$(jq -r .version frontend/package.json)"
          num='(0|[1-9][0-9]*)'
          # The X.Y.Z core: main may carry an -rc.N version while a pre-release
          # is being cut.
          if [[ ! "$package_version" =~ ^($num\.$num\.$num)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::frontend/package.json has no X.Y.Z version: '$package_version'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}-dev.$GITHUB_RUN_NUMBER"
          {
            echo "version=$version"
            echo "tag=desktop-dev-v$version"
          } >> "$GITHUB_OUTPUT"

  desktop-macos:
    needs: plan
    environment: desktop-dev
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    name: desktop (darwin ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # The publish job has no environment, so it takes the URL from here.
      release-base-url: ${{ steps.settings.outputs.release-base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without both, the shared setup would build the local variant.
      - name: Require the desktop-dev settings
        id: settings
        env:
          API_ORIGIN: ${{ vars.DESKTOP_API_ORIGIN }}
          RELEASE_BASE_URL: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
        run: |
          if [ -z "$API_ORIGIN" ] || [ -z "$RELEASE_BASE_URL" ]; then
            echo "::error::Set DESKTOP_API_ORIGIN and DESKTOP_RELEASE_BASE_URL in the desktop-dev environment."
            exit 1
          fi
          echo "release-base-url=$RELEASE_BASE_URL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/desktop-setup
        with:
          variant: dev
          api-origin: ${{ vars.DESKTOP_API_ORIGIN }}
          release-base-url: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
      # The app and its file names carry the version from package.json.
      - name: Stamp the dev version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "frontend/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: Load the signing identity into a temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$NOTARY_API_KEY_BASE64" ]; then
            echo "::error::The signing certificate and notary key are missing; check the desktop-dev environment's secrets."
            exit 1
          fi
          keychain_password="$(uuidgen)"
          keychain="$RUNNER_TEMP/zenith-team-release.keychain-db"
          certificate="$RUNNER_TEMP/zenith-team-mac-certificate.p12"
          notary_key="$RUNNER_TEMP/zenith-team-notary-api-key.p8"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$notary_key"
          chmod 600 "$certificate" "$notary_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Only codesign may use the key; exporting it is refused.
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          # Keep the existing search list and put the release keychain first.
          keychains=("$keychain")
          while IFS= read -r line; do
            line="${line//\"/}"
            keychains+=("${line//[[:space:]]/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          rm -f "$certificate"
      - name: Make signed and notarized macOS installers
        working-directory: frontend
        env:
          ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_SIGN_IDENTITY }}
          ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY_ID }}
          ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER: ${{ secrets.ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_ISSUER }}
          # Written by the keychain step; the build reads the key from this file.
          ZENITH_TEAM_DESKTOP_MAC_NOTARY_API_KEY: ${{ runner.temp }}/zenith-team-notary-api-key.p8
          # The renderer build needs more than Node's default heap.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm electron:make:mac:signed
      - name: Remove the signing identity
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zenith-team-release.keychain-db" || true
          rm -f "$RUNNER_TEMP/zenith-team-notary-api-key.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dev-darwin-${{ matrix.arch }}
          path: |
            frontend/out/make/**/Zenith-Team-dev-*.dmg
            frontend/out/make/**/Zenith-Team-dev-*.zip
            frontend/out/make/**/Zenith-Team-dev-*.sha256
          if-no-files-found: error
          retention-days: 7

  # Unsigned, so it references no secret: the runner never holds the Apple
  # credentials. The environment still supplies the server and update URL.
  desktop-linux:
    needs: plan
    environment: desktop-dev
    name: desktop (linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Without both, the shared setup would build the local variant.
      - name: Require the desktop-dev settings
        id: settings
        env:
          API_ORIGIN: ${{ vars.DESKTOP_API_ORIGIN }}
          RELEASE_BASE_URL: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
        run: |
          if [ -z "$API_ORIGIN" ] || [ -z "$RELEASE_BASE_URL" ]; then
            echo "::error::Set DESKTOP_API_ORIGIN and DESKTOP_RELEASE_BASE_URL in the desktop-dev environment."
            exit 1
          fi
          echo "release-base-url=$RELEASE_BASE_URL" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/desktop-setup
        with:
          variant: dev
          api-origin: ${{ vars.DESKTOP_API_ORIGIN }}
          release-base-url: ${{ vars.DESKTOP_RELEASE_BASE_URL }}
      # The app and its file names carry the version from package.json.
      - name: Stamp the dev version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "frontend/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
      - name: Make the Linux zip
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm electron:make
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-dev-linux-x64
          path: |
            frontend/out/make/**/Zenith-Team-dev-*.dmg
            frontend/out/make/**/Zenith-Team-dev-*.zip
            frontend/out/make/**/Zenith-Team-dev-*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-dev-*
          path: desktop
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          sparse-checkout: |
            frontend/electron/scripts
            frontend/electron/shared
      - name: Prepare the dev release files
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          ZENITH_TEAM_DESKTOP_ENV: dev
          ZENITH_TEAM_DESKTOP_RELEASE_BASE_URL: ${{ needs.desktop-macos.outputs.release-base-url }}
        run: node source/frontend/electron/scripts/write-release-publish.cjs --artifacts desktop --out dist --tag "$TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the dev pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Zenith Team Dev $VERSION" \
            --notes "Dev build of $GITHUB_SHA for the dev server; not a release." \
            --prerelease \
            --latest=false
