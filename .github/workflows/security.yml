# Secret, workflow, and dependency scanning. Secrets and workflow checks
# block a pull request; the dependency audits report findings in the job
# summary without failing, because Dependabot opens the upgrade PRs.
name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Mondays 04:17 UTC: catch advisories published since the last change.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # gitleaks runs as the open-source CLI over the checked-out tree; the
  # gitleaks GitHub Action needs a paid license for organizations.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
      - run: uvx zizmor@1.30.1 --min-severity medium .github/workflows

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Go vulnerabilities (govulncheck)
        working-directory: server
        run: |
          go run ./cmd/bundlectl prepare
          {
            echo '## Go vulnerabilities'
            echo '```'
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Frontend runtime dependencies (pnpm audit, high and above)
        working-directory: frontend
        run: |
          {
            echo '## Frontend runtime dependencies'
            echo '```'
            pnpm audit --prod --audit-level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
