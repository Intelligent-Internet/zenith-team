# Standalone private browser deployment. Do not merge into production Compose:
# merging could restore published API ports or inherit unrelated credentials.
name: zenith-team-minimal

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *hardened
    image: zenith-team-server:minimal-local
    build:
      context: ../..
      dockerfile: server/Dockerfile
      args:
        BUILD_IMAGE: golang:1.26-alpine@sha256:27f2d3b83cfc5803c8078f8e730af0f7c431bf067afaec8f60a36fb763187cba
        RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
        BUILD_TAGS: zenith_minimal,nomsgpack
    user: "65532:65532"
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777"]
    networks: [api, state]
    environment:
      # Deliberate allowlist: no env_file, host cloud credentials, or plugins.
      APP_ENVIRONMENT: production
      APP_HTTP_ADDR: :8788
      APP_DATABASE_URL: postgresql://zenith_team:${APP_POSTGRES_PASSWORD:?run make selfhost-env}@postgres:5432/zenith_team?sslmode=disable
      APP_REDIS_URL: redis://redis:6379/0
      AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:?run make selfhost-env}
      AUTH_WEB_ORIGINS: ${AUTH_WEB_APP_ORIGIN:-http://localhost:8080}
      AUTH_WEB_APP_ORIGIN: ${AUTH_WEB_APP_ORIGIN:-http://localhost:8080}
      APP_DATABASE_MAX_CONNS: "25"
      APP_DATABASE_MIN_CONNS: "5"
      APP_SCHEDULE_WORKERS: "4"
      STORAGE_DRIVER: s3
      STORAGE_S3_BUCKET: zenith-team-attachments
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ENDPOINT: http://storage:9000
      STORAGE_S3_ACCESS_KEY_ID: zenith-team
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?run make selfhost-env}
      STORAGE_S3_USE_PATH_STYLE: "true"
      HUDDLES_ENABLED: "false"
      HUDDLE_AI_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /usr/local/bin/zenith-team-readyz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    <<: *hardened
    image: zenith-team-web:minimal-local
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        BUILD_IMAGE: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
        RUNTIME_IMAGE: caddy:2.11-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    mem_limit: 256m
    cpus: 1
    ports: ["127.0.0.1:${ZENITH_TEAM_MINIMAL_WEB_PORT:-8080}:8080"]
    networks: [edge, api]
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /data:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    environment:
      ZENITH_TEAM_ALLOW_SIGNUP: ${ZENITH_TEAM_ALLOW_SIGNUP:-false}
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    <<: *hardened
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    user: postgres
    mem_limit: 1g
    cpus: 2
    networks: [state]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=1777
    environment:
      POSTGRES_DB: zenith_team
      POSTGRES_USER: zenith_team
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?run make selfhost-env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, zenith_team, -d, zenith_team]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    <<: *hardened
    image: redis:7.4-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    user: redis
    mem_limit: 512m
    cpus: 1
    networks: [state]
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction, --maxmemory, 256mb]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  storage:
    <<: *hardened
    image: zenith-team-storage:minimal-local
    build:
      context: .
      dockerfile: storage.Dockerfile
    user: "65532:65532"
    mem_limit: 1g
    cpus: 2
    networks: [state]
    command: [server, /data]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777"]
    environment:
      MINIO_ROOT_USER: zenith-team
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:?run make selfhost-env}
      MINIO_BROWSER: "off"
    volumes: [storage-data:/data]
    healthcheck:
      test: [CMD, silo, healthcheck, ready]
      interval: 5s
      timeout: 3s
      retries: 30

  storage-init:
    <<: *hardened
    restart: "no"
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    user: "65532:65532"
    mem_limit: 128m
    cpus: 1
    networks: [state]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777"]
    depends_on:
      storage: {condition: service_healthy}
    environment:
      SECRET_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?run make selfhost-env}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mcli --config-dir /tmp/mcli alias set local http://storage:9000 zenith-team "$$SECRET_KEY" >/dev/null
        mcli --config-dir /tmp/mcli mb --ignore-existing local/zenith-team-attachments

networks:
  edge: {}
  api: {internal: true}
  state: {internal: true}

volumes:
  postgres-data:
  redis-data:
  storage-data:
