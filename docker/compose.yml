name: zenith-team

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zenith_team
      POSTGRES_USER: zenith_team
      POSTGRES_PASSWORD: zenith_team
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith_team -d zenith_team"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--maxmemory", "256mb"]
    ports:
      - "${APP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: zenith-team
      MINIO_ROOT_PASSWORD: zenith-team-development-secret
    ports:
      - "${APP_MINIO_PORT:-9000}:9000"
      - "${APP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Keep the old volume name so existing development objects remain available.
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  silo-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mcli alias set zenith-team http://silo:9000 zenith-team zenith-team-development-secret
        mcli mb --ignore-existing zenith-team/zenith-team-attachments

  # Media server for Huddles (calls, screen sharing, voice Agents).
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    volumes:
      - ./livekit.docker.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
  minio-data:
