name: boardly

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardly
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly
    ports:
      - "${APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardly -d boardly"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--maxmemory", "256mb"]
    ports:
      - "${APP_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: boardly
      MINIO_ROOT_PASSWORD: boardly-development-secret
    ports:
      - "${APP_MINIO_PORT:-9000}:9000"
      - "${APP_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Keep the old volume name so existing development objects remain available.
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  silo-init:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mcli alias set boardly http://silo:9000 boardly boardly-development-secret
        mcli mb --ignore-existing boardly/boardly-attachments

volumes:
  postgres-data:
  redis-data:
  minio-data:
