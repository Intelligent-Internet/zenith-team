# Local development configuration for a native
# `livekit-server --config docker/livekit.dev.yaml`. `make infra-up` runs the
# Docker equivalent, livekit.docker.yaml. Development keys only.
port: 7880

keys:
  devkey: development-only-livekit-api-secret

webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:8788/api/v1/internal/livekit/webhook
