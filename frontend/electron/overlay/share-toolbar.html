<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Screen sharing</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font:
          600 12px/1 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        user-select: none;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        height: 100%;
        padding: 0 8px 0 14px;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 14px;
        background: rgb(28 30 33 / 94%);
        color: #f4f5f6;
        -webkit-app-region: drag;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-right: 6px;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2bac76;
        box-shadow: 0 0 0 3px rgb(43 172 118 / 28%);
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 34px;
        min-width: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 10px;
        background: rgb(255 255 255 / 8%);
        color: inherit;
        font: inherit;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      button:hover {
        background: rgb(255 255 255 / 16%);
      }
      button:focus-visible {
        outline: 2px solid #2bac76;
        outline-offset: 1px;
      }
      button.off {
        background: #c4424f;
        color: #fff;
      }
      button.stop {
        background: #c4424f;
        color: #fff;
      }
      button.stop:hover,
      button.off:hover {
        background: #d14c59;
      }
      body:not([data-muted="true"]) .icon-mic-off,
      body[data-muted="true"] .icon-mic,
      body:not([data-camera="true"]) .icon-camera,
      body[data-camera="true"] .icon-camera-off {
        display: none;
      }
    </style>
  </head>
