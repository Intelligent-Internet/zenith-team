<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
      }
      /* Marks the screen being shared, like a recording light. */
      body {
        box-sizing: border-box;
        border: 4px solid #2bac76;
      }
    </style>
  </head>
  <body></body>
</html>
